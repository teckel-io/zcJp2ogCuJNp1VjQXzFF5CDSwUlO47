    try {
      const r = await P.action("settings_link", {});
      const ok = !!(r && r.success && typeof r.url === "string" && SETTINGS_PAGE.test(r.url));
      if (!ok) {
        if (w) { try { w.close(); } catch(e) {} }
        if ((r && r.success) || SETTINGS_OFF.indexOf(codeOf(r)) !== -1) { settingsOff(); return; }
        if (lapsed(r)) return;                       /* the door has greyed the page and raised the code row */
        st.btn.title = "Settings could not be opened just now. Please try again.";
        return;
      }
      st.btn.removeAttribute("title");
      if (w && !w.closed) {
        try { w.location.replace(r.url); return; } catch(e) { /* fall through: this tab goes to it */ }
      }
      window.location.assign(r.url);
    } finally {
      st.busy = false;
    }
  }
  if (st.btn) st.btn.addEventListener("click", function () { openSettings(); });

  /* ══ SIGNING INSIDE THE PAGE (26 Oct 2026, page 2.2.433 G7 — tcc's runs 46 and 51; Yusuf, in DA CC's session: "YES TO
        BOTH") ═══════════════════════════════════════════════════════════════════════════════════════════════════════
     On a phone the signing page in a NEW TAB, in front for a minute or more, suspended this page and the conversation
     dropped ("Disconnected" while the user signed). window.teckelSignInPage opens the signing page INSIDE this page: a
     frame in a modal panel over the form. Nothing behind it changes — the conversation socket, the microphone, the walk,
     the form in the viewer — so the conversation carries on and the walk is where it was.
       · open(url, opts): a signing-page link of a trusted origin only (window.teckelPageLink, the same check as before). The
         panel is READY when the signing page says so ({type:"teckel-sign-ready"} from that frame, a trusted origin) or, on
         this page's own origin, when the document loaded IS the signing page (its own elements). A document that is not (an
         error page), or no word within SIGN_READY_MS from another origin, is "cannot load": the panel closes and
         opts.onFail() runs — the caller's FALLBACK, the new tab (or its link). Returns a handle {close()}, or null when the
         panel is not available (the caller then opens the tab as before).
       · {type:"teckel-sign-saved", signed, required} from that frame (the signing page, after a signature was saved and its
         session read again): opts.onSaved({signed, required}). A CUE ONLY — a caller asks the server (form_fields,
         submit_preview) before its walk moves; the counts decide nothing but whether My forms' panel can close.
       · Close, Escape, a lapse or a sign-out closes it: opts.onClose(why, saved) — why "user" | "done" | "lapse" |
         "replaced"; saved = how many saves the signing page reported while it was open.
       · A message from anywhere else (another frame, this page itself, an untrusted origin) is ignored.
     ⚠ The signing page carries its own opaque link token, exactly as the e-mailed link does; this page never reads it and
       stores nothing. The frame is removed when the panel closes. tab(url): the fallback's new tab, opened now. */
  const SIGN_READY_MS = 8000;
  const sgx = { dlg: $("pp-sign"), host: $("pp-sign-host"), msg: $("pp-sign-msg"), close: $("pp-sign-close") };
  let sgCur = null;
  function sgLog(why){ try { console.info("[teckel-sign] " + why); } catch(e) {} }   /* never a value */
  function sgAvailable(){ return !!(sgx.dlg && sgx.host && typeof sgx.dlg.showModal === "function"); }
  // an origin this page trusts: the same list every link check uses (teckelPageLink's)
  function sgTrusted(origin){ return typeof origin === "string" && origin !== "null" && SIGN_PAGE.test(origin + "/sign.html?x=1"); }
  function sgClose(why){
    const g = sgCur;
    if (!g) return;
    sgCur = null;
    clearTimeout(g.timer);
    try { if (g.frame) g.frame.remove(); } catch(e) {}
    txt(sgx.msg, "");
    closeDlg(sgx.dlg);
    sgLog("the signing panel closed (" + why + ")");
    const cb = why === "fail" ? g.opts.onFail : g.opts.onClose;
    try { if (typeof cb === "function") cb(why, g.saved); } catch(e) {}
  }
  function sgReady(g){
    if (sgCur !== g || g.ready) return;
    g.ready = true; clearTimeout(g.timer);
    txt(sgx.msg, g.hint);
  }
  function sgLoaded(g){
    if (sgCur !== g || g.ready) return;
    let d = null;
    try { d = g.frame.contentDocument; } catch(e) { d = null; }
    if (!d) return;                                  /* another origin: its own word decides (or the wait runs out) */
    let href = "";
    try { href = String(d.location.href || ""); } catch(e) { href = ""; }
    if (!href || href === "about:blank") return;
    if (d.getElementById("slots") && d.getElementById("sub")) { sgReady(g); return; }
    sgLog("the frame did not load the signing page");
    sgClose("fail");                                 /* this origin, and not the signing page: an error page */
  }
  function sgOpen(url, opts){
    if (!sgAvailable() || typeof url !== "string" || !SIGN_PAGE.test(url)) return null;
    if (sgCur) sgClose("replaced");
    const o = (opts && typeof opts === "object") ? opts : {};
    const g = { opts: o, ready: false, saved: 0, frame: null, timer: null,
                hint: shown(o.hint) ? String(o.hint) : "Sign below, then press Save signature." };
    const f = document.createElement("iframe");
    f.className = "pp-sign-frame"; f.id = "pp-sign-frame"; f.title = "Signing page";
    f.setAttribute("referrerpolicy", "no-referrer");
    f.addEventListener("load", function () { sgLoaded(g); });
    f.src = url;                                     /* set before it is placed: no load of a blank first document */
    g.frame = f;
    sgCur = g;
    txt(sgx.msg, "Opening the signing page…");
    sgx.host.textContent = "";
    sgx.host.appendChild(f);
    openDlg(sgx.dlg);
    g.timer = setTimeout(function () {
      if (sgCur === g && !g.ready) { sgLog("the signing page did not say it was ready"); sgClose("fail"); }
    }, SIGN_READY_MS);
    sgLog("the signing panel is open");
    return Object.freeze({ close: function () { if (sgCur === g) sgClose("done"); },
                           open: function () { return sgCur === g; } });
  }
  window.addEventListener("message", function (e) {
    try {
      const g = sgCur;
      if (!g || !g.frame || e.source !== g.frame.contentWindow || !sgTrusted(e.origin)) return;
      const d = (e.data && typeof e.data === "object") ? e.data : null;
      if (!d) return;
      if (d.type === "teckel-sign-ready") { sgReady(g); return; }
      if (d.type !== "teckel-sign-saved") return;
      sgReady(g);
      g.saved++;
      const n = function (v) { return (typeof v === "number" && isFinite(v) && v >= 0) ? Math.floor(v) : null; };
      const info = Object.freeze({ signed: n(d.signed), required: n(d.required) });
      sgLog("the signing page saved a signature");
      if (typeof g.opts.onSaved === "function") g.opts.onSaved(info);
    } catch(err) { /* a message that cannot be read does nothing */ }
  });
  if (sgx.close) sgx.close.addEventListener("click", function () { sgClose("user"); });
  if (sgx.dlg) sgx.dlg.addEventListener("close", function () { if (sgCur) sgClose("user"); });   /* Escape */
  // the fallback's new tab, opened now (after the panel could not load: a browser may block it — then false)
  function sgTab(url){
    if (typeof url !== "string" || !SIGN_PAGE.test(url)) return false;
    let w = null;
    try { w = window.open(url, "_blank"); } catch(e) { w = null; }
    if (!w) return false;
    try { w.opener = null; } catch(e) {}
    return true;
  }
  Object.defineProperty(window, "teckelSignInPage", { configurable: false, enumerable: false, writable: false,
    value: Object.freeze({
      available: function () { return sgAvailable(); },
      open: function (url, opts) { try { return sgOpen(url, opts); } catch(e) { sgLog("the signing panel failed"); return null; } },
      active: function () { return !!sgCur; },
      tab: function (url) { return sgTab(url); }
    }) });

  /* ══ THE DOOR'S EVENTS ═════════════════════════════════════════════════════════════════ */
  async function onSignIn(){
    fm.card.hidden = false;
    formsMsg("Loading your forms…");
    // (22 Oct 2026) The conversation (auto-started with the code) waits a moment for this first decision: the panel
    // opened, or nothing to check. Settled in every outcome, including a lapse or a failed count.
    rvFirstLoad = true; reportPanel();
    try {
      const c = await P.action("review_count", {});
      if (lapsed(c)) return;
      setBadge((c && c.success && typeof c.open === "number") ? c.open : 0);
      // Settled AS the panel opens (openReview reports it on screen), or now when there is nothing to check — never
      // "settled, not shown" a moment before it opens.
      if (openCount > 0) { rvFirstLoad = false; await openReview(); }   // ⚠ FIRST: My forms is asked for only once this is up
    } finally {
      rvFirstLoad = false; reportPanel();
    }
    await loadForms();
  }
  function onLapse(d){
    const code = String((d && d.code) || "");
    // (2.2.428) « THE REVIEW WALK » ends (stop, when a step went out) and is forgotten — the server's stamp with it — before
    //   the panel closes (a dialog that cannot close fires no close event)
    rwEnd("closed"); rwForget(); prevId = null;
    sending = false; sub = null; current = null;
    sgClose("lapse");                             /* (2.2.433, G7) the signing panel goes with the page */
    closeDlg(sb.dlg); closeDlg(rv.dlg);
    rvFirstLoad = false; reportPanel();           /* off screen (also where a dialog has no close event) */
    clearForms();                                 /* paused for privacy: the list goes, and comes back */
    // (21 Oct 2026, Yusuf's V2 decision 7) SIGNED OUT: the badge's count is the practice's too, so it goes as well.
    if (code === "SIGNED_OUT") setBadge(0);
    formsMsg(code === "SIGNED_OUT" ? "Your forms appear here once you sign in again."
             : LAPSE.indexOf(code) !== -1 ? "Your forms appear again once your access code is accepted."
             : "Your forms appear again once this page reopens.");
  }
  function onMode(m){
    // (23 Oct 2026) the portal off: Settings has no door to ask, so it stays greyed, "Settings — coming soon".
    if (m === "legacy") { rwEnd("closed"); rwForget(); sgClose("lapse"); fm.card.hidden = true; setBadge(0); closeDlg(rv.dlg); closeDlg(sb.dlg);
                          rvFirstLoad = false; reportPanel(); settingsOff(); return; }
    if (m === "door") {
      fm.card.hidden = false;
      if (!P.held() && !fm.ip.children.length) formsMsg("Your forms appear here once your access code is accepted.");
    }
  }
  P.on("signin", onSignIn);
  P.on("lapse", onLapse);
  P.on("mode", onMode);
  onMode(P.mode());
})();

\x3c!-- =====================================================================
     TIERS 2 AND 3, V2 (21 Oct 2026). Contract §5 and THE CONFIRM RULE:
     agent_docs/v2_portal_door_and_backoffice_contract_v1_0.md. The action names, arguments and replies are
     the modules' own (teckel__r394_portal_tier2_v1_0.py, teckel__r395_portal_tier3_v1_0.py); where they
     differ from §5's table, the modules win.
       · PER FORM: a "More for this form" disclosure under each row of My forms — Questions on this form (the
         practice's added questions, the standard questions it switched off as tick boxes, switch one off,
         add one), Log entries (view, change, remove), Machines, Patient survey link, Documents attached,
         Schedule; then Send the submitted copy again and Correct and resubmit (submitted) or Discard this
         draft (in progress).
       · PRACTICE-WIDE: the Practice tools card — Start or send a form (a new copy, a blank copy by e-mail),
         Evidence library (rename, remove), Ask the guidance (and the passage on screen), Reference library,
         Document directory, Status report.
       · A section asks the server only when it is opened (nothing is read, or billed, before it is wanted).
       · (27 Oct 2026) a tapped FORM row of kev's numbered list opens on the page through the SAME route as Start a new
         copy (copyByKey, via window.teckelOpenByKey), straight into the viewer. See « ONE ROUTE FROM A FORM'S KEY ».
     ⚠⚠ THE CONFIRM RULE. The twelve actions that remove, discard, reopen, switch a question off, add one,
        change a schedule or e-mail anything are called through twoStep() and nowhere else. The first call
        carries no confirmation: the server changes nothing, sends nothing and answers what WILL happen; the
        page shows those words (and, for an e-mail, the address, as text) with a Confirm button. Only Confirm
        sends the server's confirmation back, with EXACTLY the request it was given for. A confirmation dies
        with the sheet, its time limit, or the page pausing.
     ⚠ A FORM'S KEY. My forms lists copies; the actions that name a FORM (machines, schedule, a new copy, a
        blank copy) learn its key from customisations_list's reply for one of its copies (the module takes an
        owned copy there), once per copy, in this page's memory only.
     ⚠ THE FORM ON SCREEN (21 Oct 2026, contract §6): opening a section of "More for this form", its Send again /
        Correct / Discard buttons, and a copy opened in the viewer tell the conversation which copy it is
        (window.teckelScreenForm, in the voice transport); a directory, a guidance passage or a reference document
        put in the viewer by these controls tells it that no form is on screen ("closed").
     ⚠ Every request goes through window.teckelPortal.action (it adds the pass; this script never holds it).
        Every server string is written as TEXT. "Done", "Sent", "Removed" and the like are the server's own
        message on its own success, never the page's guess.

\x3cdialog id="pp-confirm" class="pp-dialog" aria-labelledby="pp-cf-h" aria-describedby="pp-cf-words">

"use strict";
(function () {
  const P = window.teckelPortal, F = window.teckelPortalForms;
  const $ = (id) => document.getElementById(id);
  if (!P || !F || !$("pp-confirm") || !$("pp-tools")) return;      /* no door on this page */
  const LAPSE = P.lapseCodes;
  // r394's CONFIRMED and r395's CONFIRMED: called through twoStep() and nowhere else.
  const TWO_STEP = Object.freeze(["custom_question_add", "custom_question_remove", "base_question_hide",
    "log_entry_remove", "evidence_remove", "evidence_detach", "submission_resend", "revise", "discard",
    "status_report_send", "blank_copy_send", "schedule_set"]);
  // The words the server's schedule check recognises (its own list), in plain English.
  const CADENCES = [["", "Keep as it is"], ["daily", "Every day"], ["weekly", "Every week"],
    ["fortnightly", "Every two weeks"], ["monthly", "Every month"], ["bi-monthly", "Every two months"],
    ["quarterly", "Every three months"], ["biannual", "Every six months"], ["annual", "Every year"],
    ["every 2 years", "Every two years"], ["every 3 years", "Every three years"],
    ["every 5 years", "Every five years"], ["event", "Only when something happens"],
    ["none", "No regular review"]];
  const REQUIREMENTS = [["", "Keep as it is"], ["mandatory", "Required"], ["recommended", "Recommended"]];
  const ANSWER_TYPES = [["yes_no", "Yes or No"], ["choice", "A choice from a list"], ["free_text", "Free text"],
    ["number", "A number"], ["date", "A date"]];
  const NOT_ON_SCREEN_YET = "Opening documents on screen is not available yet. You can e-mail it to yourself instead.";

  /* ── small helpers (the same as the panels' script beside this one) ── */
  function codeOf(r){ return String((r && r.error_code) || "").trim().toUpperCase(); }
  // The door has already greyed the page and raised the code row: the caller says nothing more.
  function lapsed(r){ const c = codeOf(r); return LAPSE.indexOf(c) !== -1 || c === "NO_PASS" || c === "PORTAL_OFF"; }
  function msgOf(r, fallback){
    const m = (r && typeof r.message === "string") ? r.message.trim() : "";
    return m || fallback;
  }
  function txt(e, s){ if (e) e.textContent = (s === undefined || s === null) ? "" : String(s); }
  function shown(v){ return v !== undefined && v !== null && String(v).trim() !== ""; }
  function quoted(s){ return "“" + String(s) + "”"; }
  function clone(o){ return JSON.parse(JSON.stringify(o || {})); }
  function openDlg(d){ if (!d || d.open) return; try { d.showModal(); } catch(e) { d.setAttribute("open", ""); } }
  function closeDlg(d){ if (!d || !d.open) return; try { d.close(); } catch(e) { d.removeAttribute("open"); } }
  function show(kind, url, expiresAt){   /* (2.2.417) a form's view carries view_link's expires_at */
    return (typeof window.teckelPortalShow === "function") ? window.teckelPortalShow(kind, url, expiresAt) : Promise.resolve(false);
  }
  // (contract §6) The copy these controls showed or acted on, for the conversation (null: no form on screen now).
  function onScreen(iid, name, action){
    try { if (typeof window.teckelScreenForm === "function") window.teckelScreenForm(iid, name, action); } catch(e) {}
  }
  function urlOk(kind, url){
    return typeof window.teckelPortalUrlOk === "function" && window.teckelPortalUrlOk(kind, url) === true;
  }
  function revealViewer(){
    const v = document.querySelector(".form-viewer-shell"); if (!v) return;
    const r = v.getBoundingClientRect();
    if (r.top > window.innerHeight * 0.6 || r.bottom \x3c 0) {
      try { v.scrollIntoView({ behavior: "smooth", block: "start" }); } catch(e) { v.scrollIntoView(); }
    }
  }
  function fmtWhen(iso, withTime){
    const d = new Date(iso || "");
    if (!iso || isNaN(d.getTime())) return "";
    const o = { weekday: "short", day: "numeric", month: "short", year: "numeric" };
    if (withTime) { o.hour = "2-digit"; o.minute = "2-digit"; }
    try { return d.toLocaleString("en-GB", o); } catch(e) { return d.toISOString().slice(0, 16).replace("T", " "); }
  }
  let uidSeq = 0;
  function uid(p){ return p + "-" + (++uidSeq); }
  // Elements are built, never parsed: a server string is only ever a text node or an attribute value.
  function el(tag, props, kids){
    const e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      const v = props[k];
      if (v === undefined || v === null || v === false) return;
      if (k === "text") e.textContent = String(v);
      else if (k === "cls") e.className = v;
      else if (k === "hidden") e.hidden = true;
      else e.setAttribute(k, v === true ? "" : String(v));
    });
    (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function button(label, fn, o){
    o = o || {};
    const b = el("button", { type: "button", cls: "lv-btn pp-small" + (o.primary ? " primary" : ""),
                            "aria-describedby": o.describedBy || null, text: label });
    b.addEventListener("click", function () { if (P.held() && !b.disabled) fn(b); });
    return b;
  }
  function line(text, cls){ return el("p", { cls: cls || "pp-sec-text", text: text }); }
  function statusLine(){ return el("div", { cls: "pp-result", role: "status", "aria-live": "polite" }); }
  function field(id, label, control, hint){
    return el("div", { cls: "pp-field" }, [el("label", { for: id, text: label }), control,
                                          hint ? el("p", { cls: "pp-hint", id: id + "-hint", text: hint }) : null]);
  }
  function select(id, pairs){
    const s = el("select", { id: id, cls: "lv-input" });
    pairs.forEach(function (p) { s.appendChild(el("option", { value: p[0], text: p[1] })); });
    return s;
  }
  function openLink(url, label, describedBy){
    return el("a", { href: url, target: "_blank", rel: "noopener", cls: "lv-btn pp-small pp-linkbtn",
                     "aria-describedby": describedBy || null, text: label });
  }

  // A section that asks the server only when it is opened, once; again() asks again. Its status line
  // survives again(), so what an action said stays on screen while the list under it is redrawn.
  function lazy(d, host, load){
    const content = el("div", { cls: "pp-sec-content" });
    const note = statusLine();
    host.appendChild(content); host.appendChild(note);
    let loaded = false, busy = false;
    async function run(){
      if (busy || !P.held()) return;
      busy = true; loaded = true;
      content.textContent = ""; content.appendChild(line("Loading…", "pp-hint"));
      try { await load(content, again, note); }
      catch(e) { content.textContent = ""; content.appendChild(line("Something went wrong just now. Close this and open it again.")); }
      finally { busy = false; }
    }
    function again(){ loaded = false; if (d.open) run(); }
    function reset(){ loaded = false; content.textContent = ""; txt(note, ""); }
    d.addEventListener("toggle", function () { if (d.open && !loaded) run(); });
    return { again: again, reset: reset };
  }
  function section(title, describedBy, load){
    const host = el("div", { cls: "pp-sec-body" });
    const d = el("details", { cls: "pp-sec" }, [el("summary", { "aria-describedby": describedBy || null, text: title }), host]);
    lazy(d, host, load);
    return d;
  }
  function list(items){ const ul = el("ul", { cls: "pp-sub" }); items.forEach(function (i) { if (i) ul.appendChild(i); }); return ul; }
  function item(name, meta, btns){
    const id = uid("pp-it");
    return { id: id, li: el("li", null, [
      el("div", { cls: "pp-sub-main" }, [el("div", { cls: "pp-sub-name", id: id, text: name }),
                                         meta ? el("div", { cls: "pp-sub-meta", text: meta }) : null]),
      el("div", { cls: "pp-sub-btns" }, btns || [])]) };
  }
  function addButtons(it, btns){ const box = it.li.querySelector(".pp-sub-btns"); btns.forEach(function (b) { if (b) box.appendChild(b); }); }

  /* ══ THE CONFIRM RULE ══════════════════════════════════════════════════════════════════════ */
  const cf = { dlg: $("pp-confirm"), h: $("pp-cf-h"), sub: $("pp-cf-sub"), words: $("pp-cf-words"),
               toWrap: $("pp-cf-to-wrap"), to: $("pp-cf-to"), note: $("pp-cf-note"), confirm: $("pp-cf-confirm"),
               again: $("pp-cf-again"), cancel: $("pp-cf-cancel"), close: $("pp-cf-close"), result: $("pp-cf-result") };
  // The open sheet: { o, action, args (a frozen copy), token, sending, done }. The token is the
  // server's, single use, and dies with the sheet.
  let pend = null, cfTimer = null;
  function isPreview(r){
    return !!r && r.success === true && (r.confirmed === false || r.confirm_required === true)
      && typeof r.confirm_token === "string" && r.confirm_token !== "" && !!r.preview && typeof r.preview === "object";
  }
  function previewWords(p){
    for (const k of ["says", "what", "say"]) if (shown(p[k])) return String(p[k]).trim();
    return "";
  }
  function cfSync(){
    const p = pend;
    cf.confirm.disabled = !p || !p.token || p.sending || p.done;
    cf.cancel.disabled = !!(p && p.sending); cf.close.disabled = !!(p && p.sending);
  }
  // o: { action, args, title, sub, outward, confirmLabel, cancelLabel, onDone }
  async function twoStep(o){
    if (!P.held() || TWO_STEP.indexOf(o.action) === -1) return;
    if (pend && pend.sending) return;
    clearTimeout(cfTimer);
    const mine = { o: o, action: o.action, args: clone(o.args), token: null, sending: false, done: false };
    pend = mine;
    txt(cf.h, o.title || "Please confirm"); txt(cf.sub, o.sub || ""); txt(cf.words, ""); txt(cf.to, "");
    cf.toWrap.hidden = true; cf.note.hidden = false; cf.again.hidden = true;
    cf.confirm.hidden = false; txt(cf.confirm, o.confirmLabel || (o.outward ? "Confirm and send" : "Confirm"));
    txt(cf.cancel, o.cancelLabel || "Cancel"); txt(cf.result, "Checking…");   /* (27 Oct 2026) "No" for a copy's Delete */
    cfSync(); openDlg(cf.dlg);
    // ⚠ THE FIRST CALL CARRIES NO CONFIRMATION: the server says what would happen, and nothing happens.
    const r = await P.action(mine.action, clone(mine.args));
    if (pend !== mine || lapsed(r)) return;
    if (!r || r.success !== true) {
      txt(cf.result, msgOf(r, "That cannot be done just now. Nothing was changed."));
      cf.confirm.hidden = true; cf.note.hidden = true; cf.again.hidden = false; cfSync(); return;
    }
    if (!isPreview(r)) {                    // not the server's question: no Confirm is offered for it
      txt(cf.result, msgOf(r, "That could not be checked just now. Please refresh My forms to see where things stand."));
      cf.confirm.hidden = true; cf.note.hidden = true; cfSync(); return;
    }
    const pv = r.preview;
    txt(cf.words, previewWords(pv) || "Please confirm that you want this done.");
    if (shown(pv.to_address)) {
      txt(cf.to, String(pv.to_address).trim()); cf.toWrap.hidden = false;
    } else if (o.outward) {
      // ⚠ an e-mail is never confirmed without its address on screen
      txt(cf.result, "The address it would go to could not be shown, so nothing has been sent.");
      cf.confirm.hidden = true; cf.note.hidden = true; cfSync(); return;
    }
    mine.token = r.confirm_token;
    txt(cf.result, "");
    // The server honours a confirmation for five minutes; the page stops offering it a little before.
    let left = Date.parse(r.confirm_expires_at || "") - Date.now();
    if (!(left > 10000 && left \x3c= 600000)) left = 300000;
    cfTimer = setTimeout(function () {
      if (pend !== mine || mine.done || mine.sending) return;
      mine.token = null; cfSync();
      txt(cf.result, "This was not confirmed in time, so nothing was done. Press Check again to see it afresh.");
      cf.note.hidden = true; cf.again.hidden = false;
    }, Math.max(5000, left - 5000));
    cfSync();
  }
  async function doConfirm(){
    const mine = pend;
    if (!mine || !mine.token || mine.sending || mine.done || !P.held()) return;
    const tok = mine.token;
    mine.token = null; mine.sending = true; clearTimeout(cfTimer); cfSync();
    txt(cf.result, mine.o.outward ? "Sending…" : "Working on it…");
    let r;
    // ⚠ EXACTLY THE REQUEST THE SERVER WAS ASKED ABOUT, plus its confirmation.
    try { r = await P.action(mine.action, Object.assign(clone(mine.args), { confirm_token: tok })); }
    finally { mine.sending = false; }
    if (pend !== mine) {                    // the page paused while it was out: say what came back, once
      if (r && r.success === true && !isPreview(r)) txt($("pp-tools-msg"), msgOf(r, "Done."));
      return;
    }
    if (lapsed(r)) return;
    if (r && r.success === true && !isPreview(r)) {
      mine.done = true;
      txt(cf.result, msgOf(r, "Done."));
      cf.confirm.hidden = true; cf.note.hidden = true; cf.again.hidden = true; txt(cf.cancel, "Close"); cfSync();
      try { cf.cancel.focus(); } catch(e) {}
      if (typeof mine.o.onDone === "function") { try { mine.o.onDone(r); } catch(e) {} }
      return;
    }
    txt(cf.result, msgOf(r, "It was not done."));
    cf.note.hidden = true; cf.again.hidden = false; cfSync();
  }
  function closeConfirm(){ if (pend && pend.sending) return; closeDlg(cf.dlg); }

  cf.dlg.addEventListener("cancel", function (e) { if (pend && pend.sending) e.preventDefault(); });   /* Esc mid-send */

  /* ══ SHARED STEPS ══════════════════════════════════════════════════════════════════════════ */
  const keys = new Map();                   // a copy's instance_id -> its form's key (this page session only)
  async function formKey(f, say){
    if (shown(f.storage_key)) return String(f.storage_key).trim();

    if (keys.has(iid)) return keys.get(iid);
    const r = await P.action("customisations_list", { instance_id: iid });
    if (lapsed(r)) return null;
    if (r && r.success === true && shown(r.storage_key)) { keys.set(iid, String(r.storage_key).trim()); return keys.get(iid); }
    say(msgOf(r, "This form's details could not be read just now. Please try again."));
    return null;
  }

  /* ══ PER FORM: "More for this form" under each row of My forms ═════════════════════════════ */
  function kindOf(f){
    const t = String(f.template_type || "").trim().toLowerCase();
    if (t === "survey_log") return "survey";
    if (t === "scheduled_grid_log") return "grid";

    if (f.is_log === false) return "form";

  }
  // A section the user has open is never taken away from under them.
  function applyKind(ctx){
    const k = ctx.kind, s = ctx.secs;
    s.mach.hidden = (k === "form" || k === "survey" || k === "grid") && !s.mach.open;
    s.survey.hidden = (k === "form" || k === "log" || k === "grid") && !s.survey.open;
    s.log.hidden = k === "form" && !s.log.open;

    const s = ctx.secs;

    [s.q, s.log, s.mach, s.survey, s.ev, s.sched].forEach(function (d) { box.appendChild(d); });

        twoStep({ action: "discard", args: { instance_id: ctx.iid }, title: "Discard this draft?", sub: ctx.name,
                  confirmLabel: "Discard it", onDone: function (r) {
                    try { if (typeof window.teckelCopyGone === "function") window.teckelCopyGone(ctx.iid); } catch(e) {}
                    after(r);
                  } });

    }
    box.appendChild(acts);
  }

  // ── Questions on this form: the practice's own set (customisations) ──

  // ── Log entries: view; change one field (one step, the server's checks); remove (two steps) ──
  function colLabel(col){ return shown(col.label) ? String(col.label).replace(/[\\s?:]+$/, "") : String(col.key); }
  function cellOf(vals, col){
    if (Object.prototype.hasOwnProperty.call(vals, col.key)) return vals[col.key];
    if (shown(col.label) && Object.prototype.hasOwnProperty.call(vals, col.label)) return vals[col.label];
    const want = String(col.key).toLowerCase(), alt = String(col.label || "").trim().toLowerCase();
    for (const k of Object.keys(vals)) { const kk = k.trim().toLowerCase(); if (kk === want || (alt && kk === alt)) return vals[k]; }
    return "";
  }
  async function loadLog(c, again, note, ctx){
    const r = await P.action("log_entries", { instance_id: ctx.iid });
    if (lapsed(r)) return;
    c.textContent = "";
    if (!r || r.success !== true) {
      if (codeOf(r) === "NOT_A_LOG") learnKind(ctx, "form");
      c.appendChild(line(msgOf(r, "The entries could not be loaded just now."))); return;
    }
    const tt = String(r.template_type || "").trim().toLowerCase();
    learnKind(ctx, tt === "survey_log" ? "survey" : (tt === "scheduled_grid_log" ? "grid" : "log"));
    const cols = (Array.isArray(r.columns) ? r.columns : []).filter(function (x) { return x && shown(x.key); });
    const entries = (Array.isArray(r.entries) ? r.entries : []).filter(function (e) { return e && typeof e === "object"; });
    const submitted = String(r.status || ctx.f.status || "") === "submitted";
    const editable = !submitted && tt !== "survey_log" && tt !== "scheduled_grid_log";
    c.appendChild(line(entries.length === 1 ? "1 entry on this copy." : (entries.length + " entries on this copy.")));
    if (entries.length) {
      const ol = el("ol", { cls: "pp-sub pp-entries" });
      entries.forEach(function (e, i) {
        const vals = (e.values && typeof e.values === "object") ? e.values : {};
        const hid = uid("pp-ent");
        const when = fmtWhen(e.logged_at, true);
        const dl = el("dl");
        cols.forEach(function (col) {
          const v = cellOf(vals, col);
          // a personal field is never shown here, only whether it was given
          dl.appendChild(el("dt", { text: colLabel(col) }));
          dl.appendChild(el("dd", { text: col.is_pii ? (shown(v) ? "Provided" : "Blank") : (shown(v) ? String(v) : "Blank") }));
        });
        const li = el("li", { cls: "pp-entry", "aria-labelledby": hid },
                      [el("div", { cls: "pp-entry-h", id: hid, text: "Entry " + (i + 1) + (when ? " · " + when : "") }), dl]);
        if (!submitted && shown(e.row_id)) {
          const ed = el("div", { cls: "pp-entry-edit" }); ed.hidden = true;
          const btns = el("div", { cls: "pp-sub-btns" });
          if (editable && cols.length) btns.appendChild(button("Change", function () { openEditor(ed, e, vals, cols, ctx, again, note); }, { describedBy: hid }));
          btns.appendChild(button("Remove…", function () {
            twoStep({ action: "log_entry_remove", args: { instance_id: ctx.iid, row_id: String(e.row_id) },
                      title: "Remove this entry?", sub: ctx.name, confirmLabel: "Remove it", onDone: again });
          }, { describedBy: hid }));
          li.appendChild(btns); li.appendChild(ed);
        }
        ol.appendChild(li);
      });
      c.appendChild(ol);
    }
    const hist = Array.isArray(r.submitted_history) ? r.submitted_history.length : 0;
    if (hist) c.appendChild(line(hist === 1 ? "1 earlier submitted version of this log is on file."
                                            : (hist + " earlier submitted versions of this log are on file."), "pp-hint"));
    if (submitted) c.appendChild(line("This copy has been submitted, so its entries cannot be changed here.", "pp-hint"));
  }
  function openEditor(ed, e, vals, cols, ctx, again, note){
    ed.textContent = ""; ed.hidden = false;
    const fid = uid("pp-ef"), vid = uid("pp-ev");
    const fSel = select(fid, cols.map(function (col) { return [String(col.key), colLabel(col)]; }));
    let vIn = null;
    const vWrap = el("div", { cls: "pp-field" }, [el("label", { for: vid, text: "New value" })]);
    function textInput(){
      const col = cols.find(function (x) { return String(x.key) === fSel.value; });
      const i = el("input", { type: "text", id: vid, cls: "lv-input", maxlength: "500", autocomplete: "off" });
      i.value = (col && !col.is_pii && shown(cellOf(vals, col))) ? String(cellOf(vals, col)) : "";
      if (vIn) vWrap.replaceChild(i, vIn); else vWrap.appendChild(i);
      vIn = i;
    }
    fSel.addEventListener("change", textInput);
    textInput();
    const save = button("Save", async function (b) {
      const col = cols.find(function (x) { return String(x.key) === fSel.value; });
      if (!col) return;
      b.disabled = true; txt(note, "Saving…");
      const u = await P.action("log_entry_edit", { instance_id: ctx.iid, row_id: String(e.row_id),
                                                   field: String(col.key), value: String(vIn.value || "").trim() });
      b.disabled = false;
      if (lapsed(u)) return;
      if (u && u.success === true) { txt(note, msgOf(u, "Saved.")); again(); return; }
      txt(note, msgOf(u, "That change could not be saved."));
      // A field with set choices takes one of them only: offer exactly the server's choices.
      if (codeOf(u) === "NOT_AN_OPTION" && Array.isArray(u.options) && u.options.length) {
        const sel = select(vid, u.options.map(function (o) { return [String(o), String(o)]; }));
        vWrap.replaceChild(sel, vIn); vIn = sel;
        try { sel.focus(); } catch(err) {}
      }
    }, { primary: true });
    ed.appendChild(field(fid, "Field", fSel));
    ed.appendChild(vWrap);
    ed.appendChild(el("div", { cls: "pp-actions" }, [save, button("Cancel", function () { ed.hidden = true; ed.textContent = ""; })]));
    try { fSel.focus(); } catch(err) {}
  }

  // ── Machines (machine logs): the machines on file, and a log for another one ──

    if (!ms.length) c.appendChild(line("No machines are on file for this log yet.", "pp-hint"));

        twoStep({ action: "evidence_remove", args: { evidence_id: String(d.evidence_id) }, title: "Remove this document?",
                  sub: name, confirmLabel: "Remove it", onDone: again });
      }, { describedBy: it.id }));
      addButtons(it, btns);
      it.li.appendChild(ren);
      return it.li;
    })));
  });

  // ── Ask the guidance: the server's quote, word for word, with the document named ──
  async function guidanceOnScreen(sk, blk, say){
    const args = { storage_key: sk };
    if (typeof blk === "number" && isFinite(blk) && blk >= 0 && Math.floor(blk) === blk) args.block_ord = blk;
    txt(say, "Opening…");
    const r = await P.action("guidance_link", args);
    if (lapsed(r)) return;
    if (codeOf(r) === "GUIDANCE_VIEWER_OFF") { txt(say, NOT_ON_SCREEN_YET); return; }
    if (!r || r.success !== true || !r.url) { txt(say, msgOf(r, "It could not be shown just now.")); return; }
    const ok = await show("guidance", r.url);
    txt(say, ok ? "It is open in the viewer below." : "It could not be shown here.");
    if (ok) { onScreen(null, null, "closed"); revealViewer(); }
  }
  let asking = false;
  async function ask(){
    if (!P.held() || asking) return;
    const q = (tl.q.value || "").trim(), res = tl.guidRes;
    if (!q) { txt(res, "Type a question first."); tl.q.focus(); return; }
    asking = true; tl.ask.disabled = true; txt(res, "Looking it up…");
    let r;
    try { r = await P.action("guidance_ask", { question: q }); }
    finally { asking = false; tl.ask.disabled = false; }
    if (lapsed(r)) return;
    res.textContent = "";
    if (!r || r.success !== true) { txt(res, msgOf(r, "Your guidance could not be searched just now.")); return; }
    const after = statusLine();
    const acts = el("div", { cls: "pp-actions" });
    if (r.found === true && shown(r.quote)) {
      res.appendChild(el("p", { text: "From " + quoted(shown(r.document) ? r.document : "your guidance") + ":" }));
      res.appendChild(el("blockquote", { cls: "pp-quote", text: String(r.quote) }));
      const n = Number(r.other_matches) || 0;
      if (n > 0) res.appendChild(line("It is mentioned in " + n + (n === 1 ? " other place" : " other places") + " too.", "pp-hint"));
      if (shown(r.storage_key)) {
        acts.appendChild(button("Show it on screen", function () { guidanceOnScreen(String(r.storage_key), r.block_ord, after); }));
        acts.appendChild(button("E-mail me this document", function () { blankCopy(String(r.storage_key), shown(r.document) ? String(r.document) : ""); }));
      }
    } else {
      res.appendChild(el("p", { text: msgOf(r, "Nothing in your guidance answers that directly.") }));
      const sk = shown(r.suggested_storage_key) ? r.suggested_storage_key : r.storage_key;
      const doc = shown(r.suggested_document) ? r.suggested_document : r.document;
      if (shown(sk)) acts.appendChild(button("E-mail me " + (shown(doc) ? quoted(doc) : "the document"), function () {
        blankCopy(String(sk), shown(doc) ? String(doc) : "");
      }));
    }
    if (acts.children.length) res.appendChild(acts);
    res.appendChild(after);
  }
  tl.ask.addEventListener("click", ask);
  tl.q.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); ask(); } });

  // ── Reference library: the industry's reference documents (on screen, or by e-mail) ──
  const refLib = lazy($("pp-t-ref"), $("pp-t-ref-body"), async function (c, again, note) {
    const r = await P.action("reference_list", {});
    if (lapsed(r)) return;
    c.textContent = "";
    if (!r || r.success !== true) { c.appendChild(line(msgOf(r, "The reference documents could not be loaded just now."))); return; }
    const docs = (Array.isArray(r.documents) ? r.documents : []).filter(function (d) { return d && shown(d.document_id); });
    if (!docs.length) { c.appendChild(line("There are no reference documents for your practice yet.", "pp-hint")); return; }
    c.appendChild(list(docs.map(function (d) {
      const title = shown(d.title) ? String(d.title) : "A reference document";
      const meta = [shown(d.file_format) ? String(d.file_format) : "", d.kind === "letter_template" ? "letter template" : ""]
                   .filter(Boolean).join(" · ");
      const it = item(title, meta, []);
      addButtons(it, [
        button("Open on screen", async function () {
          txt(note, "Opening…");
          const u = await P.action("reference_view", { document_id: String(d.document_id) });
          if (lapsed(u)) return;
          if (codeOf(u) === "GUIDANCE_VIEWER_OFF") { txt(note, NOT_ON_SCREEN_YET); return; }
          if (!u || u.success !== true || !u.url) { txt(note, msgOf(u, "It could not be opened just now.")); return; }
          const ok = await show("guidance", u.url);
          txt(note, ok ? (quoted(title) + " is open in the viewer below.") : "It could not be shown here.");
          if (ok) { onScreen(null, null, "closed"); revealViewer(); }
        }, { describedBy: it.id }),
        button("E-mail it to me", function () { blankCopy(String(d.document_id), title); }, { describedBy: it.id })
      ]);
      return it.li;
    })));
  });

  // ── Document directory: in the viewer ──
  async function openDirectory(){
    if (!P.held()) return;
    const q = (tl.dirQ.value || "").trim();
    tl.dirOpen.disabled = true; txt(tl.dirRes, "Opening…");
    let r;
    try { r = await P.action("directory_link", q ? { search: q } : {}); }
    finally { tl.dirOpen.disabled = false; }
    if (lapsed(r)) return;
    if (!r || r.success !== true || !r.url) { txt(tl.dirRes, msgOf(r, "The directory could not be opened just now.")); return; }
    const ok = await show("directory", r.url);
    txt(tl.dirRes, ok ? "The directory is open in the viewer below." : "The directory could not be shown here.");
    if (ok) { onScreen(null, null, "closed"); revealViewer(); }
  }
  tl.dirOpen.addEventListener("click", openDirectory);
  // (28 Oct 2026, V26b; Yusuf: "an easy path to it … definitely an 'open' as well as email"; Steven: never by default)
  // STATUS REPORT → OPEN ON SCREEN: the document directory, unfiltered, in the viewer — on its traffic light (the "On this
  // device" choice decides the tab; the traffic light by default). The same door as Open the directory; nothing to Benedict.
  async function openReport(){
    if (!P.held() || !tl.reportOpen) return;
    tl.reportOpen.disabled = true; txt(tl.reportRes, "Opening…");
    let r;
    try { r = await P.action("directory_link", {}); }
    finally { tl.reportOpen.disabled = false; }
    if (lapsed(r)) return;
    if (!r || r.success !== true || !r.url) { txt(tl.reportRes, msgOf(r, "The status could not be opened just now.")); return; }
    const ok = await show("directory", r.url);
    txt(tl.reportRes, ok ? "Your status is open in the viewer below." : "The status could not be shown here.");
    if (ok) { onScreen(null, null, "closed"); revealViewer(); }
  }
  if (tl.reportOpen) tl.reportOpen.addEventListener("click", openReport);
  tl.dirQ.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); openDirectory(); } });

  // ── Status report: e-mailed to the address on file (two steps) ──
  tl.report.addEventListener("click", function () {
    if (!P.held()) return;
    txt(tl.reportRes, "");
    twoStep({ action: "status_report_send", args: {}, outward: true, title: "E-mail the status report?" });
  });

  /* ══ THE DOOR'S EVENTS ═════════════════════════════════════════════════════════════════════ */
  function resetTools(){
    document.querySelectorAll("#pp-tools details").forEach(function (d) { d.open = false; });
    evLib.reset(); refLib.reset();
    [tl.startRes, tl.guidRes, tl.dirRes, tl.reportRes, $("pp-open-res")].forEach(function (e) { if (e) e.textContent = ""; });
    tl.q.value = ""; tl.dirQ.value = "";
    fillPicker([]);
  }
  function onLapse(){
    // ⚠ A confirmation in hand dies with the pass: the sheet closes and nothing is sent later.
    // (one already on its way is not recalled; doConfirm reports its answer once, in the tools' own line)
    clearTimeout(cfTimer);
    pend = null;
    closeDlg(cf.dlg);
    keys.clear();
    resetTools();                              /* paused for privacy: what was read goes, and comes back */
  }
  function onMode(m){
    if (m === "legacy") { tl.card.hidden = true; onLapse(); return; }
    if (m === "door") tl.card.hidden = false;
  }
  P.on("signin", function () { tl.card.hidden = false; txt(tl.msg, ""); });
  P.on("lapse", onLapse);
  P.on("mode", onMode);
  onMode(P.mode());
})();

\x3c!-- =====================================================================
     TYPE INTO THE FORM ON SCREEN, V2 (23 Oct 2026). Yusuf: "Can we make the on-screen form *editable* so that a
     user can always override and simply type!!!" — question forms and column logs first. Server 2.2.417
     (teckel__r417_typed_answers_v1_0.py, switch DOCUMENT_ANALYSER_R417_TYPED_ANSWERS): three portal actions.
       · THE EDIT BUTTON sits in the viewer strip (builder edit V20a) and shows ONLY while the viewer holds a copy this
         page's own buttons put there (My forms → View, a copy opened from the review panel or the Practice tools):
         window.teckelScreenCopy (the transport: the copy View showed, an id the server gave this page) AND
         window.teckelPortalViewer.held() (the viewer: still that very view). A form Benedict showed has no copy id on
         this page, so it has no Edit — unless (24 Oct 2026, server 2.2.419, R419_WALK) the server names it as this
         practice's own editable copy (window.teckelVoiceCopy: resolve_view on his display_form's id, through the door).
         Greyed until the access code is accepted, like every control but the guide
         links: it is a \x3cbutton> the door locks, and nothing here acts without the pass.
       · OPEN: form_fields {instance_id}. A question form: one box per question — a list for a choice question, a
         text box with a "dd/mm/yyyy or 'today'" hint for a date (slashes: the date engine reads "23/10/2026"
         but not "23-10-2026" or an ISO date, so never \x3cinput type="date">), "hh:mm" for a time — and a personal question
         LOCKED, "left blank — personal details aren't collected" (no box at all; the server never sends its value).
         Each answer is saved (save_answer) when its box is left or Enter is pressed, ONLY when it changed; a tick,
         or the server's own refusal line beside the box (nothing was written). An emptied box clears the answer.
         A column log: a NEW entry, one box per column (a list for a choice, a number hint with its unit, a date
         hint, personal locked) and Save entry (save_log_entry): every refused box marked with the server's line and
         NOTHING saved; blank columns are named first and saved blank only on "Save with them blank" (save_blank);
         "Saved — the log now has N entries" and the boxes cleared. A submitted copy, a task grid, a survey or a
         consent form: the server's short note, nothing to type into.
       · THE SWITCH OFF (UNKNOWN_ACTION) or the portal off (PORTAL_OFF): Edit greyed, "Editing — coming soon", for
         the rest of this page's life. A lapsed pass (or NO_PASS, the page signed out under a request) is the door's:
         the panel closes and empties, and Edit works again after the code.
       · (24 Oct 2026, page 2.2.421; Yusuf: "BY DEFAULT THE FORM SHOULD LOAD INTO EDIT/WALK/CURSOR MODE") WHILE THE LIVE
         FORM IS ON (window.teckelLiveForm.on(): the server's page_features present, and its live_form not false) this
         panel never opens: the form on screen itself becomes live fields (the live form script), the Edit button opens
         THAT, and is shown only while the live form is not already showing the copy on screen. With page_features absent
         (the 2.2.420 switch off) everything here is as 2.2.420 built it.
       · (2.2.421, F-FP) no Edit for a copy the server's replies name as a kind that is never typed into (form_kind
         "other": a task grid, a survey, a consent form) — the transport's teckelScreenCopy now carries it.
       · (25 Oct 2026, PHASE 4 — server 2.2.427) a survey, a task grid and a consent form are each a lane of the LIVE FORM
         (form_kind "survey" / "grid" / "consent" from My forms): this panel never opens for one; with the live form on, Edit
         opens the live form, as for every other copy.
       · AFTER A SAVE THAT WROTE: the conversation, if one is open, is told {kind:"form_changed", instance_id,
         question_number} or {kind:"form_changed", instance_id, entry:true} (window.teckelFormChanged in the
         transport: ids the server gave this page only, never a value), and the form on screen is redrawn — the same
         view while its token is fresh (teckelPortalViewer.redraw), else ONE new view_link, shown through
         teckelPortalShow's own checks.
     ⚠ Every request goes through window.teckelPortal.action, which adds the pass; this script never holds it and
       makes no request of its own. Every server string is written as TEXT, never as markup; nothing is stored in the
       browser. The panel closes, and its boxes empty, on a lapse, a sign-out and when the form leaves the viewer.

\x3cscript>
"use strict";
(function () {
  const P = window.teckelPortal;
  const $ = (id) => document.getElementById(id);
  const ed = { btn: $("pp-edit-btn"), panel: $("pp-edit"), title: $("pp-edit-title"), msg: $("pp-edit-msg"),
               body: $("pp-edit-body"), close: $("pp-edit-close") };
  if (!P || !ed.btn || !ed.panel || !ed.body) return;   /* no door on this page */
  const LAPSE = P.lapseCodes;
  const EDIT_OFF = ["UNKNOWN_ACTION", "PORTAL_OFF"];
  const EDIT_SOON = "Editing — coming soon";
  const PERSONAL_LINE = "left blank — personal details aren't collected";
  const HINT = { date: "dd/mm/yyyy or 'today'", time: "hh:mm", datetime: "dd/mm/yyyy hh:mm" };
  const MAX_VALUE = 2000;                                 /* the server's own cap on a typed value */
  const LIVE_ONLY = Object.freeze(["survey", "grid", "consent"]);   /* (Phase 4) kinds only the live form types into */
  let off = false;          /* the server cannot take typed answers: greyed for the rest of this page's life */
  let cur = null;           /* the open panel: { iid, name, kind } — a new object each time it opens */
  let opening = false, redrawTimer = null, rowSeq = 0;

  function codeOf(r){ return String((r && r.error_code) || "").trim().toUpperCase(); }
  // The door has already greyed the page and raised the code row: the caller says nothing more.
  function lapsed(r){ const c = codeOf(r); return LAPSE.indexOf(c) !== -1 || c === "NO_PASS"; }
  function msgOf(r, fallback){
    const m = (r && typeof r.message === "string") ? r.message.trim() : "";
    return m || fallback;
  }
  function txt(el, s){ if (el) el.textContent = (s === undefined || s === null) ? "" : String(s); }
  function shown(v){ return v !== undefined && v !== null && String(v).trim() !== ""; }
  function el(tag, cls, text){
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = String(text);
    return e;
  }

  /* ══ WHICH COPY IS ON SCREEN ════════════════════════════════════════════════════════════ */
  // (24 Oct 2026; server 2.2.419) A form BENEDICT opened by voice, once the server has named it as this practice's own
  // copy and editable (window.teckelVoiceCopy, in the transport: resolve_view through the door), while a form is still in
  // the viewer. With the server's walk switch off it is never named, and his forms have no Edit, as before.
  function voiceOnScreen(){
    let v = null;
    try { v = (typeof window.teckelVoiceCopy === "function") ? window.teckelVoiceCopy() : null; } catch(e) { v = null; }
    return (v && v.editable === true && shown(v.instance_id)) ? v : null;
  }
  // The copy THIS page's own buttons put in the viewer, while the viewer still shows that very view; else (2.2.419) the
  // copy Benedict opened by voice, named by the server; else null.
  function copyOnScreen(){
    let c = null, held = false;
    try { c = (typeof window.teckelScreenCopy === "function") ? window.teckelScreenCopy() : null; } catch(e) { c = null; }
    try { held = !!(window.teckelPortalViewer && window.teckelPortalViewer.held()); } catch(e) { held = false; }
    const vc = (c && held) ? null : voiceOnScreen();
    if (vc) return vc;
    return (c && held && shown(c.instance_id)) ? c : viewerCopy();
  }
  // (27 Oct 2026, V26; Steven on his phone: after Benedict showed the form there was no way back into typing) else the
  // in-progress copy the VIEWER itself shows — its id and view mode are in the address the page drew — so Edit is offered
  // however the form got there. The server's form_fields still decides: a copy this practice may not type into is refused
  // with the server's own line, nothing written.
  function viewerCopy(){
    try {
      if (!(window.teckelPortalViewer && window.teckelPortalViewer.formShown())) return null;
      const f = document.getElementById("form-viewer");
      const src = f ? String(f.getAttribute("src") || "") : "";
      if (!/[?&]view_mode=in_progress(&|$)/.test(src)) return null;
      const m = /[?&]instance_id=([0-9a-fA-F-]{36})(&|$)/.exec(src);
      return m ? { instance_id: m[1], editable: true, via: "viewer" } : null;
    } catch(e) { return null; }
  }
  // (2.2.419) the walk script (after this one) offers its Walk button for the SAME copy Edit is offered for.
  Object.defineProperty(window, "teckelEditableCopy", { configurable: false, enumerable: false, writable: false,
    value: function () {
      const c = copyOnScreen();
      return c ? Object.freeze({ instance_id: String(c.instance_id), form_name: c.form_name || null,
                                 form_kind: c.form_kind ? String(c.form_kind) : "",
                                 status: c.status ? String(c.status) : "", display: c.display ? String(c.display) : "",
                                 by_voice: c !== null && c === voiceOnScreen(), by_viewer: c.via === "viewer" }) : null;
    } });
  // (2.2.421) the live form (its script comes after the walk script), while the server's page_features say it is on
  function liveForm(){
    const L = window.teckelLiveForm;
    try { return (L && typeof L.on === "function" && L.on() === true) ? L : null; } catch(e) { return null; }
  }
  function syncBtn(){
    const c = copyOnScreen();
    const L = liveForm();
    // (Phase 4, 2.2.427) a survey, a task grid or a consent form is the LIVE FORM's (its lanes): this panel never takes one
    ed.btn.hidden = !c || (shown(c.form_kind) && (c.form_kind === "other" || (!L && LIVE_ONLY.indexOf(c.form_kind) !== -1)))
                    || (!!L && L.offersEdit() !== true);
    if (cur && (!c || String(c.instance_id) !== cur.iid || L)) closePanel();   /* the form left the viewer (or went live) */
    ed.btn.setAttribute("aria-expanded", cur ? "true" : "false");
    autoOpen(c);                                            /* (2.2.420) a form Benedict opened: Edit at once */
  }

  /* ══ (24 Oct 2026; Yusuf: "the form should open in edit mode", F-FK; server 2.2.420, R420_OPEN_EDIT) ════════════════
     · A FORM BENEDICT OPENED BY VOICE OPENS IN EDIT AT ONCE: when the copy on screen is the one the server named for his
       display_form (resolve_view, window.teckelVoiceCopy — a NEW object for every display of his), editable, and the
       server says page_features.open_edit, the panel opens by itself, ONCE for that display (closing it keeps it
       closed). In place: no focus is taken (the user may be typing elsewhere), nothing is scrolled into view, and when the
       panel opens above a viewer the user has scrolled into, the page is moved by exactly the height it added, so what
       is under the user's eyes stays still. Not while the walk panel is open, not over the page's own form.
     · window.teckelEditOpen() — the walk script's voice op "edit" (kev's {kind:"walk_control", op:"edit"}): opens this
       panel for the copy on screen exactly as the Edit button does, only while Edit is shown and usable and the server
       says page_features.voice_edit_walk; true when it opened (or was open for that copy). */
  function features(){
    try { return (typeof window.teckelPageFeatures === "function") ? window.teckelPageFeatures() : null; }
    catch(e) { return null; }
  }
  let autoFor = null;      /* the voice copy (its object) the panel last opened itself for */
  function usableBtn(){ return !!(ed.btn && !ed.btn.hidden && !ed.btn.disabled && !ed.btn.hasAttribute("data-pp-lock")); }
  function inPlace(fn){
    const shell = document.querySelector(".form-viewer-shell");
    const before = shell ? shell.getBoundingClientRect().top : null;
    fn();
    if (shell === null || before === null || before >= 0) return;   /* the viewer's top was in view: the panel shows */
    const moved = shell.getBoundingClientRect().top - before;
    if (moved) { try { window.scrollBy(0, moved); } catch(e) {} }
  }
  function autoOpen(c){
    if (liveForm()) return;                                 /* (2.2.421) the live form opens instead */
    const f = features();
    if (!f || f.open_edit !== true || off || cur || opening || !P.held() || !c) return;
    let v = null;
    try { v = (typeof window.teckelVoiceCopy === "function") ? window.teckelVoiceCopy() : null; } catch(e) { v = null; }
    if (!v || v === autoFor || v.editable !== true || String(v.instance_id) !== String(c.instance_id)) return;
    const wp = document.getElementById("pp-walk");
    if (wp && !wp.hidden) return;
    autoFor = v;
    openPanel(true);
  }
  Object.defineProperty(window, "teckelEditOpen", { configurable: false, enumerable: false, writable: false,
    value: function () {
      const f = features();
      if (!f || f.voice_edit_walk !== true || off || !P.held() || !usableBtn()) return false;
      const c = copyOnScreen();
      if (!c) return false;
      if (cur && cur.iid === String(c.instance_id)) return true;
      openPanel(true);
      return true;
    } });
  function setOff(){
    off = true;
    closePanel();
    ed.btn.disabled = true; ed.btn.title = EDIT_SOON;
    ed.btn.setAttribute("aria-label", EDIT_SOON);
    // Greyed by the door just now? Then reopening must keep it greyed: the state the door puts back is this one.
    if (ed.btn.hasAttribute("data-pp-lock")) ed.btn.setAttribute("data-pp-was", "1");
  }
  function closePanel(){
    cur = null;
    clearTimeout(redrawTimer); redrawTimer = null;
    ed.body.textContent = ""; txt(ed.title, ""); txt(ed.msg, "");   /* the practice's answers leave the page */
    ed.panel.hidden = true;
    ed.btn.setAttribute("aria-expanded", "false");
  }

  /* ══ OPEN: form_fields ══════════════════════════════════════════════════════════════════ */
  async function openPanel(here){
    if (off || opening || !P.held()) return;
    const c = copyOnScreen();
    if (!c) { syncBtn(); return; }
    // (2.2.420) opened by itself or by voice: in place (no focus, no scroll under the user); a click: as 2.2.419
    const show = function (fn) { if (here === true) inPlace(fn); else fn(); };
    const mine = { iid: String(c.instance_id), name: shown(c.form_name) ? String(c.form_name) : "", kind: "" };
    cur = mine;
    show(function () {
      ed.body.textContent = ""; txt(ed.title, mine.name); txt(ed.msg, "Loading the questions…");
      ed.panel.hidden = false; ed.btn.setAttribute("aria-expanded", "true");
    });
    opening = true;
    let r;
    try { r = await P.action("form_fields", { instance_id: mine.iid }); }
    finally { opening = false; }
    if (cur !== mine) return;                               /* closed, or the form left the viewer, meanwhile */
    if (EDIT_OFF.indexOf(codeOf(r)) !== -1) { setOff(); return; }
    if (lapsed(r)) { closePanel(); return; }
    if (!r || r.success !== true) { txt(ed.msg, msgOf(r, "This form could not be opened for typing just now.")); return; }
    if (shown(r.title)) txt(ed.title, r.title);
    if (r.editable !== true) {                              /* submitted, or a kind not editable yet: the server says why */
      txt(ed.msg, msgOf(r, "This form can't be changed here."));
      return;
    }
    mine.kind = String(r.form_kind || "");
    show(function () {
      if (mine.kind === "qa" && Array.isArray(r.questions)) {
        renderQuestions(mine, r.questions);
        txt(ed.msg, "Each answer is saved when you leave its box or press Enter.");
      } else if (mine.kind === "log" && Array.isArray(r.columns)) {
        renderEntry(mine, r.columns, r.entry_count);
        txt(ed.msg, "Type a new entry, then press Save entry.");
      } else {
        txt(ed.msg, "This form can't be changed here.");
      }
    });
  }

  /* ══ ONE BOX ════════════════════════════════════════════════════════════════════════════ */
  function unitHint(unit){
    const u = String(unit || "");
    if (u === "temperature") return "a number, in °C";
    if (u === "days" || u === "hours" || u === "minutes") return "a number of " + u;
    return "a number";
  }
  function pickOption(options, value){
    const v = String(value || "").trim().toLowerCase();
    if (!v) return "";
    const hit = options.find(function (o) { return String(o).trim().toLowerCase() === v; });
    return hit === undefined ? "" : String(hit);
  }
  // { el, hint } — a list for a choice, else a text box with the kind's hint. Built as DOM, never markup.
  function box(kind, options, id, value, unit){
    let ctl, h = "";
    if (kind === "option" && Array.isArray(options) && options.length) {
      ctl = document.createElement("select");
      ctl.appendChild(el("option", "", "-- Select --"));   /* (phase 1, Yusuf F-FX) the unselected state */
      ctl.options[0].value = "";
      options.forEach(function (o) { const op = el("option", "", o); op.value = String(o); ctl.appendChild(op); });
      ctl.value = pickOption(options, value);
    } else {
      ctl = document.createElement("input");
      ctl.type = "text"; ctl.maxLength = MAX_VALUE; ctl.autocomplete = "off";
      ctl.value = shown(value) ? String(value) : "";
      h = kind === "number" ? unitHint(unit) : (HINT[kind] || "");
      if (kind === "number") ctl.inputMode = "decimal";
      if (h) ctl.placeholder = h;
    }
    ctl.id = id; ctl.className = "lv-input pp-edit-input";
    let hint = null;
    if (h) { hint = el("p", "pp-hint pp-edit-hint", h); hint.id = id + "-h"; ctl.setAttribute("aria-describedby", hint.id); }
    return { ctl: ctl, hint: hint };
  }
  function row(list, labelText, id){
    const r = el("div", "pp-edit-row");
    const lab = el("label", "pp-edit-label", labelText); lab.htmlFor = id;
    const cell = el("div", "pp-edit-cell");
    r.appendChild(lab); r.appendChild(cell); list.appendChild(r);
    return cell;
  }
  function locked(cell, id){
    const p = el("p", "pp-edit-locked", PERSONAL_LINE); p.id = id;
    cell.appendChild(p);
  }
  function status(cell){
    const s = el("p", "pp-edit-status"); s.setAttribute("role", "status"); s.setAttribute("aria-live", "polite");
    cell.appendChild(s);
    return s;
  }
  function say(s, text, good){
    s.className = "pp-edit-status" + (good === true ? " pp-ok" : good === false ? " pp-bad" : "");
    txt(s, text);
  }

  /* ══ A QUESTION FORM: save_answer, one question at a time ══════════════════════════════ */
  function renderQuestions(mine, questions){
    const list = el("div", "pp-edit-list");
    questions.forEach(function (q) {
      if (!q || typeof q !== "object" || !shown(q.number)) return;
      const id = "pp-ed-" + (++rowSeq);
      const cell = row(list, String(q.number) + ". " + String(q.label || ""), id);
      if (q.personal === true) { locked(cell, id); return; }
      const b = box(String(q.kind || "text"), q.options, id, q.answer);
      cell.appendChild(b.ctl); if (b.hint) cell.appendChild(b.hint);
      wireAnswer(mine, String(q.number), b.ctl, status(cell));
    });
    ed.body.appendChild(list);
  }
  function wireAnswer(mine, qn, ctl, st){
    const s = { saved: String(ctl.value || ""), busy: false, again: false };   /* what the server holds, as far as we know */
    async function save(){
      if (cur !== mine || off) return;
      const v = String(ctl.value || "");
      if (v.trim() === s.saved.trim()) return;               /* nothing changed: no request */
      if (s.busy) { s.again = true; return; }
      s.busy = true; s.again = false;
      say(st, "Saving…");
      let r;
      try { r = await P.action("save_answer", { instance_id: mine.iid, question_number: qn, value: v }); }
      finally { s.busy = false; }
      if (cur !== mine) return;
      if (EDIT_OFF.indexOf(codeOf(r)) !== -1) { setOff(); return; }
      if (lapsed(r)) return;                                  /* the door closes the panel with the page */
      if (r && r.success === true) {
        const kept = (typeof r.value_saved === "string") ? r.value_saved : v;
        s.saved = kept;
        if (ctl.tagName === "SELECT") ctl.value = pickOption(Array.from(ctl.options).map(function (o) { return o.value; }), kept);
        else if (String(ctl.value || "") === v) ctl.value = kept;   /* the server's form of it (a date, an option) */
        say(st, r.cleared === true ? "✓ Cleared" : "✓ Saved", true);
        if (r.unchanged !== true) afterWrite(mine, qn);
      } else {
        say(st, msgOf(r, "That answer was not saved."), false);    /* nothing was written: the box keeps what was typed */
      }
      if (s.again) save();
    }
    if (ctl.tagName === "SELECT") ctl.addEventListener("change", save);
    else {
      ctl.addEventListener("blur", save);
      ctl.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); save(); } });
    }
  }

  /* ══ A COLUMN LOG: save_log_entry, one NEW entry ═══════════════════════════════════════ */
  function entriesLine(n){ return "Saved — the log now has " + n + (n === 1 ? " entry." : " entries."); }
  function renderEntry(mine, columns, count){
    ed.body.appendChild(el("h3", "pp-h3", "New entry"));
    if (typeof count === "number" && isFinite(count)) {
      ed.body.appendChild(el("p", "pp-hint", "The log has " + count + (count === 1 ? " saved entry." : " saved entries.")));
    }
    const list = el("div", "pp-edit-list");
    const boxes = [];
    columns.forEach(function (c) {
      if (!c || typeof c !== "object" || !shown(c.key)) return;
      const id = "pp-ed-" + (++rowSeq);
      const cell = row(list, String(c.label || c.key), id);
      if (c.personal === true) { locked(cell, id); return; }
      const b = box(String(c.kind || "text"), c.options, id, "", c.unit);
      cell.appendChild(b.ctl); if (b.hint) cell.appendChild(b.hint);
      boxes.push({ key: String(c.key), ctl: b.ctl, st: status(cell) });
    });
    ed.body.appendChild(list);
    const acts = el("div", "pp-actions");
    const saveBtn = el("button", "lv-btn primary", "Save entry"); saveBtn.type = "button"; saveBtn.id = "pp-ed-save";
    const blankBtn = el("button", "lv-btn", "Save with them blank"); blankBtn.type = "button"; blankBtn.id = "pp-ed-blank";
    blankBtn.hidden = true;
    acts.appendChild(saveBtn); acts.appendChild(blankBtn);
    ed.body.appendChild(acts);
    const res = el("p", "pp-result"); res.id = "pp-ed-result";
    res.setAttribute("role", "status"); res.setAttribute("aria-live", "polite");
    ed.body.appendChild(res);
    let busy = false;
    async function saveEntry(saveBlank){
      if (cur !== mine || off || busy) return;
      busy = true; blankBtn.hidden = true;
      boxes.forEach(function (x) { say(x.st, ""); });
      const values = {};
      boxes.forEach(function (x) { values[x.key] = String(x.ctl.value || ""); });
      const args = { instance_id: mine.iid, values: values };
      if (saveBlank === true) args.save_blank = true;
      txt(res, "Saving…");
      let r;
      try { r = await P.action("save_log_entry", args); }
      finally { busy = false; }
      if (cur !== mine) return;
      if (EDIT_OFF.indexOf(codeOf(r)) !== -1) { setOff(); return; }
      if (lapsed(r)) return;
      if (r && r.success === true) {
        boxes.forEach(function (x) { x.ctl.value = ""; });
        txt(res, (typeof r.entry_count === "number") ? entriesLine(r.entry_count) : "Saved.");
        afterWrite(mine, null);
        return;
      }
      const code = codeOf(r);
      if (code === "ENTRY_REFUSED" && Array.isArray(r.refused)) {
        const loose = [];
        r.refused.forEach(function (f) {
          if (!f || typeof f !== "object") return;
          const x = boxes.find(function (b) { return b.key === String(f.key); });
          if (x) say(x.st, msgOf(f, "This value was not accepted."), false);
          else loose.push((shown(f.label) ? String(f.label) + ": " : "") + msgOf(f, "not accepted"));
        });
        txt(res, msgOf(r, "Nothing was saved.") + (loose.length ? " " + loose.join(" ") : ""));
        return;
      }
      if (code === "BLANK_FIELDS") {                          /* named first; saved blank only when the user says so */
        txt(res, msgOf(r, "Some fields are blank. Save the entry with them blank?"));
        blankBtn.hidden = false;
        return;
      }
      txt(res, msgOf(r, "The entry was not saved."));
    }
    saveBtn.addEventListener("click", function () { saveEntry(false); });
    blankBtn.addEventListener("click", function () { saveEntry(true); });
  }

  /* ══ AFTER A SAVE THAT WROTE: tell the conversation, redraw the form ═══════════════════ */
  function afterWrite(mine, qn){
    try {
      if (P.live() && typeof window.teckelFormChanged === "function") window.teckelFormChanged(mine.iid, qn);
    } catch(e) {}
    clearTimeout(redrawTimer);                              /* several saves in a row: one redraw */
    redrawTimer = setTimeout(function () { redrawTimer = null; redraw(mine); }, 400);
  }
  async function redraw(mine){
    if (cur !== mine) return;
    let how = "gone";
    try { how = window.teckelPortalViewer ? window.teckelPortalViewer.redraw() : "gone"; } catch(e) { how = "gone"; }
    if (how !== "stale") return;                            /* redrawn, or the form is no longer on screen */
    const r = await P.action("view_link", { instance_id: mine.iid });
    if (cur !== mine || lapsed(r) || !r || r.success !== true || !r.url) return;
    if (typeof window.teckelPortalShow === "function") await window.teckelPortalShow("form", r.url, r.expires_at);
  }

  /* ══ EVENTS ═════════════════════════════════════════════════════════════════════════════ */
  ed.btn.addEventListener("click", function () {
    const L = liveForm();
    if (L) { L.open(); return; }                            /* (2.2.421) Edit opens the live form */
    if (cur) closePanel(); else openPanel();
  });
  ed.close.addEventListener("click", function () { closePanel(); try { ed.btn.focus(); } catch(e) {} });
  window.addEventListener("teckel-viewer", syncBtn);     /* the viewer or the copy on it changed */
  const frame = $("form-viewer");
  if (frame && typeof MutationObserver === "function") {   /* a card written into the frame replaces the form too */
    new MutationObserver(syncBtn).observe(frame, { attributes: true, attributeFilter: ["src", "srcdoc"] });
  }
  P.on("signin", syncBtn);
  P.on("lapse", function () { closePanel(); syncBtn(); });
  P.on("mode", function (m) { if (m === "legacy") setOff(); syncBtn(); });
  if (P.mode() === "legacy") setOff();
  syncBtn();
})();
\x3c/script>

         Each step is sent as
           {kind:"walk_step", step:"action", instance_id, speak, say: \x3cthe preview's say>, payload:{action, ready}}
         A click on GREEN is the confirmation: submit with the preview's confirm_token (previewed again first if the token

         leaves — Silent is speak:false, "again" re-sends THE SAME envelope with speak:true ONCE and leaves the mode as it
         is, a typed answer sends form_changed, and nothing is ever written at a step that is not a field. Step "row" (a
         cursor over a list) is reserved and NOT built: the transport refuses any step it does not know.
       · kev's {kind:"walk_control", op, number}: ⛔ ONLY the ops in VOICE_OPS — submit, sign, upload, skip, back, stop,
         again, quiet, speak — and each ONLY when its button is shown and usable for this copy now (skip / back / stop /
         again for the question on screen); anything else is ignored, logged to the console. NEVER by voice: discard,
         remove, a document's removal or detaching, a log entry's removal, a custom question's removal, a resend, the
         status report — destructive and outward actions other than this copy's Submit stay click-only, by construction.
         A VOICE submit on GREEN shows "Sending to \x3caddress>…" with Cancel for 3 seconds first (Cancel sends nothing); on
         RED it checks again and, still blocked, sends the fresh step with speak:true once — nothing is submitted.
       · Voice on / off sends {kind:"walk_control", op:"speak" | "quiet"}; Stop (and a walk that ends) sends
         {kind:"walk_control", op:"stop"} so the conversation drops the field.
       · (24 Oct 2026, page 2.2.421; Yusuf: "THE FORM ITSELF TURNS INTO LIVE FIELDS ... BY DEFAULT") WHILE THE LIVE FORM IS

         and kev's walk frames go to the live form first (window.teckelLiveForm.frame takes every frame while it is on) —
         so there is never a second driver. Off (page_features absent, or live_form false), everything here is 2.2.420's.
       · WALK_TIDY_HOOK — ⬜ NOT IN THIS BUILD: the surface-only tidy-up of a long free-text answer, SHOWN before it saves,
         is kev's (Yusuf's contract, local model first). Until it lands the page shows what kev saved, in the box, editable.
     ⚠ Every request goes through window.teckelPortal.action, which adds the pass; this script never holds it and makes no
