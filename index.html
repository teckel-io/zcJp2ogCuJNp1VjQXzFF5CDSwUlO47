                       needs a signed voice token and the token needs a verified browser, so the
                       check comes BEFORE the socket, and a verified browser never sees this box.
                       ⚠ Hidden by default. It appears only when a token is refused.
                       ⚠ THE CODE ROTATES EVERY 15 MINUTES (Yusuf, 15 Oct 2026), so "not
                       recognised" usually means EXPIRED. The hint says so before the first
                       failure, not as an excuse after it. ─────────────────────────────── -->
                  \x3c!-- ── THE PORTAL DOOR'S OWN LINE (21 Oct 2026) ────────────────────────────

                       that cannot be answered (no network, a page not set up), it says so here,
                       with Try again where trying again can help. Never greyed: like the code row
                       below, it is how the page opens. The page writes it; hidden until then. -->

                \x3cscript>
                /* 3 Oct 2026 (Steven) — CLICK A FORM AND BENEDICT OPENS IT. The ElevenLabs widget
                   accepts a user message from the page (event "elevenlabs-agent:user-message")
                   only when the tag carries allow-events. Set here, not in the tag itself, so the
                   tag's text — which the tenant resync reads the agent id from — is unchanged. */
                (function () {

    \x3c!-- LOCAL BUILD: the ElevenLabs runtime is deliberately NOT loaded. The
         \x3celevenlabs-convai> tags remain in the DOM, inert and hidden by CSS, purely
         because discoverAgentId() reads the agent id from them. Nothing upgrades them,
         no EL connection is made, and no EL credit can be spent from this page. -->

    \x3c!-- teckel custom client-tool handlers — identical for every tenant page.
         display_form: opens a form in the iframe and (optionally) starts the
                       per-instance rolling-token poll for iframe self-heal.

         v2.2.55 (Phase 13.1 hardening, 9 May 2026) — display_form takes a
         single \`view_session_id\` argument (not pdf_url/cost_url). The
         browser fetches /document_analyser/resolve_view_session?id=\x3cid>
         to retrieve the actual signed URLs and load them. Long opaque
         strings never travel through the LLM — fix for the Benedict-
         mangles-base64-token failure surfaced by Phase 16 telemetry.

         v2.2.48 (Phase 15.1) — TWO independent pollers run on this page:
           1. AGENT-LEVEL poll  — kicked at DOMContentLoaded, drives the
              visible cost meter UI. Polls /document_analyser/render_agent
              _session_cost?agent_id=...&since=session_start every 5s.
              Aggregates billing across all instances since page load
              (so the meter ticks even before any form has been opened).
           2. PER-INSTANCE poll — kicked when display_form fires (after
              the resolve fetch returns a cost_url). Polls /document_
              analyser/render_session_cost?instance_id=...&token=... every
              5s. Used ONLY for rolling-token iframe self-heal — its cost
              summary is no longer rendered to the meter. -->
    \x3cscript>
    (function () {
        'use strict';

        // -----------------------------------------------------------------
        // Which origins this page trusts (25 Oct 2026, F-HA; Yusuf: "build the fix and republish the 17 pages")
        // -----------------------------------------------------------------
        // The practice pages moved from teckel-io.github.io to benedict.teckel.io, and a frame opened from an
        // old-host link follows the redirect and ENDS on the new host, so a check pinned to one host refused it
        // (a click in the traffic-light list never reached Benedict). Every origin and link check below accepts
        // this page's own origin and both teckel hosts — never one host alone (a page on a practice's own domain
        // is its location.origin).
        var OK_ORIGINS = [location.origin, 'https://teckel-io.github.io', 'https://benedict.teckel.io'];
        function isOkOrigin(o) { return OK_ORIGINS.indexOf(o) !== -1; }
        // A teckel page link: one of OK_ORIGINS, then a path + query that pathRe matches (pathRe starts at the "/").
        function isTeckelPageUrl(url, pathRe) {
            if (!url || typeof url !== 'string') return false;
            for (var i = 0; i \x3c OK_ORIGINS.length; i++) {
                var o = OK_ORIGINS[i];
                if (url.indexOf(o + '/') === 0 && pathRe.test(url.slice(o.length))) return true;
            }
            return false;
        }

        // -----------------------------------------------------------------
        // tc → GBP conversion
        // -----------------------------------------------------------------
        // payments_due rows that aren't backed by a cost_events row (i.e.
        // the v2.2.48 nominal flat fees — instance creation, field update,
        // form submission, etc.) carry no GBP cost from the server: the
        // SQL function LEFT JOINs cost_events and falls through to 0
        // when no row exists. That makes \`totals.gbp\` zero for any
        // session that hasn't done LLM extractions, even though the user
        // has very real tc charges accumulated.
        //
        // This constant matches the \`tc_per_gbp\` rate stored in the
        // teckel.tc_rates table (500,000 tc per GBP — tc_Price-Matrix.xlsx, 7 Jun 2026; keep in sync with teckel.tc_rates).
        // If the rate changes, update this constant. Long-term fix is to
        // server-side-derive gbp from tc when cost_event_id IS NULL — see
        // Phase 15 roadmap.
        var TC_PER_GBP = 500000;
        function tcToGbp(totals) {
            // Prefer server-supplied gbp_cost when present (accurate for
            // LLM token costs); fall back to the constant for flat fees.
            if (totals && totals.gbp && totals.gbp > 0) return totals.gbp;
            var tc = (totals && totals.tc) || 0;
            return tc / TC_PER_GBP;
        }

        // -----------------------------------------------------------------
        // Shared cost-meter UI renderer
        // -----------------------------------------------------------------

        function formatCostUnit(gbp) {
            // Round UP to whole pence; pounds shown whole with the
            // residual whole pence beside them (Steven directive 9 Jun 2026):
            //
            //   \x3c£1   →  "X p"     (whole pence, rounded up)
            //   ≥£1   →  "£N R p"  (whole pounds + whole residual pence)
            //   exact →  "£N"      (residual = 0 → no trailing " 0 p")
            //
            // Examples:
            //   9.96p     → "10 p"
            //   62.6277p  → "63 p"
            //   £1.00     → "£1"
            //   720.3064p → "£7 21 p"
            var pence = Math.ceil((gbp || 0) * 100);
            if (pence \x3c 100) {
                return pence.toLocaleString('en-GB') + ' p';
            }
            var wholePounds   = Math.floor(pence / 100);
            var residualPence = pence - (wholePounds * 100);
            var poundsStr = '£' + wholePounds.toLocaleString('en-GB');
            if (residualPence === 0) {
                return poundsStr;
            }
            return poundsStr + ' ' + residualPence.toLocaleString('en-GB') + ' p';
        }

        // Human-readable labels for event_type — mirrors server's
        // _compose_session_summary LABEL dict in
        // teckel__document_analyser_v2_2.py so the website breakdown
        // and Benedict's spoken _session_summary use IDENTICAL wording.
        // Add new mappings here whenever a new event_type ships
        // server-side. (20 May 2026 fix — Steven feedback: website
        // breakdown previously diverged from Benedict's output.)
        var EVENT_TYPE_LABEL = {
            form_submission:          'form submission',
            log_snapshot_submission:  'log snapshot submission',
            log_entry_append:         'log entries added',
            log_entry_edit:           'log entry edits',
            log_entry_remove:         'log entry removals',
            log_re_render:            'log re-renders',
            form_view_open:           'form viewer opens',
            field_update:             'field updates',
            save_progress:            'bulk saves',
            instance_creation:        'form starts',
            form_revision:            'form revisions',
            status_report:            'status reports',
            evidence_upload:          'evidence uploads',
            catalogue_lookup:         'catalogue searches',
            template_fetch:           'template fetches',
            instance_read:            'instance reads',
            instances_listing:        'instance listings',
            edition_diff:             'edition diffs',
            duty_cycle_query:         'due-within queries',
            log_state_read:           'log state reads',
            log_history_read:         'log history reads',
            phase_0_lookup:           'session lookups',
            extraction_bundle:        'extraction passes',
            flat_fee:                 'other'
        };

        function formatBreakdownLine(it) {
            var n     = it.n_events || 0;
            var tc    = Math.ceil(it.tc_cost || 0).toLocaleString('en-GB',
                          { maximumFractionDigits: 0 });
            var label = EVENT_TYPE_LABEL[it.event_type]
                        || (it.event_type || '').replace(/_/g, ' ');
            return n + ' ' + label + ' (' + tc + ' tc)';
        }

        function setCostMeter(totals, n_events, items) {
            try {
                totals = totals || {};
                items  = items  || [];
                var tcStr   = Math.ceil(totals.tc || 0).toLocaleString('en-GB',
                              { maximumFractionDigits: 0 });
                var costStr = formatCostUnit(tcToGbp(totals));
                var totalEl     = document.getElementById('cost-total');
                var breakdownEl = document.getElementById('cost-breakdown');
                if (totalEl)     totalEl.textContent     = tcStr + ' tc · ' + costStr;
                if (!breakdownEl) return;
                if (!n_events || !items.length) {
                    breakdownEl.textContent = 'no billable events yet';
                    return;
                }
                // Format matches Benedict's spoken _session_summary
                // verbatim: "{n} {label} ({tc} tc)" joined by "; ".
                breakdownEl.textContent = items.map(formatBreakdownLine)
                                               .join('; ');
            } catch (e) {
                console.warn('setCostMeter failed', e);
            }
        }

        // -----------------------------------------------------------------
        // FINAL-TOTAL block — populated by the post-session webhook
        // -----------------------------------------------------------------
        // After a conversation ends, Yusuf's ElevenLabs post-conversation
        // webhook calls da.update_conversation_cost_in_telemetry, which
        // writes cost_of_chat_agent_in_tc + cost_of_da_in_tc +
        // cost_total_in_tc on the agent_conversations row. The website
        // polls /document_analyser/render_session_final_cost in parallel
        // with the running meter; when \`ready: true\` is returned, the
        // final block lights up showing the session's TOTAL cost
        // (voice + DA combined).
        //
        // The running meter stays visible too — it covers the current
        // session's activity until that session's own webhook fires.
        // Voice-agent tc is NOT in the running meter (the running poll
        // reads payments_due only); voice tc is FIRST visible in this
        // final block.
        // -----------------------------------------------------------------

        var lastFinalConversationId = null;

        function setFinalCostBlock(payload) {
            try {
                var block      = document.getElementById('cost-final');
                var totalEl    = document.getElementById('cost-final-total');
                if (!block || !totalEl) return;
                if (!payload || !payload.ready) {
                    block.style.display = 'none';
                    return;
                }
                var total = payload.cost_total_in_tc         || 0;
                var totalStr = Math.ceil(total).toLocaleString('en-GB',
                                  { maximumFractionDigits: 0 }) + ' tc';
                var totalGbp = formatCostUnit(total / TC_PER_GBP);
                totalEl.textContent = totalStr + ' · ' + totalGbp;
                block.style.display = 'block';
                lastFinalConversationId = payload.conversation_id || lastFinalConversationId;
            } catch (e) {
                console.warn('setFinalCostBlock failed', e);
            }
        }

        // -----------------------------------------------------------------
        // 1. AGENT-LEVEL cost poll (v2.2.48) — drives the visible meter.
        // -----------------------------------------------------------------
        // Reads agent_id from the FIRST \x3celevenlabs-convai> tag on the
        // page (Brenda or Benedict — both will resolve to the same
        // user wallet via teckel's agent → wallet mapping). Captures
        // session_start as ISO at script load and polls every 5s.
        // -----------------------------------------------------------------

        var MCP_BASE = 'https://mcp2.bh.tkllabs.io:9779';

        var sessionAgentId = null;
        var sessionStart   = new Date().toISOString();
        var agentPollInterval = null;

        function discoverAgentId() {
            var tags = document.querySelectorAll('elevenlabs-convai');
            for (var i = 0; i \x3c tags.length; i++) {
                var aid = tags[i].getAttribute('agent-id');
                if (aid && aid.indexOf('PLACEHOLDER') === -1) {
                    return aid;
                }
            }
            return null;
        }

        // ── Is Benedict actually reachable by the public? ───────────────────────
        // WHY (Steven, 25 Aug 2026). Running out of teckel credits DISABLES the agent
        // by design — a teckel-side hourly job sets ElevenLabs \`enable_auth=true\`, which
        // makes the widget 401 for anonymous visitors. The page then looks completely
        // healthy and the microphone simply does nothing, which is the worst possible
        // failure: indistinguishable from the practice having nothing to say.
        //
        // The signal is the agent's own PUBLIC widget endpoint, which is a READ (it mints
        // nothing) and is CORS-open. Verified live on a test rig 25 Aug:
        //     enable_auth=false -> HTTP 200      enable_auth=true -> HTTP 401
        //
        // ⚠ ABSENCE OF EVIDENCE IS NEVER EVIDENCE OF AN OUTAGE. Only 401/403 raises the
        // banner. A 429 (this endpoint is anonymous and throttled), a network failure or
        // any other status renders NOTHING. The guard learned this the hard way: an
        // earlier version treated every non-200 as blocked, "healed" a healthy agent and
        // reported it still broken. A banner accusing a practice of unpaid credits when
        // the truth is a rate limit is worse than showing nothing at all.
        // LOCAL V2 (20 Oct 2026): THE BANNER FOLLOWS THE LOCAL GATE, NOT ELEVENLABS. The check
        // above asked ElevenLabs' widget endpoint whether billing had switched the EL agent off,
        // which says nothing about this page's voice chain; on the test portal the banner and
        // Start could contradict each other in either direction. The local gate is
        // get_voice_token, and it is asked when the user presses Start (it mints a single-use
        // token, so it is not called at page load). The transport raises the banner on the
        // server's credit refusal and lowers it when a token is minted. Same contract as
        // before: hidden until PROVEN, so a page load on its own claims nothing.
        function checkBenedictAvailability() { /* see above: the local gate decides, at Start */ }
        window.teckelCreditsBanner = function (show) {
            var el = document.getElementById('benedict-disabled-banner');
            if (el) el.hidden = !show;
        };

        // ── PRACTICE-PROFILE COMPLETENESS BANNER (26 Aug 2026) ───────────────────────
        // A live practice ran for weeks with no practice profile at all, so every form it
        // rendered carried NO letterhead. The feature had shipped; only the data was
        // missing, and nothing anywhere reported it (N60). This is that report.
        //
        // ⚠ SAME CONTRACT AS THE CREDITS BANNER: render only on a definite answer. A
        // non-OK response, a network failure, or ok=false renders NOTHING. Telling a
        // practice its details are incomplete when the truth is that we could not look is
        // worse than saying nothing — the 2.2.298 lesson, applied deliberately here.
        //
        // ⚠ The server returns FIELD NAMES ONLY, never values. Do not "improve" this by
        // showing current values: the endpoint is unauthenticated and the page is public.
        function fillProfileBanner(data) {
            if (!data || data.ok !== true || data.complete === true) return;
            var missing = data.missing || [];
            if (!missing.length) return;            // nothing required is blank: say nothing

            var head = document.getElementById('profile-incomplete-head');
            var det  = document.getElementById('profile-incomplete-detail');
            var box  = document.getElementById('profile-incomplete-banner');
            if (!head || !det || !box) return;

            // NAME THE FIELDS when the profile is mostly there — Steven, 26 Aug: "even
            // better, name the fields that are blank if mostly filled". A practice one
            // field short should be told WHICH field; one that has filled in nothing needs
            // a different, shorter sentence than a list of everything.
            if (data.filled === 0) {
                head.textContent = 'Your practice details have not been set up yet.';
                det.textContent  = 'Until they are, forms you submit or print carry no '
                                 + 'letterhead — no practice name, address or contact '
                                 + 'details. You can add them from the Settings menu.';
            } else {
                var list = missing.length === 1
                    ? missing[0]
                    : missing.slice(0, -1).join(', ') + ' and ' + missing[missing.length - 1];
                head.textContent = 'Your practice profile is incomplete — '
                                 + 'still to add: ' + list + '.';
                det.textContent  = 'These appear on the letterhead of every form you submit '
                                 + 'or print. You can add them from the Settings menu ('
                                 + data.filled + ' of ' + data.total + ' already set).';
            }
            box.hidden = false;
        }

        function checkPracticeProfile() {
            var aid = discoverAgentId();
            if (!aid) return;                       // no agent on the page: say nothing
            fetch(MCP_BASE + '/document_analyser/practice_profile_status'
                  + '?agent_id=' + encodeURIComponent(aid),
                  { method: 'GET', credentials: 'omit' })
                .then(function (resp) { return resp.ok ? resp.json() : null; })
                .then(fillProfileBanner)
                .catch(function (e) {
                    // Deliberately silent: we could not tell, so we claim nothing.
                    console.warn('[teckel] profile check inconclusive', e);
                });
        }

        function pollAgentCostOnce() {
            if (isIdle()) return;   // conversation over — stop polling the server
            if (!sessionAgentId) return;
            var url = MCP_BASE
                    + '/document_analyser/render_agent_session_cost'
                    + '?agent_id=' + encodeURIComponent(sessionAgentId)
                    + '&since='    + encodeURIComponent(sessionStart);
            fetch(url, { method: 'GET', credentials: 'omit' })
                .then(function (resp) {
                    if (!resp.ok) {
                        console.warn('[teckel] agent-level cost poll non-OK', resp.status);
                        return null;
                    }
                    return resp.json();
                })
                .then(function (data) {
                    if (!data) return;
                    setCostMeter(data.totals, data.n_billable_events, data.items);
                })
                .catch(function (e) {
                    console.warn('[teckel] agent-level cost poll failed', e);
                });
        }

        // App-safety banner (28 Aug 2026) — see the markup comment for why this one shows
        // by default while its two neighbours hide by default.
        //
        // ⚠ DISMISSAL IS PER-DEVICE, AND THAT IS THE DESIGN, NOT A SHORTCUT. A server-side
        //   "dismissed" flag on the practice was my first instinct and it is exactly wrong:
        //   the moment this warning matters most is a FRESH INSTALL or a NEW PHONE, which is
        //   precisely when a server flag would say "already dismissed" and stay silent.
        //   localStorage is per-device, so a new device re-warns the person at risk.
        // ⚠ AND THE DISMISSAL IS AN ASSERTION, NOT EVIDENCE. "Got it" records that someone
        //   clicked a button on this browser. It never means the practice is protected, and
        //   nothing should ever read it as coverage.
        function initAppSafetyBanner() {
            var el = document.getElementById('app-safety-banner');
            if (!el) { return; }
            // LOCAL V2 (24 Oct 2026): per practice — every practice's page shares the github.io origin (V23)
            var KEY = 'teckel.appSafetyBannerDismissed.v3__' + (discoverAgentId() || 'unknown');
            var dismissed = false;
            try {
                dismissed = window.localStorage.getItem(KEY) === '1';
            } catch (e) {
                // ⚠ FAIL TOWARDS SHOWING IT. Private browsing and blocked site-data both
                // throw here. A warning shown twice is a minor irritation; a warning
                // silently suppressed by a storage error is the failure we are guarding.
                dismissed = false;
            }
            if (dismissed) { return; }
            el.hidden = false;
            var btn = document.getElementById('app-safety-dismiss');
            if (btn) {
                btn.addEventListener('click', function () {
                    el.hidden = true;
                    try { window.localStorage.setItem(KEY, '1'); } catch (e) { /* see above */ }
                });
            }
        }

        function startAgentCostPoll() {
            checkBenedictAvailability();
            checkPracticeProfile();
            initAppSafetyBanner();
            sessionAgentId = discoverAgentId();
            if (!sessionAgentId) {
                console.warn('[teckel] no agent-id found on the page — cost meter will stay dormant');
                return;
            }
            console.log('[teckel] starting agent-level cost poll for agent_id=' + sessionAgentId
                        + ', session_start=' + sessionStart);
            // Slight delay so the ElevenLabs widget has time to mount.
            setTimeout(pollAgentCostOnce, 600);
            agentPollInterval = setInterval(pollAgentCostOnce, 5000);
            // Also start the final-cost poll. Slower cadence — this is
            // only useful once a conversation has ENDED and the webhook
            // has populated the row, which happens at session boundaries.
            setTimeout(pollFinalCostOnce, 2000);
            setInterval(pollFinalCostOnce, 15000);
        }

        // -----------------------------------------------------------------
        // FINAL-COST poll (20 May 2026, v2.2.61 endpoint) — populates
        // the "Last session total" block when a conversation has ended
        // and Yusuf's post-conversation webhook has written the three
        // cost columns to agent_conversations.
        // -----------------------------------------------------------------
        // The final cost only APPEARS once the conversation has ended, i.e. exactly when
        // the idle watchdog has tripped — so this one cannot simply stop when idle or it
        // would never land. It keeps asking for a grace window after the last activity,
        // then gives up: enough for Yusuf's post-call webhook to write the row, without
        // polling a finished session forever.
        var FINAL_COST_GRACE_MS = 5 * 60 * 1000;
        function pollFinalCostOnce() {
            if (!sessionAgentId) return;
            if ((Date.now() - lastActivityAt) > (IDLE_STOP_MS + FINAL_COST_GRACE_MS)) return;
            var url = MCP_BASE
                    + '/document_analyser/render_session_final_cost'
                    + '?agent_id=' + encodeURIComponent(sessionAgentId);
            fetch(url, { method: 'GET', credentials: 'omit' })
                .then(function (resp) {
                    if (!resp.ok) {
                        console.warn('[teckel] final-cost poll non-OK', resp.status);
                        return null;
                    }
                    return resp.json();
                })
                .then(function (data) {
                    if (!data) return;
                    setFinalCostBlock(data);
                })
                .catch(function (e) {
                    console.warn('[teckel] final-cost poll failed', e);
                });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startAgentCostPoll);
        } else {
            startAgentCostPoll();
        }

        // -----------------------------------------------------------------
        // 2. PER-INSTANCE rolling-token poll (v2.2.47, retained) — used
        //    SOLELY for iframe self-heal on token expiry. Does not
        //    update the visible meter; that comes from the agent-level
        //    poll above.
        // -----------------------------------------------------------------

        var costPollInterval = null;
        var currentCostUrl   = null;
        var rollingPdfUrl    = null;
        var rollingCostUrl   = null;

        function pollInstanceCostOnce() {
            if (!currentCostUrl) return;

        // -----------------------------------------------------------------
        // 2b. LIVE FORM REFRESH (2 Aug 2026 — 1 Aug live-drive finding):

        //     could not see a saved signature until the agent re-issued

        //     on every fetch, so a gentle reload while a FORM is on screen
        //     keeps the panel honest. 20s cadence, visible tab only,

        //     mid drag-drop would eat the user's file). The cache-buster

        var FORM_REFRESH_CAP = 30 * 60 * 1000;
        var currentFormView  = { url: null, shownAt: 0 };

        // IDLE WATCHDOG (Steven, 3 Aug 2026) — "if the conversation ends, you don't need
        // to continuously refresh the form on the screen."
        //
        // He is right, and the waste was real: this loop re-fetched a signed PDF from the
        // server every 20 seconds for up to THIRTY MINUTES after the call ended, on every
        // open tab. The refresh exists only so the on-screen form keeps up with what the
        // agent is writing — once nobody is writing, every fetch is pure server load.
        //
        // The widget gives the page no end-of-call event, so rather than reach into its
        // shadow DOM (which changes when ElevenLabs ship a new widget) we watch ACTIVITY,
        // which we already observe first-hand: a new call, any client tool firing, or the
        // cost meter moving. No activity for IDLE_STOP_MS and the polls go quiet.

        // sign of life resumes them with no re-arming logic to get wrong.

        // ── 19 Oct 2026 — PHONES: draw the PDF with PDF.js (see .pdf-mobile-host). Desktop: the frame, exactly as before.

        var MOBILE_PDF = (function () {
            try {
                var q = (location.search.match(/[?&]pdfjs=([01])/) || [])[1];
                if (q) return q === '1';

                    || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent))
                    || navigator.pdfViewerEnabled === false;

        })();
        var PDFJS_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
        var pdfjsReady = null, pdfHost = null, pdfRenderSeq = 0;
        function ensurePdfjs() {
            if (pdfjsReady) return pdfjsReady;
            pdfjsReady = new Promise(function (res, rej) {
                var s = document.createElement('script');
                s.src = PDFJS_BASE + 'pdf.min.js';
                s.onload = function () {
                    try {
                        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + 'pdf.worker.min.js';
                        res(window.pdfjsLib);
                    } catch (e) { pdfjsReady = null; rej(e); }

        }

            if (pdfHost) return pdfHost;
            var shell = document.querySelector('.form-viewer-shell');
            if (!shell) return null;

            pdfHost.className = 'pdf-mobile-host';
            shell.appendChild(pdfHost);

        }
        // Resolves with the page count once EVERY page is drawn; rejects if it could not be drawn. A newer call
        // supersedes an older one, and a redraw keeps the reader's scroll position.
        function renderPdfMobile(url) {
            var seq = ++pdfRenderSeq;
            var host = getPdfHost();
            if (!host) return Promise.reject(new Error('no form-viewer shell on page'));
            var keepScroll = host.classList.contains('shown') ? host.scrollTop : 0;
            return ensurePdfjs().then(function (lib) {
                return lib.getDocument({ url: url }).promise;
            }).then(function (doc) {
                var width = Math.max(200, (host.parentNode.clientWidth || 320) - 8);
                var dpr = Math.min(window.devicePixelRatio || 1, 2);
                var canvases = [];
                var chain = Promise.resolve();
                for (var i = 1; i \x3c= doc.numPages; i++) {
                    chain = chain.then((function (n) {
                        return function () {
                            return doc.getPage(n).then(function (page) {
                                var base = page.getViewport({ scale: 1 });
                                var vp = page.getViewport({ scale: (width / base.width) * dpr });

                                c.width = Math.floor(vp.width);
                                c.height = Math.floor(vp.height);
                                c.style.width = Math.floor(vp.width / dpr) + 'px';
                                c.style.height = Math.floor(vp.height / dpr) + 'px';

                    if (seq !== pdfRenderSeq) return doc.numPages;      // superseded by a newer view

                    host.scrollTop = keepScroll;
                    return doc.numPages;

        function showPdfUrl(iframe, url) {

        // A PAGE (upload, settings, directory, guidance): always the frame, so hide any drawn form first.

                + 'html,body{margin:0;height:100%;font-family:system-ui,sans-serif;'

        function bustCache(url) {

        // on being shown it: a refresh should be something the user asks for, not
        // something that happens to them.
        //
        // Manual-only would be worse in the one workflow this product is built for. This
        // is a HANDS-FREE voice fill: a fifteen-field checklist would mean fifteen clicks,

        // screen. Fails VISIBLE-OFF: anything that is not a form hides it.
        // -----------------------------------------------------------------

        // ElevenLabs custom client tool: display_form
        // Args (v2.2.55 + cost-fix 9 May 2026):
        //   view_session_id — short opaque id (~11 chars) returned by
        //                     request_form_view. The browser fetches
        //                     /document_analyser/resolve_view_session
        //                     to retrieve the actual signed pdf_url +
        //                     cost_url, then sets iframe.src and
        //                     starts the rolling-token poll.
        //
        // Why this is a single-arg tool now:
        //   Phase 16 telemetry on 9 May 2026 (record_id 5) caught
        //   Benedict mangling the base64 payload of the original
        //   signed pdf_url in transit between request_form_view and
        //   display_form ("AUTOCLAVE_LOG_FAILED_CYCLES" became
        //   "AUTOCLAVE_LOG_LAVE_FAILED_CYCLES" inside the JWT-style
        //   payload; signature kept unchanged → HMAC verification
        //   failed three retries in a row, no recovery possible).
        //   The architectural fix is to keep long opaque strings out
        //   of LLM-handled payloads entirely. Now the agent only ever
        //   handles the 11-char view_session_id, which it copies
        //   faithfully because there's nothing semantically guessable
        //   to "smarten up". The signed URLs travel browser->server
        //   only and never reach the LLM.
        //
        // Why this is now async (returns Promise) + debounced:
        //   Record 7 telemetry showed Benedict double-firing
        //   display_form for the same view_session_id (cycle 1: same
        //   second; cycle 2: 8 seconds apart with no user trigger).
        //   ElevenLabs charges per tool call. The tool registration
        //   now has expects_response:true + response_timeout_secs:10
        //   so the LLM waits for our return value before continuing —
        //   gives it a clear "already done" signal that prevents
        //   re-firing. Plus a same-id debounce here so a redundant
        //   call short-circuits without re-fetching / re-loading the
        //   iframe even if the LLM does try.
        var lastDisplayFormBy = {};   // map: view_session_id -> { result, timestamp }
        var DISPLAY_FORM_DEBOUNCE_MS = 30 * 1000;   // 30s

        function displayFormImpl(args) {
            markActivity();   // a tool fired: the conversation is live
            console.log('[teckel] display_form called with args:', args);
            args = args || {};
            var iframe      = document.getElementById('form-viewer');
            var placeholder = document.getElementById('form-viewer-placeholder');

            var viewSessionId = (args.view_session_id || '').toString().trim();
            if (!viewSessionId) {
                console.warn('[teckel] display_form called with NO view_session_id — Benedict likely skipped request_form_view.');
                showFabricationCard(
                    'display_form was called without a view session id.',
                    '(no view_session_id provided)'
                );
                return Promise.resolve(
                    'display_form failed: no view_session_id provided. Ask the user to retry.'
                );
            }

            // Sanity check the id shape — should be 8-32 URL-safe
            // base64 chars (server emits 11). Reject obvious
            // fabrications like "abc" or full URLs.
            var idLooksValid = /^[A-Za-z0-9_-]{8,32}$/.test(viewSessionId);
            if (!idLooksValid) {
                console.error('[teckel] REFUSED — view_session_id has wrong shape:', viewSessionId);
                showFabricationCard(
                    'The view session id did not look like one minted by request_form_view.',
                    viewSessionId
                );
                return Promise.resolve(
                    'display_form failed: view_session_id "' + viewSessionId
                    + '" failed shape check. Mint a fresh one via request_form_view.'
                );
            }

            // displayed within the last DISPLAY_FORM_DEBOUNCE_MS, return
            // the cached result instead of re-fetching + re-loading the
            // iframe. Belt-and-braces against intra-turn double-fire
            // and inter-turn re-confirmation.
            var prior = lastDisplayFormBy[viewSessionId];
            var nowMs = Date.now();
            if (prior && (nowMs - prior.timestamp) \x3c DISPLAY_FORM_DEBOUNCE_MS) {
                console.log('[teckel] display_form deduped — same view_session_id within debounce window:', viewSessionId);
                return Promise.resolve(
                    'display_form already completed for view_session_id=' + viewSessionId
                    + '. The iframe is loaded with this form. Do NOT call display_form again with this same id; '
                    + 'if the user wants to refresh, call request_form_view to mint a new id first.'
                );
            }

            var resolveUrl = MCP_BASE.replace(/\\/$/, '')
                + '/document_analyser/resolve_view_session?id='
                + encodeURIComponent(viewSessionId);

            console.log('[teckel] resolving view_session_id at:', resolveUrl);

            return fetch(resolveUrl, { method: 'GET', credentials: 'omit' })
                .then(function (resp) {
                    if (!resp.ok) {
                        return resp.text().then(function (txt) {
                            throw new Error('resolve failed: status=' + resp.status + ' body=' + txt);
                        });
                    }
                    return resp.json();
                })
                .then(function (data) {
                    if (!data || !data.success) {
                        throw new Error('resolve returned non-success: ' + JSON.stringify(data));
                    }
                    var pdfUrl  = data.pdf_url;
                    var costUrl = data.cost_url;
                    // v2.2.235 (C7) — the search index rides the resolve payload. It is
                    // names and status only; see the server note on resolve_view_session.
                    if (data.forms_index && data.forms_index.length) {
                        setFormsIndex(data.forms_index);
                    }

                    // Chain-of-custody — server should only ever
                    // emit URLs on its own host, but we still
                    // validate (defence in depth, no overhead).
                    if (pdfUrl && !isValidTeckelUrl(pdfUrl)) {
                        console.error('[teckel] REFUSED — resolved pdf_url is not a valid teckel URL:', pdfUrl);
                        showFabricationCard(
                            'The resolved pdf URL did not come from the teckel server.',
                            pdfUrl
                        );
                        return 'display_form failed: resolved pdf URL did not come from the teckel server.';
                    }
                    if (costUrl && !isValidTeckelUrl(costUrl)) {
                        console.error('[teckel] REFUSED — resolved cost_url is not a valid teckel URL:', costUrl);
                        showFabricationCard(
                            'The resolved cost-meter URL did not come from the teckel server.',
                            costUrl
                        );
                        return 'display_form failed: resolved cost URL did not come from the teckel server.';
                    }

                    // Wire iframe load + cost poll. Return a Promise
                    // that resolves once the iframe has loaded (or a
                    // safety timeout fires) so the LLM gets clear
                    // "done" feedback before continuing.
                    return new Promise(function (resolveOuter) {
                        var alreadyResolved = false;
                        function finishOnce(msg) {
                            if (alreadyResolved) return;
                            alreadyResolved = true;
                            // Cache only after success — failed loads
                            // shouldn't suppress retries.
                            // LOCAL V2: the comment above was not what the code did — every outcome was
                            // cached, failures included. Now only a completed display is.
                            if (/^display_form completed/.test(msg)) {
                                lastDisplayFormBy[viewSessionId] = {
                                    result: msg,
                                    timestamp: Date.now()
                                };
                            }
                            resolveOuter(msg);
                        }

                        if (pdfUrl) {
                            console.log('[teckel] setting iframe.src to:', pdfUrl);
                            if (iframe) {
                                iframe.removeAttribute('srcdoc');   // clear any prior fabrication card
                                if (MOBILE_PDF) {
                                    // 19 Oct 2026: a phone cannot show a PDF in the frame, and the frame's 'load'
                                    // fired anyway ("iframe loaded" while the user saw an Open button). Report what
                                    // was DRAWN, or that it could not be.
                                    // LOCAL V2 (20 Oct): two gaps closed. (1) An outcome that lands AFTER the 5 s
                                    // answer ("still being drawn") used to go nowhere; it now goes to the voice chain
                                    // as a follow-up (teckelLocalFollowup), and a late success is cached like any
                                    // other. (2) A failure is SHOWN: an honest "this screen could not load the form"
                                    // card, instead of a blank frame behind a hidden placeholder.
                                    var phoneOutcome = function (msg, ok) {
                                        if (!alreadyResolved) { finishOnce(msg); return; }
                                        if (ok) {
                                            lastDisplayFormBy[viewSessionId] = { result: msg, timestamp: Date.now() };
                                        }
                                        try {

                                            + ', the form is drawn on the screen (' + n + ' page' + (n === 1 ? '' : 's')
                                            + '), cost-poll started. Do NOT call display_form again with this same id.', true);
                                    }).catch(function (e) {
                                        console.warn('[teckel] form could not be drawn:', e);
                                        showScreenFailCard('The form could not be drawn on this screen.');
                                        phoneOutcome('display_form failed: the form could not be shown on this screen. '
                                            + 'Tell the user, and read the questions aloud instead.', false);
                                    });
                                } else {
                                    iframe.src = pdfUrl;
                                }
                                // arm the live-refresh loop (2b) for THIS form view.
                                //
                                // NOT for an uploaded DOCUMENT (view_mode 'evidence',
                                // v2.2.226). The refresher exists because a FORM being
                                // filled in must re-render as answers land; a stored
                                // certificate never changes, and re-setting iframe.src
                                // reloads the PDF and throws the reader back to page 1.
                                // Live report (Steven, 2 Aug): "it autoscrolls to the
                                // top of the document after every refresh — this does
                                // not work when you are reading a document." Same
                                // exemption the upload and settings pages already take.
                                if ((data.view_mode || '') === 'evidence') {
                                    setFormView({ url: null, shownAt: 0 });
                                } else {
                                    setFormView({ url: pdfUrl, shownAt: Date.now() });
                                }
                                if (!MOBILE_PDF) iframe.addEventListener('load', function () {
                                    console.log('[teckel] iframe loaded successfully');
                                    finishOnce(
                                        'display_form completed: view_session_id=' + viewSessionId
                                        + ', iframe loaded, cost-poll started. Do NOT call display_form again with this same id.'
                                    );
                                }, { once: true });
                                iframe.addEventListener('error', function (e) {
                                    console.error('[teckel] iframe load error:', e);
                                    finishOnce(
                                        'display_form: iframe load error for view_session_id='
                                        + viewSessionId + '. Ask the user to retry.'
                                    );
                                }, { once: true });
                            } else {
                                console.error('[teckel] no element with id="form-viewer" found on page');
                                finishOnce('display_form failed: no form-viewer element on page.');
                                return;
                            }
                            if (placeholder) placeholder.classList.add('hidden');
                        } else {
                            finishOnce(
                                'display_form: no pdf_url to load (cost-only refresh). '
                                + 'Cost poll started.'
                            );
                        }

                        if (costUrl) {
                            console.log('[teckel] starting per-instance rolling-token poll at:', costUrl);
                            startInstanceCostPoll(costUrl);
                        }

                        // Safety timeout — if iframe load never fires
                        // (some networks / iframe quirks), resolve at
                        // 5s so the LLM doesn't hit its 10s timeout.
                        setTimeout(function () {
                            // 19 Oct 2026: on a phone, never claim the form is shown before it is DRAWN.
                            finishOnce(MOBILE_PDF
                                ? ('display_form: view_session_id=' + viewSessionId + ' is still being drawn on the '
                                   + 'screen; cost-poll started. Do NOT call display_form again with this same id, and do '
                                   + 'not tell the user it is on screen until they say they can see it.')
                                : ('display_form completed: view_session_id=' + viewSessionId
                                   + ', iframe load event timed out at 5s but src is set; cost-poll started. '
                                   + 'Do NOT call display_form again with this same id.')
                            );
                        }, 5000);
                    });
                })
                .catch(function (e) {
                    console.error('[teckel] display_form resolve failed:', e);
                    showFabricationCard(
                        'The form viewer link could not be resolved. The voice agent may need to re-open the form.',
                        String(e && e.message || e)
                    );
                    return 'display_form failed: ' + String(e && e.message || e)
                        + '. Ask the user to retry; you may need to call request_form_view again.';
                });
        }

        // ElevenLabs custom client tool: display_upload_link (Phase 4a, 21 Jul 2026)
        // Loads the practice's evidence-upload page in the form iframe so they can drag a

        var UPLOAD_LINK_DEBOUNCE_MS = 30 * 1000;

  /* ── audio out ───────────────────────────────────────────────────────────────────────── */
  function ensureOut(){
    if (!outCtx) {

         default output context plays SILENCE; a PLAYBACK latency hint makes it audible (+9 ms base latency, output only —
         this is the playback context, not the microphone's). A browser that rejects the hint gets the old context. */
      try { outCtx = new C({ latencyHint: "playback" }); } catch (e) { outCtx = new C(); }
    }

  //   user gesture; the test portal created its contexts on the first audio frame and in onopen,
  //   both outside one, with no resume().
  function unlockAudio(){
    const c = ensureOut(); if (!c) return;
    try { if (c.state !== "running") c.resume(); } catch(e) {}

    } catch(e) {}
  }

    const c = ensureOut(); if (!c) return;
    const n = bytes.length >> 1; if (!n) return;
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const buf = c.createBuffer(1, n, rate); const ch = buf.getChannelData(0);
    for (let k = 0; k \x3c n; k++) ch[k] = dv.getInt16(k * 2, true) / 32768;
    const src = c.createBufferSource(); src.buffer = buf; src.connect(c.destination);
    const now = c.currentTime; if (playHead \x3c now) playHead = now + 0.02;
    src.onended = function () { const i = sources.indexOf(src); if (i !== -1) sources.splice(i, 1); };
    src.start(playHead); playHead += buf.duration; sources.push(src);

  // tap stays suspended on iOS and Benedict would go silent after the first barge-in.
  function flushPlayback(){

    sources = []; playHead = 0;
    heldAudio = []; clearTimeout(holdTimer); holdTimer = null;   /* « THE FIRST WORDS »: what was held is queued audio too */
  }

  /* ══ THE FIRST WORDS (24 Oct 2026, phase 1; tcc's runs 13/18/40, F-FG) ══════════════════════════════════════════════════
     When the microphone opens, an Android phone switches to MODE_IN_COMMUNICATION and re-routes its output for about 1.5 s
     (tcc measured +0.0 / +0.34 / +0.62 / +1.47 s) — whatever plays then is lost, so the greeting's first words were lost on
     every new conversation. So THE SESSION'S FIRST AUDIO, whatever produced it (the greeting, a walk_step's say, anything),
     plays only once the microphone has been open FIRST_AUDIO_HOLD_MS. Every frame that arrives meanwhile waits behind it, in
     order — NOTHING IS DROPPED — and plays back to back on release. After that, audio plays as it arrives.
       · no microphone (refused, or none): nothing to wait for — released at once;
       · the microphone still being asked for: held, but never longer than FIRST_AUDIO_HOLD_CAP_MS from its arrival;
       · a new conversation holds its own first audio afresh; an interruption drops what was held (queued audio, as before).
     No protocol change and nothing for kev to do: the page only decides WHEN the first frames start. */
  const FIRST_AUDIO_HOLD_MS = 1600;      /* the microphone open at least this long before the first sound */
  const FIRST_AUDIO_HOLD_CAP_MS = 8000;  /* … but the first sound never waits longer than this for a microphone */
  let firstHeard = false;                /* this conversation's first audio has been let through */
  let heldAudio = [];                    /* [bytes, rate] waiting for it, in arrival order */
  let holdTimer = null, holdSince = 0;
  let lastBotAudioAt = 0;                /* (« END THE CONVERSATION ») performance.now() of kev's latest audio frame */
  let micOpenAt = 0;                     /* performance.now() when this conversation's microphone stream opened; 0: not yet */
  let micNone = false;                   /* this conversation's microphone attempt ended without one */
  function holdReset(){
    clearTimeout(holdTimer); holdTimer = null;
    firstHeard = false; heldAudio = []; holdSince = 0; micOpenAt = 0; micNone = false;
  }
  function holdLeft(){
    if (micNone) return 0;
    const cap = holdSince + FIRST_AUDIO_HOLD_CAP_MS - performance.now();
    return Math.max(0, micOpenAt ? Math.min(cap, micOpenAt + FIRST_AUDIO_HOLD_MS - performance.now()) : cap);

    lastBotAudioAt = performance.now();

  /* ── microphone ──────────────────────────────────────────────────────────────────────── */
  const WORKLET=\`
  class Cap extends AudioWorkletProcessor{
    constructor(o){super();this.t=o.processorOptions.target;this.f=o.processorOptions.frame;
      this.r=sampleRate/this.t;this.acc=[];}
    process(inputs){const ch=inputs[0]&&inputs[0][0];if(!ch)return true;
      for(let i=0;i\x3cch.length;i++)this.acc.push(ch[i]);
      const need=Math.ceil(this.f*this.r)+2;
      while(this.acc.length>=need){const out=new Int16Array(this.f);
        for(let k=0;k\x3cthis.f;k++){const x=k*this.r,i0=Math.floor(x),fr=x-i0;
          const a=this.acc[i0]||0,b=this.acc[i0+1]||0;let v=a+(b-a)*fr;
          v=Math.max(-1,Math.min(1,v));out[k]=v\x3c0?v*0x8000:v*0x7fff;}

       155) the 16 kHz capture context stayed SUSPENDED for the whole conversation — "Connected · listening", the mic dot
       lit, and Benedict heard nothing — because its only effective resume came after an await (getUserMedia), outside the
       user's gesture; resumed inside a gesture it ran at once. So, exactly as unlockAudio() does for the output:
         · prepareMicCtx() — called SYNCHRONOUSLY inside the Start / Verify click, before any await — creates the context,
           resumes it and starts a silent sound on it;
         · after the microphone opens, a resume is only TRIED (never waited on: outside a gesture a browser may leave it
           pending for ever);
         · still not running: the panel says so, with ONE button that resumes it inside its own tap — and so does any tap
           or key on the page (resumeMicInGesture), so the next touch anywhere brings the microphone back. */
  const MIC_RESUME_WAIT_MS = 300;
  let micPausedShown = false;            /* the "microphone is paused" notice is ours, on screen */

    try { if (c.state !== "running") c.resume(); } catch(e) {}
    try {
      const b = c.createBuffer(1, 1, c.sampleRate || 16000), s = c.createBufferSource();

  function watchMicCtx(c){

    try { c.addEventListener("statechange", function () { if (c === micCtx) micStateChanged(); }); } catch(e) {}
  }
  function tryResume(c){                   /* a resume() that never waits for ever */
    if (!c || c.state === "running") return Promise.resolve();
    let p;
    try { p = c.resume(); } catch(e) { return Promise.resolve(); }
    return Promise.race([Promise.resolve(p).catch(function () {}),
                         new Promise(function (r) { setTimeout(r, MIC_RESUME_WAIT_MS); })]);
  }
  function micStateChanged(){
    if (!micCtx || !micStream) return;
    if (micCtx.state === "running") {
      if (micPausedShown) { micPausedShown = false; hideNotice(); log("the microphone is running again"); }
      if (isOpen()) applyMute();
      return;
    }
    if (micCtx.state === "closed" || micPausedShown) return;
    micPausedShown = true;
    log("the microphone's audio context is " + micCtx.state + " — it waits for a tap");

  // ⚠ ONLY EVER CALLED INSIDE A TAP, A CLICK OR A KEY: synchronous, before anything is awaited.
  function resumeMicInGesture(){

  /* ══ MUTE (25 Oct 2026, Yusuf: "A 'mic off' button: Benedict listens by default, and you tap to mute it … LABEL IT
        'MUTE' PERHAPS?" — TASKS_AND_DECISIONS.md; not push-to-talk) ═══════════════════════════════════════════════════════

       Safari on iOS have differed (a disabled capture track may give zeros, may stop feeding the source node so no frame

       sound still reaches this page while muted, and is dropped here: nothing of it leaves the page.

       re-send — the screen_form lesson: a session must never look unmuted to kev when it is not). A change before
       client_ready is not sent on its own: the opening run carries the state as it is then. kev ignores a kind it does
       not know, so this is inert until kev uses it.
     · On screen: every Mute control ([data-lv-mute]: the voice panel's, and the copy beside Voice on / off on the live
       form and the walk panel) reads "Unmute" with aria-pressed="true", and the voice panel shows MUTE_SAYS (text only).

  function muteControls(){

    });

  function lvBsid(){
