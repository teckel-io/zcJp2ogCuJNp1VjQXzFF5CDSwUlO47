\x3cscript>
"use strict";
(function () {
  const P = window.teckelPortal;
  const $ = (id) => document.getElementById(id);
  const w = { btn: $("pp-walk-btn"), panel: $("pp-walk"), title: $("pp-walk-title"), step: $("pp-walk-step"),
              body: $("pp-walk-body"), msg: $("pp-walk-msg"), voice: $("pp-walk-voice"), stop: $("pp-walk-stop") };
  if (!P || !w.btn || !w.panel || !w.body) return;   /* no door on this page */
  const LAPSE = P.lapseCodes;
  const WALK_OFF = ["UNKNOWN_ACTION", "PORTAL_OFF"];
  const WALK_SOON = "Walking the form — coming soon";
  const WALK_HINT = { date: "dd/mm/yyyy or 'today'", time: "hh:mm", datetime: "dd/mm/yyyy hh:mm" };
  const MAX_VALUE = 2000;
  // the server's FORMAT floors (teckel__r419_walk_v1_0.py FORMAT_FLOORS): only these may be saved as typed
  const FORMAT_FLOORS = Object.freeze(["date", "time", "identifier", "number_box"]);
  // which check refused, said beside the reason (a policy lock's own line already says why, so it gets no suffix)
  const FLOOR_SAID = Object.freeze({ date: "the date check", time: "the time check", identifier: "the specific-answer check",
    number_box: "the number check", option: "the list of answers", blank_words: "the blank-answer rule",
    kev_type_precheck: "Benedict's own check", unclassified: "a check" });
  // ⛔ THE VOICE ALLOWLIST — the ONLY ops a conversation may drive on this page. Destructive and outward actions (discard,
  //    remove, evidence_remove / detach, log_entry_remove, a custom question's removal, resend, the status report) are
  //    NOT here and never will be by voice: they stay click-only.
  //    (2.2.420) "edit" and "walk" open the Edit panel / start the walk on the form on screen — each only while that form is
  //    editable (Walk: a question form) and the server says page_features.voice_edit_walk; ignored otherwise.
  const VOICE_OPS = Object.freeze(["submit", "sign", "upload", "skip", "back", "stop", "again", "quiet", "speak", "edit", "walk"]);
  const ADVANCE_MS = 900;          /* a saved value stays on screen this long before the next question */
  const COUNTDOWN_MS = 3000;       /* a VOICE submit can be cancelled for this long */
  const SIGN_PAGE = { test: (u) => typeof window.teckelPageLink === "function" && window.teckelPageLink(u, /^\\/[^?#\\s]*sign\\.html\\?\\S+$/) };   /* F-HA: any trusted origin */
  let off = false;
  let speak = true;                /* Voice on / off: the mode; "again" never changes it */
  let walk = null;                 /* the walk: { iid, name, list, i, mode: "q" | "act" | "done", seq, … } — new each time */
  let last = null;                 /* the last envelope sent: { step, payload, say } (speak is the mode's, or true once) */
  let opening = false;

  function codeOf(r){ return String((r && r.error_code) || "").trim().toUpperCase(); }
  function lapsed(r){ const c = codeOf(r); return LAPSE.indexOf(c) !== -1 || c === "NO_PASS"; }
  function msgOf(r, fallback){ const m = (r && typeof r.message === "string") ? r.message.trim() : ""; return m || fallback; }
  // (2.2.432, G4) a reason or a code from kev, in PLAIN WORDS: the transport's ONE map (teckelReasonWords); never the code
  function words(list, fallback, unknown){
    try { if (typeof window.teckelReasonWords === "function") return window.teckelReasonWords(list, fallback, unknown); }
    catch(e) {}
    return String(fallback || "That wasn't saved.");
  }
  function txt(el, s){ if (el) el.textContent = (s === undefined || s === null) ? "" : String(s); }
  function shown(v){ return v !== undefined && v !== null && String(v).trim() !== ""; }
  function el(tag, cls, text){
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = String(text);
    return e;
  }
  function button(label, cls, fn){
    const b = el("button", "lv-btn" + (cls ? " " + cls : ""), label);
    b.type = "button";
    b.addEventListener("click", fn);
    return b;
  }
  function usable(b){ return !!(b && b.isConnected && !b.hidden && !b.disabled && !b.hasAttribute("data-pp-lock")); }

  /* ══ (24 Oct 2026; Yusuf: "yes please" (F-FK) and "YES 1 AND 3"; server 2.2.420) ══════════════════════════════════════
     · NEVER A SILENT DEAD END (page_features.walk_says_why): a step that cannot reach the conversation says why on the
       panel — "Benedict isn't connected — start the conversation, then press Walk." (no conversation open) or "Benedict
       didn't get this question …" (open, but refused) — and a walk the form leaving the viewer ended says so instead of
       the panel just closing. The walk itself (typing) carries on either way.
     · A FOLLOW-UP BOX THAT DOES NOT APPLY IS NOT WALKED (server R420_FOLLOWUP_BOXES): form_fields marks such a box
       active:false, with depends_on (its item's number) and inactive_when (the item's answers that turn it off); the walk
       skips a box that is off now — also one an answer given DURING the walk turns off (the item's answer as saved here, or
       as the server gave it); an item left blank, or answered anything else, keeps the box (fail open). "Question n of m"
       counts the questions that apply.
     · A TYPED BOX SAVES WHEN IT IS LEFT (page_features.walk_saves_on_leave): Enter saves and moves on (as before); leaving
       the box — Tab, or a click elsewhere — with a CHANGED, non-empty value saves it; the button reads "Save & next" and a
       line under the box says "Press Enter, or Save & next". Never on blur: an unchanged or empty box, the value the
       server has just refused (it stays, with its reason), a box the walk has moved on from, or a press of the walk's own
       buttons (Save, Save as typed, Skip, Back, Stop, Voice, Walk — each does its own thing; Skip never saves). */
  function features(){
    try { return (typeof window.teckelPageFeatures === "function") ? window.teckelPageFeatures() : null; }
    catch(e) { return null; }
  }
  function feature(name){ const f = features(); return !!(f && f[name] === true); }
  const SAYS_NO_SOCKET = "Benedict isn't connected — start the conversation, then press Walk. You can still type your answers here.";
  const SAYS_NOT_SENT = "Benedict didn't get this question — press Walk to try again, or type your answer.";
  const SAYS_LEFT = "The form is no longer on screen, so the walk stopped. Open it again to carry on.";
  // (phase 1, 24 Oct 2026; tcc's run 43) the spoken commands that WORK: a bare "skip", "back", "yes" or "stop" never reaches
  // the transcript, while these phrases do — the same line as the live form's
  const SAYS_SPOKEN = "To move on by voice, say “skip this one, please”, “go back, please” or “say that again, please”.";
  // a PRESS of any of the walk's own buttons: the box's blur saves nothing (the button does its own thing)
  // (25 Oct 2026, « MUTE ») the conversation's Mute beside Voice is one of these: muting is not leaving the question
  const NO_BLUR_SAVE = Object.freeze(["pp-walk-save", "pp-walk-typed", "pp-walk-skip", "pp-walk-back", "pp-walk-stop",
                                      "pp-walk-voice", "pp-walk-btn", "pp-walk-mute"]);
  // keyboard focus moving ONTO one of these (Tab): a skip, a step back or a stop — the blur saves nothing either; Tab onto
  // Save & next is leaving the box (saved), and Save & next then only moves on
  const TAB_NO_SAVE = Object.freeze(["pp-walk-skip", "pp-walk-back", "pp-walk-stop", "pp-walk-voice", "pp-walk-btn",
                                     "pp-walk-mute"]);
  let pressing = null;              /* one of the walk's own buttons being pressed: its blur saves nothing */
  function tellSent(ok){
    if (!feature("walk_says_why")) return;
    const m = w.msg ? w.msg.textContent : "";
    if (ok) { if (m === SAYS_NO_SOCKET || m === SAYS_NOT_SENT) txt(w.msg, ""); return; }
    let live = false;
    try { live = !!P.live(); } catch(e) { live = false; }
    txt(w.msg, live ? SAYS_NOT_SENT : SAYS_NO_SOCKET);
  }
  function norm(v){ return String(v === undefined || v === null ? "" : v).replace(/\\s+/g, " ").trim().replace(/\\.$/, "").trim().toLowerCase(); }
  function activeNow(mine, q){
    if (!q) return false;
    if (shown(q.depends_on) && Array.isArray(q.inactive_when)) {
      const v = norm((mine.known || {})[String(q.depends_on)]);
      if (!v) return true;                                  /* the item blank: the box applies (fail open) */

  /* ══ WHICH COPY IS ON SCREEN — the same one Edit is offered for ══════════════════════════════════════════════════ */
  function copyOnScreen(){

  }
  function syncBtn(){

  /* ══ THE ONE ENVELOPE — every step leaves through send(); its properties are handled here, once ════════════════════ */
  function send(step, payload, say, forceSpeak){
    if (!walk) return false;
    last = { step: step, payload: payload, say: say }; walk.sentAny = true;
    const ok = sendLast(forceSpeak === true);

    return ok;
  }

  }

  function setVoice(on, tell){

  /* ══ OPEN: form_fields ═════════════════════════════════════════════════════════════════════════════════════════ */
  async function openWalk(){

    const mine = { iid: String(c.instance_id), name: shown(c.form_name) ? String(c.form_name) : "", list: [], i: 0,

    walk = mine;
    w.body.textContent = ""; txt(w.title, mine.name); txt(w.step, ""); txt(w.msg, "Loading the questions…");
    w.panel.hidden = false; w.btn.setAttribute("aria-expanded", "true");
    opening = true;
    let r;
    try { r = await P.action("form_fields", { instance_id: mine.iid }); }
    finally { opening = false; }
    if (walk !== mine) return;
    if (WALK_OFF.indexOf(codeOf(r)) !== -1) { setOff(); return; }
    if (lapsed(r)) { endWalk("lapse", true); return; }
    if (!r || r.success !== true) { txt(w.msg, msgOf(r, "This form could not be opened for the walk just now.")); return; }
    if (shown(r.title)) { mine.name = String(r.title); txt(w.title, r.title); }

    }

      return q && typeof q === "object" && shown(q.number) && q.personal !== true && !shown(q.answer);
    });

    r.questions.forEach(function (q) { if (q && typeof q === "object" && shown(q.number)) mine.known[String(q.number)] = q.answer; });
    txt(w.msg, "");
    const first = seek(mine, 0, 1);

  /* ══ ONE QUESTION ══════════════════════════════════════════════════════════════════════════════════════════════════ */
  function pickOption(options, value){

      ctl.appendChild(el("option", "", "-- Select --")); ctl.options[0].value = "";   /* (phase 1, Yusuf F-FX) */
      q.options.forEach(function (o) { const op = el("option", "", o); op.value = String(o); ctl.appendChild(op); });
      ctl.value = pickOption(q.options, value);

    const q = mine.list[mine.i];
    w.body.textContent = "";
    const applies = mine.list.filter(function (x) { return activeNow(mine, x); });   /* (2.2.420) the ones that apply */
    txt(w.step, "Question " + (applies.indexOf(q) + 1 || mine.i + 1) + " of " + (applies.length || mine.list.length));
    const qp = el("p", "pp-walk-q", String(q.number) + ". " + String(q.label || "")); qp.id = "pp-walk-q";
    w.body.appendChild(qp);
    const b = box(q, q.saved);
    const leave = b.ctl.tagName !== "SELECT" && feature("walk_saves_on_leave");      /* (2.2.420) saved when left */
    w.body.appendChild(b.ctl); if (b.hint) w.body.appendChild(b.hint);
    if (leave) { const hl = el("p", "pp-hint pp-walk-enter", "Press Enter, or Save & next"); hl.id = "pp-walk-enter"; w.body.appendChild(hl); }
    { const sp = el("p", "pp-hint pp-walk-say", SAYS_SPOKEN); sp.id = "pp-walk-say"; w.body.appendChild(sp); }   /* (phase 1) */
    const saved = el("p", "pp-walk-saved"); saved.id = "pp-walk-saved"; saved.setAttribute("role", "status");
    const why = el("p", "pp-walk-why"); why.id = "pp-walk-why"; why.setAttribute("role", "status");
    w.body.appendChild(saved); w.body.appendChild(why);
    const row = el("div", "pp-walk-row");
    const save = button(leave ? "Save & next" : "Save", "primary", function () { typed(false); }); save.id = "pp-walk-save";
    const asTyped = button("Save as typed", "", function () { typed(true); }); asTyped.id = "pp-walk-typed"; asTyped.hidden = true;
    const skip = button("Skip", "", function () { next(); }); skip.id = "pp-walk-skip";
    const back = button("Back", "", function () { back_(); }); back.id = "pp-walk-back";
    back.disabled = seek(mine, mine.i - 1, -1) === -1;
    [save, asTyped, skip, back].forEach(function (x) { row.appendChild(x); });
    w.body.appendChild(row);
    if (b.ctl.tagName === "SELECT") b.ctl.addEventListener("change", function () { typed(false); });
    else b.ctl.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); typed(false); } });
    if (leave) {
      const seq = mine.seq;
      [save, asTyped, skip, back].forEach(function (x) { x.addEventListener("pointerdown", function () { press(x.id); }); });

  }
  function press(id){ pressing = id; }
  function leftBox(mine, q, ctl, seq, e){
    const to = (e && e.relatedTarget && e.relatedTarget.id) || "";
    if (walk !== mine || current() !== q || mine.seq !== seq || mine.busy || off || !ctl.isConnected) return;  /* moved on */
    if (pressing && NO_BLUR_SAVE.indexOf(String(pressing)) !== -1) return;       /* a press of the walk's own buttons */
    if (to && TAB_NO_SAVE.indexOf(String(to)) !== -1) return;                     /* Tab onto Skip, Back, Stop … */

    if (!v.trim()) return;                                                         /* never an empty box */

  }
  function back_(){

  }
  function next(){
    if (!walk) return;

    if (j === -1) { actions(false); return; }

  }
  function refused(text, floor, overridable){

  }
  function savedThen(mine, value){

    txt($("pp-walk-why"), "");
    const t = $("pp-walk-typed"); if (t) t.hidden = true;

  // A TYPED answer (Enter, Save, a choice picked) — or, on an explicit click only, the same value "as typed"
  async function typed(override){
    const mine = walk, q = current();

    const ctl = $("pp-walk-box");
    const v = String(ctl ? ctl.value : "");
    if (!v.trim()) { refused(override ? "Type the answer in the box first." : "Type an answer, or press Skip.", null, false); return; }
    // (2.2.420) Save & next on a value already saved (left the box, so saved): it moves on, no second request

    const args = { instance_id: mine.iid, question_number: String(q.number), value: v };
    if (override === true) args.override = true;
    mine.busy = true;
    if (override !== true) mine.tried = v;                  /* (2.2.420) a refused value is not re-sent when the box is left */
    txt($("pp-walk-saved"), "Saving…");

    finally { mine.busy = false; }

    if (lapsed(r)) return;                                  /* the door closes the walk with the page */

  /* ══ THE ACTION STEPS: Sign (only while signatures are outstanding), Submit GREEN or RED, Upload ════════════════ */
  function actions(nothingLeft){
    if (!walk) return;
    const mine = walk;
    clearTimeout(mine.timer); mine.timer = null;
    mine.mode = "act"; mine.seq++;
    txt(w.step, nothingLeft ? "Every question has an answer" : "That was the last question");
    preview(false);
  }
  function blockedSay(r){
    return shown(r && r.say) ? String(r.say) : msgOf(r, (r && r.can_submit === true) ? "Ready to submit." : "It can't be submitted yet.");
  }
  async function preview(fromVoice){
    const mine = walk;
    if (!mine || mine.mode !== "act") return null;
    mine.busy = true;
    txt(w.msg, "Checking the form…");
    let r;
    try { r = await P.action("submit_preview", { instance_id: mine.iid }); }
    finally { mine.busy = false; }
    if (walk !== mine || mine.mode !== "act") return null;
    if (lapsed(r)) return null;
    if (!r || r.success !== true) { txt(w.msg, msgOf(r, "This form could not be checked just now.")); renderActions(); return null; }
    txt(w.msg, "");
    mine.pv = { can: r.can_submit === true, token: (r.can_submit === true && typeof r.confirm_token === "string") ? r.confirm_token : null,
                exp: Date.parse(String(r.confirm_expires_at || "")) || 0, to: String(r.to_address || "").trim(),
                say: blockedSay(r), sign: Array.isArray(r.blocked_by) && r.blocked_by.indexOf("SIGNATURES_OUTSTANDING") !== -1 };
    mine.step = mine.pv.sign ? "sign" : "submit";

    return mine.pv;
  }
  function renderActions(){
    const mine = walk;
    if (!mine) return;
    w.body.textContent = "";
    const pv = mine.pv;
    const row = el("div", "pp-walk-row");
    if (pv && pv.sign) {
      const sign = button("Sign", "pp-walk-hl", function () { doSign(false); }); sign.id = "pp-walk-sign";
      row.appendChild(sign);
    }
    const sub = button("Submit", pv && pv.can ? "pp-go" : "pp-stop", function () { onSubmitClick(); });
    sub.id = "pp-walk-submit";
    sub.setAttribute("aria-describedby", "pp-walk-reason");
    if (!pv) sub.disabled = true;
    if (pv && !pv.sign) sub.classList.add("pp-walk-hl");
    row.appendChild(sub);
    const again = button("Check again", "", function () { preview(false); }); again.id = "pp-walk-again";
    const up = button("Upload a document", "", function () { doUpload(); }); up.id = "pp-walk-upload";
    row.appendChild(again); row.appendChild(up);
    w.body.appendChild(row);
    const reason = el("p", "pp-walk-why", pv ? pv.say : ""); reason.id = "pp-walk-reason"; reason.setAttribute("role", "status");
    w.body.appendChild(reason);

    res.setAttribute("aria-live", "polite");
    w.body.appendChild(res);
  }
  function actionsBusy(on){

      const b = $(id); if (b) b.disabled = on;
    });
  }
  function onSubmitClick(){
    const mine = walk;

    doSubmit();                                                      /* GREEN: the click IS the confirmation */
  }
  async function doSubmit(){
    const mine = walk;

    if (!pv || !pv.can) return;
    if (!pv.token || (pv.exp && Date.now() > pv.exp - 5000)) {       /* the confirmation ran out: preview first */

    }

    pv.token = null;                                                 /* single use */

    finally { mine.busy = false; }
    if (walk !== mine) return;

    if (r && r.success === true && r.sent === true) {
      const to = String(r.to_address || pv.to || "").trim();
      try { if (typeof window.teckelScreenForm === "function") window.teckelScreenForm(mine.iid, mine.name, "submitted"); } catch(e) {}
      try { if (window.teckelPortalForms) window.teckelPortalForms.reload(); } catch(e) {}

  // A VOICE submit on GREEN: "Sending to \x3caddress>…" with Cancel for 3 seconds; Cancel sends nothing.

    });

      mine.countdown = null;

  // (2.2.433, G7) Sign: the signing page in this page's signing panel (window.teckelSignInPage, « SIGNING INSIDE THE PAGE »
  // in the portal controls) — a new tab in front dropped a phone's conversation. When the signing page says a signature
  // was saved, the form is checked again (submit_preview, the server's word) and, no signatures outstanding, the panel
  // closes and the Submit step goes as Check again sends it. The panel not available: a new tab inside the click, as
  // before; the panel cannot load the signing page: the tab now (by voice, a link).
  function signerOn(){

    catch(e) { return false; }
  }
  async function doSign(fromVoice){

  }
  // the fallback: the tab opened inside the click, or (now: the panel could not load, after a press) one opened now;
  // otherwise — by voice, or a browser that blocks it — a link
  function signFallback(url, tab, now){
    const res = $("pp-walk-result");

      catch(e) { /* fall through to the link */ }
    }

    try { opened = now === true && !!window.teckelSignInPage && window.teckelSignInPage.tab(url) === true; } catch(e) { opened = false; }

  // how: "auto" (the form arrived in the viewer) | "press" (the strip's Edit) | "kev" (kev's own "walk")
  async function openLive(c, how){
    const iid = String(c.instance_id);

    questions.forEach(function (q) {

  /* ══ A LOG: the NEW entry, save_log_entry; its saved entries listed read-only below. NO walk_step. ═════════════════ */
  function renderLog(me, r){

  function entriesLine(n){ return n === 1 ? "1 saved entry." : (n + " saved entries."); }
  function entryCursor(me, x, focus){

  function cellOf(vals, col){
    if (Object.prototype.hasOwnProperty.call(vals, col.key)) return vals[col.key];

  }
  function entryItem(me, vals, n){
    const li = el("li");

      const v = cellOf(vals || {}, col);
      dl.appendChild(el("dt", "", String(col.label || col.key)));

      dl.appendChild(el("dd", "", col.personal ? (shown(v) ? "Provided" : "Blank") : (shown(v) ? String(v) : "Blank")));

  async function loadEntries(me){

    if (!r || r.success !== true || !Array.isArray(r.entries)) { txt(en.count, msgOf(r, "The saved entries can't be listed here just now.")); return; }
    en.cols = (Array.isArray(r.columns) ? r.columns : []).filter(function (c) { return c && shown(c.key); })
      .map(function (c) { return { key: String(c.key), label: String(c.label || c.key), personal: c.is_pii === true || c.personal === true }; });

  async function saveEntry(me, blank){
    const en = me.entry;

    en.busy = true; en.blankB.hidden = true;
    en.boxes.forEach(function (x) { say(x.st, ""); });
    const values = {};
    en.boxes.forEach(function (x) { values[x.key] = String(x.ctl.value || ""); });
    const args = { instance_id: me.iid, values: values };
    if (blank === true) args.save_blank = true;
    txt(en.res, "Saving…");
    let r;
    try { r = await P.action("save_log_entry", args); }
    finally { en.busy = false; }
    if (lf !== me) return;
    if (TYPING_OFF.indexOf(codeOf(r)) !== -1) { liveOff = true; offKey = me.key; closeLive("off"); note(SAYS_SOON); return; }
    if (lapsed(r) || goneIf(me, r)) return;
    if (r && r.success === true) {
      en.n =(typeof r.entry_count === "number" && isFinite(r.entry_count)) ? r.entry_count : en.n + 1;

  }

  /* ══ (Phase 4, 2.2.427) EVERY FORM TYPE WALKABLE — the lanes (the brief's §1-§3; a reply's shape read only when present) ══ */
  function num0(v){ const n = Number(v); return (typeof v === "number" || (typeof v === "string" && v.trim() !== "")) && isFinite(n) && n >= 0 ? Math.floor(n) : 0; }
  function CV(){ const c = window.teckelConversation; return (c && typeof c.now === "function") ? c : null; }

  // the lane a form_fields reply names: lane equal to form_kind, one of the four; "" when it names none (today's server)
  function laneOf(r){
    const l = (r && typeof r.lane === "string") ? r.lane : "";

  }
  function laneRows(me){ return !!(me && me.lane && me.kind !== "consent"); }   /* the lanes with boxes of their own */
  // does this form walk here now: a question or consent form, a task grid; a log or a survey only in the conversation
  // its entry is bound to, while that conversation is the open one (its draft is kev's)
  function walksNow(me){
    if (!me) return false;
    if (me.kind === "qa" || me.kind === "consent") return true;
    if (me.kind === "grid") return me.lane === "grid";
    if ((me.kind === "log" || me.kind === "survey") && me.lane) { const C = CV(); return !!(me.cv && C && C.now() === me.cv); }
    return false;
  }
  function gridWalks(me, q){
    return String(q.column_key) === me.walkCol && q.future !== true && !(q.logged === true && q.mine === false);
  }
  // a question form's stored answers (question number -> answer), personal ones, signatures and signing questions omitted
  function valuesOut(me){
    const o = {};
    me.rows.forEach(function (x) { if (!x.personal && !x.sign && !x.signing && shown(x.saved)) o[x.num] = String(x.saved); });
    return o;
  }
  // the server's draft, as the server gave it (never built here), a personal field never in it
  function draftOut(me){
    const o = {};
    Object.keys(me.draft || {}).forEach(function (k) { const row = me.byNum[k]; if (row && !row.personal) o[k] = String(me.draft[k]); });
    return o;
  }
  // every send carries the answers as they stand NOW — "again" and Voice on re-send the same step, but a box filled by hand
  // since it first went is never under-reported (§7)
  function freshAnswers(me, p){
    if (!p || typeof p !== "object") return p;
    const has = function (k) { return Object.prototype.hasOwnProperty.call(p, k); };
    if (!has("values") && !has("draft_values")) return p;
    const out = Object.assign({}, p);
    if (has("values")) out.values = valuesOut(me);
    if (has("draft_values")) out.draft_values = me.kind === "grid" ? (me.gridDraft || out.draft_values) : draftOut(me);
    return out;
  }
  function stepKey(env){
    const p = Object.assign({}, env.payload || {});
    delete p.values; delete p.draft_values;
    return JSON.stringify(Object.assign({}, env, { payload: p }));
  }
  function laneAct(me, p){
    if (me.kind === "qa" && !QA_STEP_V2) return;
    p.lane = me.lane || (me.kind === "qa" ? "qa" : me.kind);
    if (me.kind === "qa" || me.kind === "consent") p.values = valuesOut(me);
  }
  function laneEnv(me, row){
    const q = row.q, opts = Array.isArray(q.options) ? q.options.map(String) : [];
    let say = typeof q.say === "string" ? q.say : "", payload;
    if (me.kind === "log") {
      payload = { lane: "log", field: row.num, label: String(q.label || ""), field_type: fieldType(q), options: opts };
      if (shown(q.unit)) payload.unit = String(q.unit);
      payload.entry_number = me.entryNo;
      payload.draft_values = draftOut(me);
    } else if (me.kind === "survey") {
      payload = { lane: "survey", number: row.num, field: row.num, label: String(q.label || ""), field_type: fieldType(q),
                  options: opts, respondent: me.entryNo, draft_values: draftOut(me) };
    } else if (row.initials) {
      const c = me.colsBy[row.col] || {};
      payload = { lane: "grid", field: row.num, row_key: "initials", column_key: row.col, date: String(c.date || ""),
                  label: String(q.label || ""), field_type: "text", options: [] };

    } else {
      payload = { lane: "grid", field: row.num, row_key: String(q.row_key === undefined ? "" : q.row_key),
                  column_key: String(q.column_key), date: String(q.date || ""), label: String(q.label || ""),
                  field_type: "option", options: opts.length ? opts : GRID_OPTIONS.slice() };

  }
  function rowEnv(me){

    p.blank = (me.blank || []).slice(0, 60);

  }
  function laneHead(me){
    if (!me || !me.lane || me.kind === "consent") return false;

  }
  function paintLane(me){

    else {

  /* ── the probe: a survey, a task grid, a consent form — the live form shows only once the server names the lane ── */
  async function probeLive(me){
    opening = me;

  }
  function dispatchLane(me, r){

  /* ── a log entry, a survey respondent: the boxes, bound to the conversation's own open entry when there is one ── */
  function renderEntry(me, r){
