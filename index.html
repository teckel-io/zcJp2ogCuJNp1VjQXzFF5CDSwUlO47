  function signInKey(){ return "lv_signin_" + (lvAgentId() || "unknown"); }
  function localDay(){
    const d = new Date(), p = function (n) { return (n \x3c 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function readSignIn(){
    let raw = null;
    try { raw = localStorage.getItem(signInKey()); } catch(e) { return null; }   /* no storage: a fresh id each load anyway */
    if (raw === null) return null;
    try { const r = JSON.parse(raw); return (r && typeof r === "object" && !Array.isArray(r)) ? r : {}; }
    catch(e) { return {}; }
  }
  function writeSignIn(rec){
    try { localStorage.setItem(signInKey(), JSON.stringify({ day: String(rec.day), last: Number(rec.last) })); return true; }
    catch(e) { return false; }
  }
  // THE ONE PLACE THIS BROWSER STOPS BEING VERIFIED: the id in localStorage is REPLACED with a fresh random one
  // and the record goes with it, so every later call carries an id the server has never verified and the next
  // visit asks for the code. Nothing is asked of the server: there is no revoke route (Yusuf CC, read from the
  // live apiGateway, 21 Oct 2026), so the old id is simply ABANDONED. The server keeps a browser verified for
  // 60 minutes after its LAST successful check, sliding, with no absolute cap: an abandoned id — like a tab
  // that was closed — is forgotten 60 minutes after the last check made with it, and this page makes none
  // after this line runs (a renewal, a reconnect and a reply still on its way are all stopped; see signOut).
  function bsidStorageKey(){ return "lv_bsid_" + (lvAgentId() || "unknown"); }
  function replaceBsid(){
    const key = bsidStorageKey();
    try { localStorage.removeItem(signInKey()); } catch(e) {}
    try { localStorage.setItem(key, crypto.randomUUID()); }
    catch(e) { try { localStorage.removeItem(key); } catch(e2) {} }   /* then lvBsid() makes a fresh one */
  }

  function authUI(show, msg){
    const r = $("lv-auth-row"); if (r) r.style.display = show ? "" : "none";
    // The 15-minute hint rides WITH the row, so expiry is stated before the first failure.
    const h = $("lv-auth-hint"); if (h) h.style.display = show ? "" : "none";
    const m = $("lv-auth-msg"); if (m) m.textContent = msg || "";
    if (show) { const c = $("lv-code"); if (c) { try { c.focus(); } catch(e) {} } }
  }

  async function post(path, params){
    const u = MCP + path + "?" + new URLSearchParams(params).toString();
    const r = await fetch(u, { method: "POST", cache: "no-store" });
    let body = null;
    try { body = await r.json(); } catch(e) { /* a proxy page or a 422 detail, not our shape */ }
    return { http: r.status, body: body };
  }

  /* ── the credit stop (server 2.2.390): success:false with the code in \`gate\` (soft-gated
        replies carry it there) and in \`error_code\`, plus a \`say\` line shown WORD FOR WORD.
        Read gate first, then error_code, case-insensitive; the other names are a tolerant
        fallback, and a FastAPI {detail:{…}} envelope is read too, in case a proxy reshapes
        it. ⚠ Never a silent failure: no say line means a plain generic sentence. */
  const CREDIT_CODES = ["credit_low", "insufficient_credit", "insufficient_credits",
                        "low_credit", "insufficient_tc", "low_tc"];
  function flat(b){
    if (!b || typeof b !== "object") return {};
    const d = (b.detail && typeof b.detail === "object" && !Array.isArray(b.detail)) ? b.detail : {};
    return Object.assign({}, d, b);
  }
  function codeOf(b){
    const f = flat(b);
    let g = f.gate;
    if (g && typeof g === "object") g = g.code || g.error_code || "";
    return String(g || f.error_code || f.reason || f.code || "").trim().toLowerCase();
  }
  function sayOf(b){
    const f = flat(b);
    for (const k of ["say", "message", "user_message"]) {
      if (typeof f[k] === "string" && f[k].trim()) return f[k].trim();
    }
    return "";
  }
  function creditsBanner(on){ try { if (typeof window.teckelCreditsBanner === "function") window.teckelCreditsBanner(on); } catch(e) {} }

  // Returns a token string, or null. Never throws — every failure is shown and logged.
  async function mintVoiceToken(){
    const aid = lvAgentId();
    if (!aid) {
      log("access: no agent id on this page, so no token can be minted.");
      setConn("off", "Not set up for voice");
      showMsg("This page is not set up for voice yet. Please contact teckel.io/support.");
      return null;
    }
    // ⭐ THE SIGN-OUT RULES RIDE ON THE CALL ITSELF (« SIGN-OUT »): checked before this browser's id is sent, so
    //   a stopped timer cannot keep an expired sign-in alive through Start or a reconnect. With the server's
    //   portal switch off the code is asked at Start, so the page goes on with the NEW id (and is refused).
    if (signOutCheck(true) === "out" && doorMode !== "legacy") return null;
    const epoch = signOutEpoch;
    let res;
    try { res = await post("get_voice_token", { agent_id: aid, browser_session_id: lvBsid() }); }
    catch(e){
      if (epoch !== signOutEpoch) return null;              /* signed out meanwhile: nothing more to say */
      log("access: get_voice_token unreachable — " + e.message);
      setConn("off", "Could not reach teckel");
      showMsg("Benedict could not be reached just now. Please try again in a moment.");
      return null;
    }
    // ⚠ An answer to a request sent BEFORE a sign-out is dropped: a token minted for the old id must not open
    //   a conversation on a page that has just been signed out.
    if (epoch !== signOutEpoch) { log("access: an answer from before the sign-out was dropped."); return null; }
    const b = res.body || {};
    if (res.http === 422) {
      // A required-parameter regression would land here; legible instead of silent.
      const miss = (((res.body || {}).detail) || []).map(function (d) { return (d.loc || []).slice(-1)[0]; }).join(", ");
      log("access: get_voice_token rejected the call (422 missing: " + miss + ").");
      setConn("off", "Could not start");
      showMsg("Something is wrong with this page. Please reload it.");
      return null;
    }
    if (b.success && b.token) {
      log("access: token minted (single use).");
      authUI(false); creditsBanner(false);
      return b.token;
    }
    if (CREDIT_CODES.indexOf(codeOf(b)) !== -1) {
      creditsBanner(true); authUI(false);
      setConn("off", "Benedict can't start — the practice needs teckel credits");
      showMsg(sayOf(b) || "This practice's credit has run out. Top up in the teckel App, then try again.");
      log("access: refused for credit (" + codeOf(b) + ")");
      return null;
    }
    if (res.http !== 200 || b.success !== false) {
      // Not a verdict (a 5xx, a proxy page, an unknown shape). Never ask for a code on no evidence.
      log("access: no verdict from get_voice_token (HTTP " + res.http + ")");
      setConn("off", "Could not start");
      showMsg(sayOf(b) || "Benedict could not start just now. Please try again in a moment.");
      return null;
    }
    log("access: no token — " + (b.message || b.reason || "not verified"));
    setConn("off", "Access code needed");
    if (doorMode !== "legacy") {
      // The browser is no longer verified, so the portal's sign-in has lapsed too: the page greys,
      // the code row appears, and the conversation starts once the code is accepted.
      startAfterSignIn = true;
      passLapsed("NOT_VERIFIED", "again");
      return null;
    }
    authUI(true, sayOf(b) || "Enter the six-digit access code for this practice.");
    return null;
  }

  async function verifyCode(){
    unlockAudio(); prepareMicCtx();        /* still inside the Verify click: unlock audio now */
    const code = ($("lv-code").value || "").trim(), aid = lvAgentId();
    if (!aid) { authUI(true, "This page is not set up for voice yet."); return; }
    $("lv-verify").disabled = true;
    const epoch = signOutEpoch;
    try {
      const res = await post("verify_access_code_for_browser",
                             { agent_id: aid, browser_session_id: lvBsid(), pin_code: code });
      const b = res.body || {};
      // Signed out while the code was being checked: that answer was for the id just abandoned.
      if (epoch !== signOutEpoch) { authUI(true, signedOutNote); $("lv-code").value = ""; return; }
      if (b.success) { authUI(false); log("access: code accepted."); $("lv-code").value = "";
                       startSignIn(); signedOutNote = "";   /* « SIGN-OUT »: the day and the first use, beside the id */
                       await afterCodeAccepted(); return; }
      // ⚠ Show the server's \`message\` VERBATIM. The code rotates every 15 minutes, so
      //   \`not_recognised\` usually means EXPIRED; substituting "incorrect code" would be a FALSE
      //   ACCUSATION most of the time.
      //   (2.2.432, G4) no message: plain words for the reason, never the code itself (it showed "Not accepted" and the
      //   code in brackets)
      authUI(true, b.message || reasonWords([b.reason], "Not accepted.", "Not accepted."));
      // ⚠ CLEAR A REFUSED CODE: it is very likely dead, and leaving it invites a retry that cannot work.
      $("lv-code").value = "";
      log("access: refused — " + (b.reason || ("HTTP " + res.http)));
    } catch(e) { authUI(true, "Could not reach the access check. Please try again."); log("access: " + e.message); }
    finally { $("lv-verify").disabled = false; }
  }

  /* ══ THE PORTAL DOOR (V2, 21 Oct 2026) ═════════════════════════════════════════════════
     Contract: agent_docs/v2_portal_door_and_backoffice_contract_v1_0.md §1 and §3. Yusuf, 21 Oct:
     the buttons are "greyed-out until access code accepted … as well as passing the pass with the
     request"; "Except the Users Guide — always active".
       1 At load, get_portal_pass(agent_id, browser_session_id) — query parameters, no body, exactly
         like get_voice_token. The page asks for the code ONLY when that answers NOT_VERIFIED.
           success          -> the pass is HELD and the page opens (signin);
           NOT_VERIFIED     -> the code row; once the code is accepted, ask again;
           PORTAL_OFF, or no such route (404/405) -> the page works as it did before this build
                               (voice only, the code asked at Start): the server switch's "off";
           UNKNOWN_PRACTICE, BAD_REQUEST -> greyed, with the reason;
           anything else    -> greyed, "could not be reached", Try again. Never a code on no evidence.
       2 Renewed at 80% of ttl_seconds, silently. A renewal with no verdict (no network) is retried
         until the pass's own expiry; then the page greys and offers Try again.
       3 Every portal request is portalAction(action, args): POST portal_action, JSON body
         {pass, action, args}. ⚠ NO PASS, NO REQUEST: the page never sends one without it.
       4 PASS_EXPIRED, NOT_VERIFIED or BAD_PASS from ANY call: the pass is dropped, the page greys
         and the code row is shown.
     ⚠⚠ THE PASS LIVES IN THIS CLOSURE AND NOWHERE ELSE — never localStorage or sessionStorage, a
        cookie, the DOM, a URL, a log line or window.*. window.teckelPortal hands the page's own
        buttons an action call and the door's state, never the pass itself.
     ⚠ GREYING IS A UI AID ONLY. The server checks the pass on every action; that is the protection.
     ⚠ Only portal_action carries the pass. get_voice_token and the viewer's links keep their own
        signed tokens: a pass in a query string would reach proxy logs, which is why the voice token
        is never logged either. */
  const DOOR_LAPSE = ["PASS_EXPIRED", "NOT_VERIFIED", "BAD_PASS"];
  const RENEW_RETRY_MS = 30000;
  const DOOR_FIRST = "Everything on this page opens once your code is accepted.";
  const DOOR_AGAIN = "This page has been paused to keep your records private. "
                   + "Enter a new access code to carry on.";
  const DOOR_UNREACHABLE = "teckel could not be reached just now, so this page is paused. "
                         + "Your records are not affected.";
  const DOOR_NOT_SET_UP = "This page is not set up yet. Please contact teckel.io/support.";
  let doorMode = "checking";          /* checking | door | legacy | blocked | unreachable */
  let pass = null, passMs = 0, passDeadline = 0, renewAt = 0;
  let renewTimer = null, expireTimer = null, renewing = false;
  let startAfterSignIn = false;       /* the code row was raised by Start: connect once signed in */
  const doorListeners = { signin: [], lapse: [], mode: [] };

  function emit(ev, detail){
    (doorListeners[ev] || []).slice().forEach(function (f) {
      try { f(detail); } catch(e) { log("portal listener failed: " + e.message); }
    });
  }
  function doorAllowsStart(){ return doorMode === "legacy" || (doorMode === "door" && !!pass); }
  function setDoorMode(m){
    if (doorMode === m) return;
    doorMode = m;
    try { document.body.setAttribute("data-pp-door", m); } catch(e) {}
    emit("mode", m);
  }
  function doorLine(text, retry){
    const box = $("pp-door"), msg = $("pp-door-msg"), btn = $("pp-door-retry");
    if (msg) msg.textContent = text || "";
    if (btn) btn.hidden = !retry;
    if (box) box.hidden = !text;
  }

  /* ── greying: every control and panel, except the User Guide links and the sign-in rows ──
     Controls get \`disabled\` (where the element has one) and aria-disabled="true"; links also lose
     their tab stop. Panels get \`inert\` and aria-disabled. The state each control had is kept, so
     reopening puts back exactly what its owner wanted, and while greyed an observer holds down
     anything an owner re-enables or adds (search results, a notice button, a new list row). A
     capture-phase guard stops any click that still lands on a greyed element. */
  const LOCK_CONTROLS = "button, input, select, textarea, a[href], summary, [tabindex]";
  const LOCK_PANELS = ".form-search-bar, #viewer-tools, .form-viewer-shell, #pp-forms-body, #pp-tools-body";
  const LOCK_EXEMPT_ZONES = "#lv-auth-row, #pp-door";
  let locked = false, lockObs = null;
  function isGuideLink(el){
    return el.tagName === "A" && /^guide\\.html(?:[#?]|$)/.test(el.getAttribute("href") || "");
  }
  /* 21 Oct 2026 (Steven, via Yusuf: "teckel.io never be greyed out"): a link to teckel.io itself (the footer, support) is
     ALWAYS active too, like the User Guide. It opens teckel's public site and carries nothing of the practice's. */
  function isTeckelLink(el){
    return el.tagName === "A" && /^https:\\/\\/(?:www\\.)?teckel\\.io(?:[\\/?#]|$)/i.test(el.getAttribute("href") || "");
  }
  function lockExempt(el){
    if (isGuideLink(el)) return true;                       /* the User Guide: ALWAYS active */
    if (isTeckelLink(el)) return true;                      /* teckel.io: ALWAYS active (Steven, 21 Oct) */
    if (el.closest && el.closest(LOCK_EXEMPT_ZONES)) return true;
    // A control that stops the microphone is never greyed while a conversation is open.
    if ((el.id === "lv-mute" || el.id === "lv-disconnect") && isOpen()) return true;
    if (el.id === "lv-keep" && isOpen()) return true;       /* (« END THE CONVERSATION ») keeping it is never greyed either */
    return false;
  }
  function lockEl(el){
    if (!el || el.nodeType !== 1 || lockExempt(el)) return;
    const hasDisabled = ("disabled" in el);
    if (!el.hasAttribute("data-pp-lock")) {
      el.setAttribute("data-pp-lock", "");
      if (hasDisabled) el.setAttribute("data-pp-was", el.disabled ? "1" : "0");
      if (!hasDisabled) el.setAttribute("data-pp-tab", el.hasAttribute("tabindex") ? el.getAttribute("tabindex") : "none");
    }
    if (hasDisabled && !el.disabled) el.disabled = true;
    if (!hasDisabled) el.setAttribute("tabindex", "-1");
    el.setAttribute("aria-disabled", "true");
  }
  function unlockEl(el){
    if (!el.hasAttribute("data-pp-lock")) return;
    if ("disabled" in el) el.disabled = el.getAttribute("data-pp-was") === "1";
    const t = el.getAttribute("data-pp-tab");
    if (t === "none") el.removeAttribute("tabindex"); else if (t !== null) el.setAttribute("tabindex", t);
    ["data-pp-lock", "data-pp-was", "data-pp-tab", "aria-disabled"].forEach(function (a) { el.removeAttribute(a); });
  }
  function lockPanel(p){
    p.setAttribute("data-pp-panel", ""); p.setAttribute("inert", "");
    p.setAttribute("aria-disabled", "true"); p.classList.add("pp-locked");
  }
  function unlockPanel(p){
    ["data-pp-panel", "inert", "aria-disabled"].forEach(function (a) { p.removeAttribute(a); });
    p.classList.remove("pp-locked");
  }
  function lockTree(node){
    if (!node || node.nodeType !== 1) return;
    if (node.matches(LOCK_PANELS)) lockPanel(node);
    if (node.matches(LOCK_CONTROLS)) lockEl(node);
    node.querySelectorAll(LOCK_PANELS).forEach(lockPanel);
    node.querySelectorAll(LOCK_CONTROLS).forEach(lockEl);
  }
  function onLockMutations(records){
    if (!locked) return;
    records.forEach(function (r) {
      if (r.type === "childList") { r.addedNodes.forEach(lockTree); return; }
      const el = r.target;
      if (!el || el.nodeType !== 1 || lockExempt(el)) return;
      if (!el.hasAttribute("data-pp-lock")) { lockEl(el); return; }
      // an owner changed it while greyed: remember what it wanted, keep it greyed
      el.setAttribute("data-pp-was", el.disabled ? "1" : "0");
      if (!el.disabled) el.disabled = true;
    });
    if (lockObs) lockObs.takeRecords();                     /* our own writes are not an owner's */
  }
  function lockAll(){
    locked = true;
    try { document.body.classList.add("pp-signed-out"); } catch(e) {}
    lockTree(document.body);
    if (!lockObs && typeof MutationObserver === "function") {
      lockObs = new MutationObserver(onLockMutations);
      lockObs.observe(document.body, { subtree: true, childList: true,
                                       attributes: true, attributeFilter: ["disabled"] });
    }
    if (lockObs) lockObs.takeRecords();
  }
  function unlockAll(){
    locked = false;
    if (lockObs) { lockObs.disconnect(); lockObs = null; }
    try { document.body.classList.remove("pp-signed-out"); } catch(e) {}
    document.querySelectorAll("[data-pp-panel]").forEach(unlockPanel);
    document.querySelectorAll("[data-pp-lock]").forEach(unlockEl);
    setButtons(); live(isOpen());                           /* the owners re-assert their own state */
  }
  document.addEventListener("click", function (e) {
    if (!locked) return;
    const t = e.target && e.target.closest ? e.target.closest("[data-pp-lock], [data-pp-panel]") : null;
    if (t) { e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);

  /* ── the pass ── */
  function ttlOf(b){
    const t = Number(b.ttl_seconds);
    if (isFinite(t) && t > 0) return t;
    const e = Date.parse(b.expires_at || "");
    if (isFinite(e) && e > Date.now()) return (e - Date.now()) / 1000;
    return 600;                                             /* no stated lifetime: renew early */
  }
  function dropPass(){
    pass = null; passMs = 0; passDeadline = 0; renewAt = 0;
    clearTimeout(renewTimer); clearTimeout(expireTimer); renewTimer = expireTimer = null;
    showSignOut(false);                                     /* no pass, no Sign out button (« SIGN-OUT ») */
  }
  function holdPass(p, ttlSeconds){
    clearTimeout(renewTimer); clearTimeout(expireTimer);
    pass = p;
    passMs = Math.max(1000, ttlSeconds * 1000);
    passDeadline = Date.now() + passMs;
    renewAt = Date.now() + Math.floor(passMs * 0.8);
    renewTimer = setTimeout(renewPass, Math.max(1000, renewAt - Date.now()));
    expireTimer = setTimeout(onPassExpired, passMs);
  }
  // The pass reached its end without a renewal that answered. A renewal still out gets its answer
  // first (after a laptop sleeps, both timers fire together); otherwise the network was the reason.
  function onPassExpired(){
    if (!pass) return;
    if (renewing) { expireTimer = setTimeout(onPassExpired, 1000); return; }
    if (Date.now() \x3c passDeadline) return;
    doorUnreachable("");
  }
  // Back from sleep with the pass already over: not a network fault, so ask again quietly. A browser
  // still verified simply reopens; one that is not gets the code row.
  function reopenAfterSleep(){
    const had = !!pass;
    dropPass();
    if (had) emit("lapse", { code: "ASLEEP" });
    lockAll(); authUI(false); doorLine("Opening your portal…", false);
    obtainPass("retry");
  }
  function passLapsed(code, how){
    const had = !!pass;
    dropPass();
    setDoorMode("door");
    if (had) emit("lapse", { code: code });                 /* the panels close first, so the code row can take focus */
    lockAll(); doorLine("");
    // After a sign-out the code row keeps saying WHY, until the next sign-in (« SIGN-OUT »).
    authUI(true, signedOutNote || (how === "first" ? DOOR_FIRST : DOOR_AGAIN));
    log("portal: closed (" + code + ")");
  }
  function doorUnreachable(say){
    const had = !!pass;
    dropPass();
    setDoorMode("unreachable");
    if (had) emit("lapse", { code: "UNREACHABLE" });
    lockAll(); authUI(false);
    doorLine(say || DOOR_UNREACHABLE, true);
  }
  function doorBlocked(text){
    const had = !!pass;
    dropPass();
    setDoorMode("blocked");
    if (had) emit("lapse", { code: "BLOCKED" });
    lockAll(); authUI(false); doorLine(text, false);
  }
  function enterLegacy(){
    const had = !!pass;
    dropPass();
    setDoorMode("legacy");
    if (had) emit("lapse", { code: "PORTAL_OFF" });
    doorLine(""); authUI(false); unlockAll();
    log("portal: the portal door is off on this server; the page works as it did before (voice only)");
  }

  // true = a pass is held; false = no pass (the page shows why); null = no verdict on a renewal.
  async function obtainPass(reason){
    const aid = lvAgentId();
    if (!aid) { doorBlocked(DOOR_NOT_SET_UP); return false; }
    // ⭐ THE SIGN-OUT RULES RIDE ON THE CALL ITSELF (« SIGN-OUT »). Before this browser's id is sent — at load, on
    //   Try again, on every renewal — the stored last use and sign-in date are read: expired means SIGN OUT, never
    //   renew. While the page is open its renewals are what keep the server's 60-minute window alive, so a timer
    //   that died, a tab the browser restored after a relaunch and a laptop back from sleep all end here. At load
    //   (and on Try again) the page then asks with the NEW id, which tells it the server's mode and asks for the
    //   code; a renewal stops.
    if (signOutCheck(false) === "out" && reason !== "load" && reason !== "retry") return false;
    const epoch = signOutEpoch;
    let res;
    try { res = await post("get_portal_pass", { agent_id: aid, browser_session_id: lvBsid() }); }
    catch(e) {
      if (epoch !== signOutEpoch) return false;             /* signed out meanwhile: the page already says so */
      log("portal: get_portal_pass unreachable — " + e.message);
      if (reason === "renew") return null;
      doorUnreachable(""); return false;
    }
    // ⚠ A REPLY TO A REQUEST SENT BEFORE A SIGN-OUT IS DROPPED. The old id is still verified on the server (no
    //   revoke), so a renewal already on its way when Sign out is pressed would otherwise open the page again.
    if (epoch !== signOutEpoch) { log("portal: an answer from before the sign-out was dropped"); return false; }
    const b = res.body || {};
    const code = String(b.error_code || "").trim().toUpperCase();
    if (res.http === 200 && b.success === true && typeof b.pass === "string" && b.pass) {
      const wasHeld = !!pass;
      holdPass(b.pass, ttlOf(b));
      setDoorMode("door");
      log("portal: " + (wasHeld ? "renewed" : "open") + " for " + Math.round(passMs / 1000) + " s");
      if (!wasHeld) {
        signedOutNote = "";
        if (!readSignIn()) startSignIn();                   /* a browser verified before this build has none */
        authUI(false); doorLine(""); unlockAll(); emit("signin", { reason: reason });
      }
      showSignOut(true);
      return true;
    }
    if (res.http === 404 || res.http === 405 || (res.http === 200 && code === "PORTAL_OFF")) {
      enterLegacy(); return false;
    }
    if (res.http === 200 && code === "NOT_VERIFIED") {
      passLapsed("NOT_VERIFIED", (reason === "load" || reason === "retry") ? "first" : "again");
      return false;
    }
    if (res.http === 200 && code === "UNKNOWN_PRACTICE") { doorBlocked(DOOR_NOT_SET_UP); return false; }
    if (res.http === 200 && code === "BAD_REQUEST") {
      doorBlocked("Something is wrong with this page. Please reload it."); return false;
    }
    // GATEWAY_UNAVAILABLE, a 5xx, a proxy page, an unknown shape: no verdict.
    log("portal: no verdict from get_portal_pass (HTTP " + res.http + (code ? ", " + code : "") + ")");
    if (reason === "renew") return null;
    doorUnreachable(""); return false;
  }
  async function renewPass(){
    if (!pass || renewing) return;
    renewing = true;
    try {
      const ok = await obtainPass("renew");
      if (ok === null && pass) {
        const left = passDeadline - Date.now();
        if (left > 2000) { clearTimeout(renewTimer); renewTimer = setTimeout(renewPass, Math.min(RENEW_RETRY_MS, left - 1000)); }
      }
    } finally { renewing = false; }
  }
  // A laptop lid closed for an hour delays every timer: on coming back, renew (or close) at once.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible" || !pass || renewing) return;
    if (Date.now() >= passDeadline) reopenAfterSleep();
    else if (Date.now() >= renewAt) renewPass();
  });

  /* ══ PAGE FEATURES (24 Oct 2026; Yusuf: "yes please", F-FK; server 2.2.420, R420_OPEN_EDIT) ══════════════════════════
     While the switch is on, EVERY successful door reply carries page_features {open_edit, voice_edit_walk, walk_says_why,
     walk_saves_on_leave}. The last successful reply decides: one without it (the switch turned off) puts every feature
     back off, so with the switch off this page is exactly 2.2.419's. window.teckelPageFeatures() hands the edit and walk
     scripts a frozen copy of the four flags (true only when the server said true), or null. Never a value, never the pass.
     (2.2.421) live_form rides too, but ONLY when the server says it (true or false): absent, it is absent, and the live
     form's own default decides (the live form script, LIVE_FORM_DEFAULT). With the switch off there is still no
     page_features at all, so no live form. */
  let pageFeatures = null;
  const PAGE_FEATURE_KEYS = Object.freeze(["open_edit", "voice_edit_walk", "walk_says_why", "walk_saves_on_leave"]);
  function notePageFeatures(b){
    const f = (b && b.page_features && typeof b.page_features === "object" && !Array.isArray(b.page_features)) ? b.page_features : null;
    if (!f) { pageFeatures = null; return; }
    const out = {};
    PAGE_FEATURE_KEYS.forEach(function (k) { out[k] = f[k] === true; });
    if (typeof f.live_form === "boolean") out.live_form = f.live_form;   /* (2.2.421) only when the server says it */
    pageFeatures = Object.freeze(out);
  }
  Object.defineProperty(window, "teckelPageFeatures", { configurable: false, enumerable: false, writable: false,
    value: function () { return pageFeatures; } });

  // THE ONE WAY A PORTAL REQUEST LEAVES THIS PAGE. Every reply comes back as the server sent it;
  // a failure to reach the server comes back in the same shape, with a plain sentence.
  async function portalAction(action, args){
    const a = String(action || "");
    if (!pass) {
      // ⚠ NO PASS, NO REQUEST. Greyed controls cannot get here; this is the backstop.
      return { success: false, action: a, error_code: "NO_PASS",
               message: "Please enter your access code first." };
    }
    const sent = pass, epoch = signOutEpoch;
    // (Phase 4) « THE CONVERSATION »: the live form's handle becomes conversation_id in the args of the doors that take it,
    //   and nowhere else; a handle whose conversation is gone sends nothing
    const sendArgs = convArgs(a, (args && typeof args === "object" && !Array.isArray(args)) ? args : {});
    if (sendArgs === null) {
      return { success: false, action: a, error_code: "NO_CONVERSATION",
               message: "Typed answers go into the entry once Benedict is connected; until then, Save entry saves the whole entry." };
    }
    // Signed out while this was on its way: its answer must not reach a signed-out page (« SIGN-OUT »).
    const signedOut = function () {
      return { success: false, action: a, error_code: "NO_PASS", message: "Please enter your access code first." };
    };
    let r, b = null;
    try {
      r = await fetch(MCP + "portal_action", {
        method: "POST", cache: "no-store", credentials: "omit",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pass: sent, action: a, args: sendArgs })
      });
    } catch(e) {
      if (epoch !== signOutEpoch) return signedOut();
      log("portal: " + a + " unreachable — " + e.message);
      return { success: false, action: a, error_code: "UNREACHABLE",
               message: "teckel could not be reached just now. Please try again." };
    }
    try { b = await r.json(); } catch(e) { b = null; }
    if (epoch !== signOutEpoch) { log("portal: " + a + " answered after the sign-out; dropped"); return signedOut(); }
    if (!b || typeof b !== "object" || Array.isArray(b)) {
      log("portal: " + a + " no verdict (HTTP " + r.status + ")");
      return { success: false, action: a, error_code: "NO_VERDICT",
               message: "Something went wrong just now. Please try again." };
    }
    const code = String(b.error_code || "").trim().toUpperCase();
    log("portal: " + a + " -> " + (b.success ? "ok" : (code || "refused")));
    if (b.success === true) learnScreenIds(args, b);      /* « THE FORM ON SCREEN »: ids the server vouched for */
    if (b.success === true) notePageFeatures(b);          /* (2.2.420) « PAGE FEATURES »: what this server turned on */
    if (DOOR_LAPSE.indexOf(code) !== -1) { if (pass === sent) passLapsed(code, "again"); }
    else if (code === "PORTAL_OFF") enterLegacy();
    return b;
  }

  /* ══ AUTO-START (Yusuf, 22 Oct 2026: "Yes, start automatically") ═══════════════════════════════════════════════
     The access code ACCEPTED is the start: the conversation begins exactly as Start would begin it, with no second tap.
     verifyCode() already called unlockAudio() and prepareMicCtx() synchronously inside the Verify click (or its Enter
     key) — a phone allows audio only inside the gesture — so connect() is all that is left. Only once the door has
     opened (doorAllowsStart) and never over a conversation already open or starting. A browser that was ALREADY
     verified (no code typed) never starts by itself: Start does it, as before. Whatever stops a start (a credit stop,
     no token, a refused socket) leaves the page exactly as Start would have left it, Start available; a refused
     microphone leaves the conversation open for typing, as after Start, and End then brings Start back. */
  async function afterCodeAccepted(){
    if (doorMode === "legacy") { await autoStart(); return; }   /* the code was asked at Start, as before this build */
    const ok = await obtainPass("signin");
    if (ok === true) { startAfterSignIn = false; await autoStart(); }
  }
  async function autoStart(){
    if (connecting || isOpen() || !doorAllowsStart()) return;
    log("access: code accepted, so the conversation starts (no second tap)");
    await connect();
  }

  // What the page's own buttons (the review panel, My forms) need — and NOT the pass.
  Object.defineProperty(window, "teckelPortal", { configurable: false, enumerable: false, writable: false,
    value: Object.freeze({
      action: portalAction,
      held: function () { return !!pass; },
      mode: function () { return doorMode; },
      live: function () { return isOpen(); },
      on: function (ev, f) { if (doorListeners[ev] && typeof f === "function") doorListeners[ev].push(f); },
      lapseCodes: Object.freeze(DOOR_LAPSE.slice())
    }) });

  /* ══ SIGN-OUT (Yusuf, 21 Oct 2026, V2 decision 7) ══════════════════════════════════════════════════════
     Sign-in stays REMEMBERED PER BROWSER (the id in localStorage), and ends three ways:
       · the "Sign out" button in the header, shown while the page is signed in;
       · SIGN_OUT_IDLE_MS without use (8 hours), and SIGN_OUT_AT_MIDNIGHT (local midnight) — the two constants
         at the top of this script. "Use" = a click, key press or touch on the page, or a live conversation.
       · another tab or window of this browser signing out (the id they share was replaced).
     Signing out ends any live conversation cleanly (as End does), drops the pass from memory with its renewal
     and expiry timers, clears what is on screen (My forms, the viewer, the review panel, the Practice tools, the
     conversation), REPLACES the id (replaceBsid: the old one is abandoned, the server is asked nothing), and
     shows the code row with everything greyed except the User Guide, and a line saying why.
     ⚠⚠ FOR A PAGE LEFT OPEN THERE IS NO SERVER-SIDE BACKSTOP. The server keeps a browser verified for 60 minutes
        after its LAST check, sliding, with no absolute cap and no revoke (Yusuf CC, from the live apiGateway,
        21 Oct 2026), and this page's own renewals are such checks: an open tab stays verified for as long as it
        stays open. A CLOSED tab is forgotten 60 minutes after its last check, and so is an abandoned id. ⇒ These
        rules are the only thing that ends an open, unattended tab, so they do NOT live only in a timer that can
        stop on its own: signOutCheck() runs BEFORE every get_portal_pass and get_voice_token (load, Try again,
        renewal, Start), on every use, and when a conversation ends; the minute timer and visibilitychange are a
        second trigger only.
     ⚠ NEVER MID-CONVERSATION: a rule that falls due while a conversation is live (or starting) waits for it to
       end; a live conversation is use, so it is the midnight rule that can wait, never the idle one.
     ⚠ A USE NEVER REVIVES AN EXPIRED SIGN-IN: the first click after nine hours away signs out; it is not counted.
     ⚠ After a sign-out NOTHING is sent with the old id: the renewal and expiry timers go with the pass; Start and
       a reconnect read the new id; and a reply to anything sent before (a renewal, a voice token, a code check,
       a portal request) is dropped by its epoch — the old id is still verified on the server for up to an hour. */
  const SIGN_OUT_TICK_MS = 60 * 1000;          /* the second trigger: once a minute while the page is open */
  const USE_WRITE_MS = 15 * 1000;              /* a use is written to the record at most this often */
  const SIGNED_OUT_SAY = {
    user: "You are signed out. Enter the access code to sign in again.",
    idle: "You were signed out after a period without use. Enter the access code to sign in again.",
    midnight: "You were signed out at midnight. Enter the access code to sign in again.",
    elsewhere: "You are signed out, because this browser was signed out in another tab or window. "
             + "Enter the access code to sign in again."
  };
  let signOutEpoch = 0;                        /* +1 at every sign-out: a reply to an older request is dropped */
  let signedOutNote = "";                      /* why the code row is up, until the next sign-in */
  let signOutAfterCall = "";                   /* a sign-out that waits for the conversation to end */
  let useWrittenAt = 0;

  function showSignOut(on){ const b = $("pp-signout"); if (b) b.hidden = !on; }
  function conversationBusy(){ return isOpen() || connecting; }
  function startSignIn(){
    const now = Date.now();
    writeSignIn({ day: localDay(), last: now }); useWrittenAt = now;
  }
  // "" = nothing due; "idle" or "midnight" = due. Only the stored record decides, so every tab of this browser
  // agrees (they share the id, and the record is the last use in ANY of them).
  function signOutDue(r){
    const last = Number(r.last);
    if (!isFinite(last) || last \x3c= 0) return "idle";                      /* unreadable: unsure means signed out */
    if (Date.now() - last >= SIGN_OUT_IDLE_MS) return "idle";
    // "Not today" — before today, or a clock moved back past midnight: a sign-in lasts one calendar day.
    if (SIGN_OUT_AT_MIDNIGHT && String(r.day || "") !== localDay()) return "midnight";
    return "";
  }
  // THE CHECK. "out" = signed out just now; "wait" = due, but a conversation is live or starting; "" = nothing due.
  // atStart: called from Start, where \`connecting\` is this page's own doing and must not defer the check.
  function signOutCheck(atStart){
    const r = readSignIn();
    if (!r) return "";                                                    /* not signed in on this id */
    if (!atStart && conversationBusy()) {
      if (isOpen()) { r.last = Date.now(); writeSignIn(r); useWrittenAt = r.last; }   /* a live conversation IS use */
      return signOutDue(r) ? "wait" : "";
    }
    const why = signOutDue(r);
    if (!why) return "";
    signOut(why);
    return "out";
  }
  function markUse(){
    const now = Date.now();
    if (now - useWrittenAt \x3c USE_WRITE_MS) return;
    if (signOutCheck(false) || isOpen()) return;   /* signed out, or waiting, or already written for the conversation */
    const r = readSignIn();
    if (!r) return;
    r.last = now; writeSignIn(r); useWrittenAt = now;
  }
  function clearScreen(){
    try { if (typeof window.teckelNewConversation === "function") window.teckelNewConversation(); }   /* the viewer */
    catch(e) { log("panel reset failed: " + e.message); }
    dirForget();                           /* (phase 2) a band asked for before the sign-out is dropped */
    clearTranscript(); showStatus({ text: "" }); hideNotice(); showMsg(""); clearList();
    lastRecorded = null;
    const box = $("form-search"), out = $("form-search-results");
    if (box) box.value = "";
    if (out) { out.textContent = ""; out.style.display = "none"; }
  }
  // why: user | idle | midnight | elsewhere. alreadyReplaced: another tab has replaced the shared id already.
  function signOut(why, alreadyReplaced){
    signOutEpoch++;                            /* ⚠ FIRST: every reply to a request sent before this is dropped */
    signedOutNote = SIGNED_OUT_SAY[why] || SIGNED_OUT_SAY.user;
    signOutAfterCall = ""; startAfterSignIn = false;
    forgetScreenForm("signed_out");            /* kev hears it while the socket is still open; the page forgets */
    forgetConversation(true);                  /* (Phase 4) every conversation id, kept or not */
    if (sock) { droppingFrames = true; endConversation(); }               /* a clean close, as End does */
    dropPass();                                /* the pass leaves memory, with its renewal and expiry timers */
    if (!alreadyReplaced) replaceBsid();       /* this browser is no longer verified; the old id is abandoned */
    useWrittenAt = 0;
    clearScreen();
    if (doorMode === "legacy") {               /* the server's portal switch is off: nothing to grey, and the code
                                                  is asked at Start, with the new id */
      showMsg(signedOutNote); log("portal: signed out (" + why + ")"); return;
    }
    setDoorMode("door");
    emit("lapse", { code: "SIGNED_OUT" });     /* the panels close and clear: My forms, the review panel, the tools */
    lockAll(); doorLine("");
    authUI(true, signedOutNote);
    log("portal: signed out (" + why + ")");
  }
  function signOutTick(){
    try { signOutCheck(false); } catch(e) { log("sign-out check failed: " + e.message); }
  }
  // A sign-out that waited for the conversation, or the check, now that it has ended (called from onclose).
  function afterConversationEnded(){
    // On a greyed page Mute and End were exempt only while the conversation was open: grey them now. (End was
    // already disabled by the close, so the observer saw no change to act on.)
    if (locked) { lockEl($("lv-mute")); lockEl($("lv-disconnect")); lockEl($("lv-keep")); }
    if (droppingFrames) { droppingFrames = false; clearScreen(); return; }   /* signed out during it: clear again */
    if (signOutAfterCall) { const w = signOutAfterCall; signOutAfterCall = ""; signOut(w, true); return; }
    signOutTick();
  }
  const signOutBtn = $("pp-signout");
  if (signOutBtn) signOutBtn.addEventListener("click", function () { signOut("user"); });
  ["pointerdown", "keydown", "touchstart"].forEach(function (t) {
    document.addEventListener(t, function () { try { markUse(); } catch(e) {} }, { capture: true, passive: true });
  });
  setInterval(signOutTick, SIGN_OUT_TICK_MS);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") signOutTick();
  });
  // Another tab or window of this browser signed out: the id they share was replaced (or storage was cleared).
  window.addEventListener("storage", function (e) {
    if (!e || (e.key !== null && e.key !== bsidStorageKey())) return;
    if (e.key !== null && e.newValue === e.oldValue) return;
    if (!pass) return;                         /* nothing open here */
    if (conversationBusy()) { signOutAfterCall = "elsewhere"; return; }   /* never mid-conversation */
    signOut("elsewhere", true);
  });

  /* ── a new conversation: a clean panel first, exactly as the template does on the
        ElevenLabs call event (viewer, polls, Back target, debounce maps, self-fill card) —
        except a form the user opened with the page's own View (« THE FORM ON SCREEN ») ── */
  function newConversation(){
    forgetConversation(false);             /* (Phase 4) the new conversation sends its own */
    const keep = keepFormAtStart();
    try { if (typeof window.teckelNewConversation === "function") window.teckelNewConversation({ keepPageForm: keep }); }
    catch(e) { log("panel reset failed: " + e.message); }
    if (keep) log("the form the user opened stays on screen");
    forgetVoiceCopy();                     /* (2.2.419) the reset cleared Benedict's form from the viewer */
    dirForget();                           /* (phase 2) and one asked for in the last conversation */
    clearTranscript(); showStatus({ text: "" }); hideNotice(); showMsg(""); clearList();
    lastRecorded = null; frames = 0;
    Object.keys(callIdByKey).forEach(function (k) { delete callIdByKey[k]; });
    activity();
  }

  const wsBase = wsEndpoint();

  /* ══ ONE SOCKET (26 Oct 2026, page 2.2.431 G2 — tcc's run 49, F-HH: after End → Start the probe saw TWO flow sockets
        open; Yusuf CC, from kev's flow.py: kev builds a FRESH PIPELINE PER CONNECTION, so two open sockets are two live
        pipelines, each with its own pending state) ══════════════════════════════════════════════════════════════════
     The page holds ONE socket, \`sock\`, and only that socket may touch the conversation:
       · every handler is bound to its OWN socket and does nothing once that socket is not \`sock\` (its open, its frames,
         its error, its close) — so a socket the page has let go can never null the new one, stop its microphone, forget
         its conversation id, re-show Start over it, or deliver its frames into it;
       · connect() LETS GO of any socket it still holds BEFORE the new one is made: its four handlers dropped, closed when
         it is not closed yet, and its own close-time tidy-up (its onclose) run for it at once. The one window this matters in:
         End has sent its close and kev has not answered yet (the socket CLOSING, so isOpen() is false), when anything
         re-shows Start (a sign-in's unlockAll, the review panel's wiring — each calls setButtons);
       · what opens a socket at all: Start (onStartClick) and the code accepted (autoStart) — both refuse while one is open
         or starting (\`connecting\`, set before the first await, so two quick Starts open one). Nothing reconnects by itself:
         a dropped socket says "press Start conversation to reconnect"; the shell's watchdog is the core's load timer; the
         visibility change renews the pass. */
  function letGo(s){
    if (!s) return;
    s.onopen = null; s.onmessage = null; s.onerror = null; s.onclose = null;
    try { if (s.readyState === WebSocket.CONNECTING || s.readyState === WebSocket.OPEN) s.close(1000, "user"); } catch(e) {}
  }

  async function connect(){
    if (connecting || isOpen()) return;
    if (sock) {                              /* « ONE SOCKET »: still closing — let it go first, its tidy-up now */
      const old = sock, gone = old.onclose;
      letGo(old);
      log("the previous socket was let go before the new one opened (it was still closing)");
      if (typeof gone === "function") { try { gone({ code: 1000 }); } catch(e) { log("tidy-up failed: " + e.message); } }
      sock = null;                           /* whatever its tidy-up did, it is not this page's socket any more */
      if (connecting || !doorAllowsStart()) { setButtons(); return; }   /* a sign-out that waited for it ran */
    }
    connecting = true; everOpened = false; endingByUser = false; muted = false; droppingFrames = false;
    holdReset();                             /* « THE FIRST WORDS »: this conversation's first audio is held afresh */
    setButtons(); newConversation();
    setConn("busy", "Connecting…"); setMic("");
    // TOKEN FIRST. ⚠ Minted here and nowhere else, so a reconnect always gets a fresh one.
    const token = await mintVoiceToken();
    if (!token) {
      // ⭐ ENFORCEMENT IS ON (FLOW_REQUIRE_VOICE_TOKEN=1, 15 Oct 2026). Proven before the
      //   tokenless branch was deleted, three handshakes in one minute with the same key:
      //     WITH a valid token     -> HTTP/1.1 101 Switching Protocols
      //     WITHOUT a token        -> HTTP/1.1 403 Forbidden
      //     WITH a garbage token   -> HTTP/1.1 403 Forbidden
      //   The browser sees only close code 1006 for a refusal, which is also what a transient
      //   502 looks like. ⇒ no voice token, so the server will refuse the socket: stop here,
      //   and the state already says why (a code, a credit stop, or no verdict).
      log("access: no voice token, so the server will refuse the socket. "
          + "Enter your access code and try again.");
      connecting = false; setButtons();
      return;
    }
    let url = wsBase + (wsBase.indexOf("?") === -1 ? "?" : "&") + "t=" + encodeURIComponent(token);
    let s = null;
    try { s = new WebSocket(url); }
    catch(e){ log("socket failed: " + e.message); sock = null; connecting = false; setButtons();
              setConn("off", "Could not connect — press Start conversation to try again"); return; }
    sock = s;                                /* « ONE SOCKET »: this socket's handlers act only while it is \`sock\` */
    url = null;                              /* the token is single use; nothing keeps it */
    s.binaryType = "arraybuffer";
    s.onopen = async () => {
      if (s !== sock || droppingFrames) return;   /* let go, or signed out while connecting: End's close is on its way */
      everOpened = true; connecting = false;
      live(true);                            /* taps on forms now reach kev */
      setButtons(); setConn("on", "Connected"); setMic("starting the microphone…");
      volumeLine(true);                      /* (phase 1) "Can't hear Benedict? Turn up your media volume." */
      log("connected");
      startHello(s);                         /* « THE PAGE TELLS KEV IT IS READY »: client_ready, review_panel, screen_form */
      if (dbg.health) health();
      try { await startMic(); }
      catch(e){ log("mic refused: " + e.message); micAbsent(); applyMute();
                showMsg("The microphone is not available here, so type to Benedict instead."); }
      helloMicSettled(s);                    /* capturing or refused: client_ready can say which */
    };
    s.onmessage = (ev) => {
      if (s !== sock || droppingFrames) return;   /* let go, or signed out: nothing more from it reaches this screen */
      if (typeof ev.data === "string") { log("unexpected text frame"); return; }
      let f; try { f = decodeFrame(ev.data); } catch(e){ log("decode failed: " + e.message); return; }
      if (f.interruption) flushPlayback();
      if (f.audio) botAudio(f.audio, f.rate || BOT_RATE);   /* « THE FIRST WORDS »: the first is held, nothing dropped */
      if (!f.msg) return;
      let m; try { m = JSON.parse(f.msg); } catch(e){ log("non-JSON message"); return; }
      if (!m || typeof m !== "object") return;
      try {
        if (m.kind === "transcript") { activity(); addTranscript(m); }
        else if (m.kind === "status") { activity(); showStatus(m); }
        else if (m.kind === "recorded") { activity(); onRecorded(m); }
        else if (m.kind === "client_tool") runClientTool(m);
        else if (m.kind === "display_numbered_list") { activity(); showNumberedList(m); }   /* contract §7 */
        else if (m.kind === "show_band") { activity(); showBand(m); }   /* (phase 2) « SHOW A BAND » */
        else if (m.kind === "conversation") { activity(); onConversation(m); }   /* (Phase 4) « THE CONVERSATION » */
        else if (m.kind === "walk_control" && reviewTakes(m)) activity();   /* (2.2.428) « THE REVIEW WALK » takes every op while it runs */
        else if (m.kind === "walk_control" && m.op === "close_form") { activity(); closeForm(); }   /* « CLOSE THE FORM » */
        else if (m.kind === "walk_result" || m.kind === "walk_control") { activity(); walkFrame(m); }   /* (2.2.419) */
        else if (m.kind === "session_end") { activity(); sessionEnd(m); }   /* « END THE CONVERSATION » */
        else log("message ignored: " + String(m.kind).slice(0, 40));
      } catch(e) { log("message handling failed: " + e.message); }
    };
    s.onclose = (e) => {
      if (s !== sock) return;                /* « ONE SOCKET »: a socket already let go touches nothing */
      const wasOpen = everOpened, byUser = endingByUser;
      sock = null; connecting = false; endingByUser = false; muted = false;
      stopHello(); helloSent = false; reviewSentKey = null;   /* the next conversation says client_ready afresh */
      forgetConversation(false);             /* (Phase 4) its id goes with it; an entry bound to it keeps its own */
      endReset();                            /* « END THE CONVERSATION »: a pending end goes with the session */
      clearTimeout(muteTimer); muteTimer = null;
      live(false); stopMic(); flushPlayback(); holdReset(); volumeLine(false); showStatus({ text: "" }); applyMute(); clearList();
      const part = document.querySelector("#lv-transcript .l.bot.partial"); if (part) part.remove();
      setButtons(); setMic("");
      if (byUser) setConn("", "Conversation ended");
      else if (wasOpen) setConn("off", "Disconnected — press Start conversation to reconnect");
      else setConn("off", "Could not connect — press Start conversation to try again");
      if (!wasOpen && e.code === 1006) log("handshake failed (often a transient 502) — try again.");
      if (wasOpen) endNotice(); else hideNotice();
      log("closed, code " + e.code);
      afterConversationEnded();              /* « SIGN-OUT »: a rule that waited for the conversation applies now */
    };
    s.onerror = () => { if (s === sock) log("socket error"); };
  }

  // END: kev cleans up when the socket CLOSES. So End is a clean close after a short "Ending…" state.
  // (25 Oct 2026) kev's spoken goodbye, {kind:"session_end"}, ends the session through THIS function too
  // (« END THE CONVERSATION » below), after the closing words and a moment to keep talking.
  function endConversation(){
    if (!sock) return;
    endReset();                              /* « END THE CONVERSATION »: a pending end (its bar, its timers) gives way */
    endingByUser = true;
    setButtons(); setConn("busy", "Ending…"); setMic("");
    clearTimeout(muteTimer); muteTimer = null; hideNotice();
    stopMic(); flushPlayback();
    const s = sock;
    setTimeout(function () { try { s.close(1000, "user"); } catch(e) {} }, ENDING_MS);
  }

  /* ══ CLOSE THE FORM (25 Oct 2026, Yusuf: "YES PLEASE, BUILD BOTH AND FIX THE LINE"; the contract agreed with Yusuf CC —
        TASKS_AND_DECISIONS.md, the top entry) ══════════════════════════════════════════════════════════════════════════
     kev → page {kind:"walk_control", op:"close_form"} ("close the form"). The page puts the form away and the
     conversation goes on:
       · any walk ends — the live form (and the walk panel) close as they do whenever the form leaves the viewer, which
         tells kev {kind:"walk_control", op:"stop"} after a step went out, exactly as before;
       · the viewer goes back to where the user came from: the DOCUMENT DIRECTORY when the form replaced it there
         (formFrom, below: a fresh directory_link through the portal door, opened on the device's own view), else the
         empty viewer (the home view). A directory that cannot be opened leaves the empty viewer and one line;
       · then the usual screen_form state, {kind:"screen_form", instance_id:null, form_name:null, action:"closed", at}, ONCE,
         on the task after the walk's own stop, so kev's state follows the screen. No form on screen: nothing to put away,
         and that same state is sent.
     ⛔ NOTHING IS SUBMITTED, DISCARDED OR SAVED HERE: no request about the copy at all — every answer already written stays
       written. The conversation, the microphone and Mute are not touched. Nothing in storage.
     formFrom: whenever the viewer changes ("teckel-viewer"), a form arriving straight after the directory was on screen
     came FROM the directory; a form arriving after anything else came from home; a form replacing a form keeps the
     first one's origin (the user is still on that errand). */
  let viewerWas = "other";                 /* what the viewer showed last: "form" | "directory" | "other" */
  let formFrom = "home";                   /* where the form now on screen was opened from: "directory" | "home" */
  function viewerNow(){
    let f = false;
    try { f = !!(window.teckelPortalViewer && window.teckelPortalViewer.formShown()); } catch(e) { f = false; }
    return f ? "form" : (dirOnScreen() ? "directory" : "other");
  }
  window.addEventListener("teckel-viewer", function () {
    try {
      const now = viewerNow();
      if (now === "form" && viewerWas !== "form") formFrom = viewerWas === "directory" ? "directory" : "home";
      viewerWas = now;
    } catch(e) { /* the origin is a nicety: never an error */ }
  });
  function closeForm(){
    const on = viewerNow() === "form";
    const back = on && formFrom === "directory";
    log("close_form: " + (on ? "the form is put away" + (back ? ", back to the directory" : "") : "no form on screen"));
    if (on) {
      const pv = window.teckelPortalViewer;   /* the viewer's own clear: the frame, a drawn PDF, its polls, the Back target */
      try { if (pv && typeof pv.clear === "function") pv.clear(); } catch(e) { log("close_form: the viewer could not be cleared"); }
      viewerWas = "other"; formFrom = "home";
    }
    // the state kev follows: on the NEXT task, after the walk's own stop (the viewer's change reaches the walk on that task)
    setTimeout(function () { try { tellScreenForm(null, null, "closed"); } catch(e) { log("close_form: state not sent"); } }, 0);
    if (back) openDirectoryHome();
  }
  async function openDirectoryHome(){
    const seq = ++dirSeq;
    let r;
    try { r = await portalAction("directory_link", {}); }
    catch(e) { r = null; }
    if (seq !== dirSeq) return;
    const url = (r && r.success === true && typeof r.url === "string") ? r.url.trim() : "";
    if (!DIR_URL.test(url)) { showMsg("The directory could not be opened just now."); log("close_form: no directory link"); return; }
    let ok = false;
    try { ok = typeof window.teckelPortalShow === "function" && await window.teckelPortalShow("directory", url); }
    catch(e) { ok = false; }
    if (!ok) { showMsg("The directory could not be shown just now."); return; }
    showMsg("");
  }

  /* ══ END THE CONVERSATION (25 Oct 2026, Yusuf: "YES PLEASE, BUILD BOTH AND FIX THE LINE"; the contract agreed with
        Yusuf CC) ═══════════════════════════════════════════════════════════════════════════════════════════════════════
     kev → page {kind:"session_end", reason:"user_asked"} ("goodbye", "I'll stop there"):
       1 the page waits until Benedict's closing words have PLAYED — nothing queued or held, and no audio for
         END_QUIET_MS — but never longer than END_DRAIN_CAP_MS from the message, then goes on anyway;
       2 it shows "Ending the conversation…" with ONE button, "Keep talking", for END_CANCEL_MS (the voice Submit's Cancel
         pattern; text only; a bar at the foot of the screen, so a phone scrolled to the form still sees it);
       3 then it closes the session EXACTLY as the user's own End button does: endConversation(), the one function that
         button calls.
     · "Keep talking" in those seconds keeps the session and tells kev {kind:"session_end_cancelled"}.
     · EVERY session_end takes this path, whatever its reason — "user_asked", another or a future reason, none, or one that
       is not a string: the reason is never shown, never acted on, and logged only as letters and underscores (40 at most).
       Nothing in it can throw. One at a time: another while one is pending is ignored. Routed on kind only.
     · The user's own End, a sign-out or the socket closing while one is pending cancels it quietly (no message).
     · Mute, the walk and the form on screen are left as they are; only the ending of the session changes anything. */
  const END_DRAIN_CAP_MS = 5000;           /* the closing words: waited for at most this long */
  const END_QUIET_MS = 250;                /* … and "played" means nothing queued and no audio arriving for this long */
  const END_CANCEL_MS = 3000;              /* "Keep talking" is offered this long */
  const END_POLL_MS = 50;
  let ending = null;                       /* {sock, t0, timer, phase: "drain" | "window"} */
  function audioDrained(){
    return !heldAudio.length && !sources.length && performance.now() - lastBotAudioAt >= END_QUIET_MS;
  }
  function showEnding(on){
    const bar = $("lv-ending");
    if (!bar) return;
    if (on) { const t = $("lv-ending-msg"); if (t) t.textContent = "Ending the conversation…"; }
    bar.hidden = !on;
  }
  function endReset(){
    if (ending) { clearTimeout(ending.timer); ending = null; }
    showEnding(false);
  }
  function sessionEnd(m){
    let why = "";
    try { why = (m && typeof m.reason === "string") ? m.reason.replace(/[^A-Za-z_]/g, "").slice(0, 40) : ""; } catch(e) { why = ""; }
    if (ending || !isOpen() || endingByUser) { log("session_end ignored (" + (ending ? "one is pending" : "not open") + ")"); return; }
    log("session_end (" + (why || "no reason") + "): waiting for the closing words");
    ending = { sock: sock, t0: performance.now(), timer: null, phase: "drain" };
    endTick();
  }
  function endTick(){
    const e = ending;
    if (!e) return;
    if (e.sock !== sock || !isOpen()) { endReset(); return; }
    const waited = performance.now() - e.t0;
    if (!audioDrained() && waited \x3c END_DRAIN_CAP_MS) { e.timer = setTimeout(endTick, END_POLL_MS); return; }
    log("session_end: " + (audioDrained() ? "the closing words played" : "still playing after " + END_DRAIN_CAP_MS + " ms")
        + " — Keep talking is offered");
    e.phase = "window";
    showEnding(true);
    e.timer = setTimeout(endNow, END_CANCEL_MS);
  }
  function endNow(){
    const e = ending;
    if (!e) return;
    endReset();
    if (e.sock === sock && isOpen()) { log("session_end: ending, as the End button does"); endConversation(); }
  }
  function keepTalking(){
    const e = ending;
    if (!e || e.phase !== "window") return;
    endReset();
    const ok = sendJSON({ kind: "session_end_cancelled" });
    log("session_end_cancelled " + (ok ? "sent" : "not sent (no socket)"));
    activity();
  }

  function onStartClick(){
    if (connecting || isOpen() || !doorAllowsStart()) return;
    unlockAudio(); prepareMicCtx();        /* inside the gesture: the only moment a phone allows it */
    connect();
  }

  /* ── ?debug=1: the developer drawer, built here so production markup has none of it ── */
  async function health(){
    if (!dbg.health) return;
    let u;
    try { u = new URL(wsBase.replace(/^ws/, "http")).origin + "/health"; }
    catch(e) { dbg.health.textContent = "no valid endpoint"; return; }
    try { const r = await fetch(u, { cache: "no-store" }); const h = await r.json();
      dbg.health.textContent = "status " + h.status + " · " + h.sessions_live + " session(s) · "
                               + h.llm_model + " · voice " + h.voice;
    } catch(e) { dbg.health.textContent = "could not read /health from this page"; }
  }
  function buildDebugDrawer(){
    const panel = $("lv-panel"); if (!panel) return;
    const box = document.createElement("div"); box.className = "lv-debug"; box.id = "lv-debug";
    const ep = document.createElement("div"); ep.textContent = "endpoint " + wsBase;
    dbg.health = document.createElement("div"); dbg.health.textContent = "health not checked";
    dbg.frames = document.createElement("div"); dbg.frames.textContent = "0 frames";
    dbg.log = document.createElement("pre"); dbg.log.id = "lv-log";
    [ep, dbg.health, dbg.frames, dbg.log].forEach(function (n) { box.appendChild(n); });
    panel.appendChild(box);
    health();
  }

  $("lv-connect").addEventListener("click", onStartClick);
  $("lv-verify").addEventListener("click", verifyCode);
  $("lv-code").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); verifyCode(); } });
  $("lv-disconnect").addEventListener("click", endConversation);
  $("lv-mute").addEventListener("click", toggleMute);
  // « MUTE »: the copies beside Voice on / off (the live form, the walk panel) — the same state, the same toggle
  muteControls().forEach(function (b) { if (b.id !== "lv-mute") b.addEventListener("click", toggleMute); });
  { const k = $("lv-keep"); if (k) k.addEventListener("click", keepTalking); }   /* « END THE CONVERSATION » */
  $("lv-type-form").addEventListener("submit", function (e) { e.preventDefault(); sendTyped(); });
  if (DEBUG) buildDebugDrawer();
  // THE DOOR, FROM THE FIRST PAINT: greyed now; asked once every script on the page is in, so the
  // review panel and My forms are listening before the first answer can arrive.
  lockAll(); doorLine("Opening your portal…", false);
  const retry = $("pp-door-retry");
  if (retry) retry.addEventListener("click", function () {
    doorLine("Opening your portal…", false); obtainPass("retry");
  });
  function doorStart(){ lockAll(); obtainPass("load"); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", doorStart, { once: true });
  else doorStart();
  setButtons(); setConn("", "Not connected"); setMic("");
  if (!("WebSocket" in window) || !navigator.mediaDevices || !window.AudioWorkletNode) {
    showMsg("This browser cannot run Benedict's voice. Please use a current browser such as "
            + "Chrome, Edge or Safari.");
  }
  log("local chain ready. No ElevenLabs on this page.");
})();

"use strict";
(function () {
  const P = window.teckelPortal;
  const $ = (id) => document.getElementById(id);
  if (!P || !$("pp-forms") || !$("pp-review") || !$("pp-submit")) return;   /* no door on this page */
  const LAPSE = P.lapseCodes;
  const SIGN_PAGE = { test: (u) => typeof window.teckelPageLink === "function" && window.teckelPageLink(u, /^\\/[^?#\\s]*sign\\.html\\?\\S+$/) };   /* F-HA: any trusted origin */

  function codeOf(r){ return String((r && r.error_code) || "").trim().toUpperCase(); }
  // The door has already greyed the page and raised the code row (or gone back to voice only):
  // the caller says nothing more.
  function lapsed(r){ const c = codeOf(r); return LAPSE.indexOf(c) !== -1 || c === "NO_PASS" || c === "PORTAL_OFF"; }
  function msgOf(r, fallback){
    const m = (r && typeof r.message === "string") ? r.message.trim() : "";
    return m || fallback;
  }
  function txt(el, s){ if (el) el.textContent = (s === undefined || s === null) ? "" : String(s); }
  function shown(v){ return v !== undefined && v !== null && String(v).trim() !== ""; }
  function quoted(s){ return "“" + String(s) + "”"; }
  function openDlg(d){ if (!d || d.open) return; try { d.showModal(); } catch(e) { d.setAttribute("open", ""); } }
  function closeDlg(d){ if (!d || !d.open) return; try { d.close(); } catch(e) { d.removeAttribute("open"); } }
  // (2.2.417) a form's view carries view_link's expires_at, so a typed save can redraw it while its token is fresh
  function show(kind, url, expiresAt){
    return (typeof window.teckelPortalShow === "function") ? window.teckelPortalShow(kind, url, expiresAt) : Promise.resolve(false);
  }
  // (contract §6) The copy this button showed or acted on, for the conversation. A hint only; never throws.
  function onScreen(iid, name, action){
    try { if (typeof window.teckelScreenForm === "function") window.teckelScreenForm(iid, name, action); } catch(e) {}
  }
  // On a phone the viewer is below the list: bring it into view once something is on it.
  function revealViewer(){

  /* ══ THE REVIEW WALK (25 Oct 2026, PHASE 5 — Yusuf: "we must get these 5 phases built and deployed", "YES GO WITH ALL";
        the brief agent_docs/campaign_2026-09-25/round4/PHASE5_BUILD_BRIEF_2026-10-25.md §2, §4 and §9; server 2.2.428,
        R428_REVIEW_WALK) ═══════════════════════════════════════════════════════════════════════════════════════════════
     The panel's items are walked by voice, one at a time. INERT until a review_next reply carries \`walk\` (the server's
     say, its fixed lines and its shown stamp): without it the panel is exactly what it was, and so are its requests.
     · ONE STEP PER SHOWING — {kind:"walk_step", step:"review", instance_id:null, speak, say, payload:{step_id, kind, n, of,

       has heard the page's opening run ("teckel-hello"). step_id is "rv-\x3cbase36>", minted fresh for every showing (the
       next item, an item shown again) and NEVER reused while the page lives; "again", Voice on and the stale re-send
       send the SAME envelope (the same id) with speak:true, once.
     · say is the server's: the item's line; after a decision, the server's say for it, then the next item's. ⛔ The
       server's shown stamp, the item's id, its values and its evidence never go to kev (the evidence is on screen only).
     · Voice: ON when the panel opened itself at sign-in, silent from the badge (brief Q2); the Voice on / off button in the
       panel's head sends speak / quiet, and Voice on reads the item at once. The hint teaches the long words only —
       “yes please”, “no thanks”, “skip this one, please”, then “go back, please”, “say that again, please” (Yusuf, 25 Oct:
       "YES PLEASE TO ALL FOUR PENDING ITEMS" — run 45 lost every command under 0.6 s) — never a bare one-word command, and
       there is no control for more than one item, anywhere.
     · kev's ops (walk_control, each naming the step_id it answers; the transport hands the review walk EVERY walk_control
       while it runs): accept / reject / later → review_resolve for the ONE item on screen, {via:"voice", shown};
       ⛔ ONLY when step_id is the step now current, in this conversation, and no answer is still being dealt with —
       otherwise NOTHING goes to the server and the current step is sent again, speak:true, say = lines.stale + the item's
       line. back → the item before this one, only when it was skipped in this pass and is still open (review_next
       {suggestion_id}), else lines.back. again → the same envelope. stop → the walk ends; the panel stays; nothing
       changes. close_form → the PANEL closes (decides nothing), never the form. speak / quiet → Voice.
     · Clicks send the stamp too ({via:"click", shown}). ITEM_CHANGED → that item read again (review_next {suggestion_id})
       and shown afresh; ALREADY_RESOLVED → the next. The next step carries outcome — the server's lists, rebuilt — and
       after the last item a step {done:true}, which ends the walk (kev drops the held item; no stop follows).
     · A missed action accepted BY VOICE: the walk ends, the panel closes, and the action is followed (brief Q6).
     · THE LIVE FORM HOLDS while the walk runs (window.teckelReviewWalking): its steps go nowhere; when the walk ends
       ("teckel-review-walk"), it sends its current step again.
     · The walk ends, and is forgotten with the stamp, when the panel closes (Close, Escape, close_form), at a lapse or
       sign-out, and with the server's switch off; it tells kev {kind:"walk_control", op:"stop"} then, if a step went out. */
  const RW_OPS = Object.freeze(["accept", "reject", "later", "back", "again", "stop", "close_form", "speak", "quiet"]);
  const RW_DECIDE = Object.freeze(["accept", "reject", "later"]);
  const RW_LINES = Object.freeze(["bulk", "stale", "explicit", "back", "replace", "done"]);

  function rwJoin(a, b){ return [a, b].map(function (x) { return String(x || "").trim(); }).filter(Boolean).join(" "); }

  function walkOf(r){
    const w = (r && r.walk && typeof r.walk === "object" && !Array.isArray(r.walk)) ? r.walk : null;
    if (!w) return null;
    const src = (w.lines && typeof w.lines === "object" && !Array.isArray(w.lines)) ? w.lines : {};
    const lines = {};
    RW_LINES.forEach(function (k) { lines[k] = typeof src[k] === "string" ? src[k].slice(0, 300) : ""; });
    const sh = (w.shown && typeof w.shown === "object") ? w.shown : null;
    const stamp = (sh && typeof sh.fp === "string" && sh.fp && typeof sh.at === "string" && sh.at)
                  ? Object.freeze({ fp: sh.fp.slice(0, 64), at: sh.at.slice(0, 64) }) : null;
    return Object.freeze({ say: typeof w.say === "string" ? w.say.trim().slice(0, 900) : "", lines: Object.freeze(lines),
                           shown: stamp, done: w.done === true });
  }
  function rwList(v){
    if (!Array.isArray(v)) return [];
    const out = [];
    v.forEach(function (x) {
      if (out.length >= 5 || !x || typeof x !== "object" || Array.isArray(x)) return;
      const it = { field: String(x.field === undefined || x.field === null ? "" : x.field).slice(0, 200),
                   label: String(x.label === undefined || x.label === null ? "" : x.label).slice(0, 300),
                   value: String(x.value === undefined || x.value === null ? "" : x.value).slice(0, 600) };
      if (typeof x.reason === "string" && x.reason) it.reason = x.reason.slice(0, 60);
      out.push(it);
    });
    return out;
  }
  // the outcome of a decision, rebuilt from the server's reply: what the RECORD did (the lists), and the item's fate
  function rwOutcome(r, decision){
    const x = (r && typeof r === "object") ? r : {};
    return { decision: RW_DECIDE.indexOf(x.decision) !== -1 ? x.decision : decision,
             status: typeof x.status === "string" ? x.status.slice(0, 20) : "",
             recorded: rwList(x.recorded), unchanged: rwList(x.unchanged), skipped: rwList(x.skipped) };
  }
  function rwSayOf(r){
    if (r && typeof r.say === "string" && r.say.trim()) return r.say.trim().slice(0, 600);
    return (r && r.success === true) ? "" : msgOf(r, "").slice(0, 600);

  function rwItem(after){

    rwShow(after ? after.prefix : "", after ? after.outcome : null);

  function rwDone(after, w){
    if (!rwOn()) return;
    if (rwReady()) {
      const lines = (w && w.lines) || curWalk.lines;
      const payload = { step_id: rwId(), lines: lines };

      payload.done = true;

  function rwEnd(why){
    const mine = rw;

    mine.ended = true; mine.step = null;
    const sent = mine.sentConv > 0 && mine.sentConv === rwConv && rwReady();
    if (sent && why !== "kev" && why !== "done") rwControl("stop");
    // a walk that never ran (no \`walk\` in any reply) changes nothing anyone was told: the panel stays exactly as before
    if (rwWas) { rwLog("the review walk ended (" + why + ")"); rwSync(sent); } else paintRw();
  }
  function rwForget(){ rw = null; curWalk = null; if (rwWas) rwSync(false); else paintRw(); }
  // the current step again, speak:true, with a line first (stale, back); none in this conversation: a new showing
  function rwResay(line){

    setRvBusy(true);

    if (rvBusy) { rwLog("ignored: the last answer is still being dealt with"); return; }
    const st = rw.step, live = !!(st && st.conv === rwConv && !st.spent);
